# Throughput baseline (Gate #3 / WS-D) — on-demand only. Runs the reference sustainable-rate steps (the
# open-loop end-to-end throughput finder) on each store backend, plus the active-passive failover profile on
# the server-DB backends, on CI Linux + Docker PG/SQL Server containers (the reference config the
# TUNING-BASELINE doc names). Each job uploads its METRICS-ONLY report JSON (no message bodies / control
# ids — passes the publish forbidden-content guard); the numbers are transcribed into
# docs/benchmarks/TUNING-BASELINE.md + committed under docs/benchmarks/results/.
#
# Manual: `gh workflow run benchmark.yml --ref <branch>` (heavy + container-bound, so never on push/PR).
name: throughput-baseline

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # A modest, documented fan-out for the reference run (each inbound → a couple of outbound deliveries),
  # so the run characterizes a fan-out estate without the co-located DB container being swamped (the
  # delivery path — a fresh connection per delivery + a server-DB round-trip per stage — is the ceiling).
  MEFOR_LOAD_FANOUT: "2"
  MEFOR_LOAD_RESULTS_FANOUT: "1"
  MEFOR_LOAD_TRANSFORM: edit

jobs:
  baseline-sqlite:
    name: baseline (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # --constraint constraints.lock for the reason spelled out in ci.yml's "Set up uv" step: a bare
      # `-e ".[extras]"` re-resolves from pyproject's `>=` floors and adopts whatever upstream shipped
      # since. A benchmark leg is the worst place for that — a silent dependency change reads as a
      # performance regression. Every install in EVERY workflow is constrained except freethread-smoke,
      # which is deliberately unconstrained (see the note at its install step).
      - name: Install project (dev)
        run: |
          python -m pip install --upgrade pip
          pip install --constraint constraints.lock -e ".[dev]"
      - name: Environment stamp
        run: |
          mkdir -p out/load
          { echo "## sqlite"; uname -a; python --version; python -c "import sqlite3,sys; print('sqlite', sqlite3.sqlite_version)"; git rev-parse HEAD; } | tee out/load/env-sqlite.txt
      - name: Serve (SQLite) + reference rate-steps
        env:
          MEFOR_SECURITY_REQUIRE_SIGN_IN: "false"
          MEFOR_LOAD_SINK_PORT: "2700"
          # THE PHI POSTURE'S GATES, provisioned the way ci.yml's `load test (smoke, sqlite)` leg does.
          # `serve --env dev` runs the secure PHI posture, so a keyless start, an unbounded retention
          # window and an unlisted egress each refuse at start. That leg's comment carries the reasoning;
          # this leg copies its provisions and adds nothing. The store key is minted in `run:` below.
          # The security-notification gate is skipped because auth is off (no accounts to notify).
          MEFOR_SECURITY_DELETE_MESSAGE_BODIES_AFTER_DAYS: "30"
          MEFOR_RETENTION_DEAD_LETTER_DAYS: "30"
          MEFOR_SECURITY_BLOCK_UNLISTED_OUTBOUND: "true"
          MEFOR_EGRESS_ALLOWED_MLLP: "127.0.0.1"  # the load graph fans out to the loopback correlation sink
        run: |
          set -o pipefail
          # Mint a throwaway AES-256 store key at runtime; never a committed literal (gitleaks).
          # 32 random bytes, base64 -- the MEFOR_STORE_ENCRYPTION_KEY format. serve refuses without one.
          export MEFOR_STORE_ENCRYPTION_KEY="$(python -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())')"
          # THE ENGINE ALWAYS SERVES TLS (ADR 0172) and mints a self-signed pair beside [store].path on
          # first run. This step used to probe http://, so it talked cleartext at a TLS socket and never
          # got an answer. The relative --db below is anchored under the project root, which on a hosted
          # runner is $GITHUB_WORKSPACE -- measured by ci.yml's sqlite load leg (run 33511381948), whose
          # comment records the logged path. `-k` would also go green and is the wrong repair: verifying
          # the certificate the engine actually serves is part of "the engine came up".
          cert="$GITHUB_WORKSPACE/api-generated-cert.pem"
          key="$GITHUB_WORKSPACE/api-generated-key.pem"
          # The harness pins that same pair through these two variables (harness/load/tlsmat.py,
          # inherited branch), exactly as ci.yml's load legs do. PR 1502 adds a `--cacert PEM` flag for
          # this; switch to `--cacert "$cert"` once it is on main.
          export MEFOR_HARNESS_TLS_CERT_FILE="$cert"
          export MEFOR_HARNESS_TLS_KEY_FILE="$key"
          python -m messagefoundry serve --config harness/config/load --env dev --db ./bench.db \
            --host 127.0.0.1 --port 8765 > engine.log 2>&1 &
          engine_pid=$!
          # The certificate is minted during startup, so a miss on the first turns is ordinary.
          ready=
          for _ in $(seq 1 60); do
            curl -fsS --max-time 5 --cacert "$cert" https://127.0.0.1:8765/health > /dev/null 2>&1 && { ready=1; break; } || sleep 0.5
          done
          set +e
          if [ -n "$ready" ]; then
            python -m harness --load reference --engine https://127.0.0.1:8765 --sink-port 2700 \
              --db-backend sqlite --report-json out/load/reference-sqlite.json --report-csv out/load/reference-sqlite.csv
          else
            echo "::error::engine /health never answered over https verified against the pinned certificate $cert"
          fi
          set -e
          kill "$engine_pid" 2>/dev/null || true
          wait "$engine_pid" 2>/dev/null || true
          echo "===== engine log (tail) ====="; tail -40 engine.log || true
          # A never-ready engine fails the step. The old loop could not fail, so a dead engine produced a
          # green run with no report. The harness's own exit stays unpropagated, as before.
          [ -n "$ready" ]
      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: baseline-sqlite
          path: out/load/
          if-no-files-found: ignore

  baseline-postgres:
    name: baseline (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: mefor
          POSTGRES_DB: messagefoundry
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MEFOR_STORE_BACKEND: postgres
      MEFOR_STORE_SERVER: localhost
      MEFOR_STORE_PORT: "5432"
      MEFOR_STORE_DATABASE: messagefoundry
      MEFOR_STORE_USERNAME: postgres
      MEFOR_STORE_PASSWORD: mefor
      MEFOR_STORE_POOL_SIZE: "40"  # track the shipped default (ADR 0062: 5 -> 40)
      MEFOR_STORE_ENCRYPT: "false"  # plaintext to the container; the TLS-hardening guard needs the escape
      MEFOR_ALLOW_INSECURE_TLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install project (dev + postgres)
        run: |
          python -m pip install --upgrade pip
          pip install --constraint constraints.lock -e ".[dev,postgres]"
      - name: Environment stamp
        run: |
          mkdir -p out/load
          { echo "## postgres"; uname -a; python --version; psql --version 2>/dev/null || echo "psql n/a"; git rev-parse HEAD; } | tee out/load/env-postgres.txt
      - name: Mint a throwaway store key for this job
        # ONE key for the whole job, because the reference step and the failover nodes open the SAME
        # server database. The first keyed open keys its audit chain, and a later keyless append is
        # refused (store.py, "audit chain is keyed ... refusing to append"). A key minted inside the
        # reference step would leave the failover nodes, which inherit this job's environment, keyless.
        # Never a committed literal (gitleaks); 32 random bytes, base64. Masked before it is written.
        run: |
          key="$(python -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())')"
          echo "::add-mask::$key"
          echo "MEFOR_STORE_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
      - name: Serve (Postgres) + reference rate-steps
        env:
          MEFOR_SECURITY_REQUIRE_SIGN_IN: "false"
          MEFOR_LOAD_SINK_PORT: "2700"
          # THE ENFORCEMENT DIAL, and why this leg needs it. The store hop to the Postgres container is
          # weakened TLS (job env above). Under the shipped `enforce`, the MEFOR_ALLOW_INSECURE_TLS
          # escape is clamped inert (ADR 0092 decision 2), so serve refuses at store open. `warn` honors
          # the escape and still reports every gate. ci.yml's `load test (smoke, sqlserver)` leg carries
          # the full reasoning, including why no narrower fix exists for a `services:` container.
          MEFOR_SECURITY_ENFORCEMENT: "warn"
          # The PHI posture's gates, provisioned as in the sqlite leg. The store key is the job's, minted above.
          MEFOR_SECURITY_DELETE_MESSAGE_BODIES_AFTER_DAYS: "30"
          MEFOR_RETENTION_DEAD_LETTER_DAYS: "30"
          MEFOR_SECURITY_BLOCK_UNLISTED_OUTBOUND: "true"
          MEFOR_EGRESS_ALLOWED_MLLP: "127.0.0.1"  # the load graph fans out to the loopback correlation sink
        run: |
          set -o pipefail
          # MEFOR_STORE_ENCRYPTION_KEY comes from the job's mint step above.
          # https + pinned, as in the sqlite leg. This step passes no --db, so [store].path keeps its
          # default relative "messagefoundry.db" and the minted pair lands under $GITHUB_WORKSPACE
          # (measured on ci.yml's sqlserver load leg, run 33511381948). serve derives the pair's
          # directory from [store].path whatever the backend, so this holds for Postgres as well.
          # MEFOR_ALLOW_INSECURE_TLS in the job env is the engine's escape for the hop it DIALS to the
          # database. It has no reach over this hop, which is a client reaching the engine's API.
          cert="$GITHUB_WORKSPACE/api-generated-cert.pem"
          key="$GITHUB_WORKSPACE/api-generated-key.pem"
          export MEFOR_HARNESS_TLS_CERT_FILE="$cert"
          export MEFOR_HARNESS_TLS_KEY_FILE="$key"
          python -m messagefoundry serve --config harness/config/load --env dev \
            --host 127.0.0.1 --port 8765 > engine.log 2>&1 &
          engine_pid=$!
          ready=
          for _ in $(seq 1 60); do
            curl -fsS --max-time 5 --cacert "$cert" https://127.0.0.1:8765/health > /dev/null 2>&1 && { ready=1; break; } || sleep 0.5
          done
          set +e
          if [ -n "$ready" ]; then
            python -m harness --load reference --engine https://127.0.0.1:8765 --sink-port 2700 \
              --db-backend postgres --report-json out/load/reference-postgres.json --report-csv out/load/reference-postgres.csv
          else
            echo "::error::engine /health never answered over https verified against the pinned certificate $cert"
          fi
          set -e
          kill "$engine_pid" 2>/dev/null || true
          wait "$engine_pid" 2>/dev/null || true
          echo "===== engine log (tail) ====="; tail -40 engine.log || true
          [ -n "$ready" ]
      - name: Failover profile (two nodes, kill primary mid-load)
        # Runs even when the reference step failed: it starts its own serve nodes, so a reference
        # engine that never came up says nothing about it.
        if: ${{ !cancelled() }}
        run: |
          set +e
          python -m harness --failover failover --db-backend postgres \
            --report-json out/load/failover-postgres.json
          echo "failover exit: $?"
          set -e
      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: baseline-postgres
          path: out/load/
          if-no-files-found: ignore

  baseline-sqlserver:
    name: baseline (sqlserver)
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Str0ng_P@ssw0rd!"
        ports:
          - 1433:1433
    env:
      MEFOR_STORE_BACKEND: sqlserver
      MEFOR_STORE_SERVER: localhost
      MEFOR_STORE_PORT: "1433"
      MEFOR_STORE_DATABASE: MessageFoundry
      MEFOR_STORE_AUTH: sql
      MEFOR_STORE_USERNAME: sa
      MEFOR_STORE_PASSWORD: "Str0ng_P@ssw0rd!"
      MEFOR_STORE_POOL_SIZE: "40"  # track the shipped default (ADR 0062: 5 -> 40)
      MEFOR_STORE_TRUST_SERVER_CERTIFICATE: "true"
      MEFOR_ALLOW_INSECURE_TLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Microsoft ODBC Driver 18 + sqlcmd
        # THIS IS THE DANGEROUS HALF OF THE apt CLASS, and it is the opposite of the one that was
        # visibly hurting. The Qt sites sit in jobs carrying a job-level `timeout-minutes`, so a
        # mirror hang there dies at the job cap (20-40 min, measured). THIS JOB HAS NO JOB-LEVEL
        # TIMEOUT, so the same hang runs to GitHub's 360-minute default -- a whole runner-hour
        # budget burned on a stalled mirror, on a leg nobody is watching because it is path-gated.
        #
        # The step cap bounds EVERY command here, including the two curls, which are equally
        # unguarded network calls. The retry wraps only the apt pair: re-running that is idempotent,
        # whereas re-fetching the signing key and repo list is not the part that hangs.
        #
        # THE DEEPER FIX IS A JOB-LEVEL `timeout-minutes` ON THIS JOB, which would bound every step
        # rather than the one that bit. Deliberately NOT done here: choosing that number needs a
        # measurement of how long this job legitimately runs, and a guessed cap on a server-DB leg
        # would kill real work. Recorded as a direction, not applied as a guess.
        timeout-minutes: 10
        run: |
          # PIPEFAIL: `sudo tee` returns 0 for an empty write, so an unguarded pipe would leave an
          # EMPTY apt source and let the loop below blame the Ubuntu mirror for it. Why this is safe
          # here, and why `changes` is deliberately OFF pipefail, with the mechanism:
          # tests/test_ci_odbc_installer_pipefail.py
          #
          # NO --retry ON THESE TWO CURLS, deliberately: curl cannot rewind stdout, so a retry after
          # a partial transfer writes the fragment AND the retried body through `tee`, leaving a
          # corrupt key while curl exits 0 -- which pipefail cannot see. Retry belongs with a
          # -o <file> fetch, not a piped one.
          set -o pipefail
          curl -fsSL --max-time 60 https://packages.microsoft.com/keys/microsoft.asc \
            | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          curl -fsSL --max-time 60 "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release; echo "$VERSION_ID")/prod.list" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get update && sudo ACCEPT_EULA=Y timeout 240 apt-get install -y msodbcsql18 mssql-tools18 unixodbc-dev; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt}/3 failed or timed out; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::apt-get failed 3 times. This is the UBUNTU RUNNER MIRROR, not the change under test."
          exit 1
      - name: Wait for SQL Server and create the database (RCSI on)
        run: |
          sqlcmd=/opt/mssql-tools18/bin/sqlcmd
          for i in $(seq 1 40); do
            if "$sqlcmd" -S localhost -U sa -P 'Str0ng_P@ssw0rd!' -C -Q "SELECT 1" > /dev/null 2>&1; then echo "up"; break; fi
            echo "waiting ($i)"; sleep 2
          done
          "$sqlcmd" -S localhost -U sa -P 'Str0ng_P@ssw0rd!' -C \
            -Q "IF DB_ID('MessageFoundry') IS NULL CREATE DATABASE MessageFoundry; ALTER DATABASE MessageFoundry SET READ_COMMITTED_SNAPSHOT ON WITH ROLLBACK IMMEDIATE;"
      - name: Install project (dev + sqlserver)
        run: |
          python -m pip install --upgrade pip
          pip install --constraint constraints.lock -e ".[dev,sqlserver]"
      - name: Environment stamp
        run: |
          mkdir -p out/load
          { echo "## sqlserver"; uname -a; python --version; git rev-parse HEAD; } | tee out/load/env-sqlserver.txt
      - name: Mint a throwaway store key for this job
        # ONE key for the whole job, because the reference step and the failover nodes open the SAME
        # server database. The first keyed open keys its audit chain, and a later keyless append is
        # refused (store.py, "audit chain is keyed ... refusing to append"). A key minted inside the
        # reference step would leave the failover nodes, which inherit this job's environment, keyless.
        # Never a committed literal (gitleaks); 32 random bytes, base64. Masked before it is written.
        run: |
          key="$(python -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())')"
          echo "::add-mask::$key"
          echo "MEFOR_STORE_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
      - name: Serve (SQL Server) + reference rate-steps
        env:
          MEFOR_SECURITY_REQUIRE_SIGN_IN: "false"
          MEFOR_LOAD_SINK_PORT: "2700"
          # THE ENFORCEMENT DIAL, and why this leg needs it. The store hop to the SQL Server container is
          # weakened TLS (job env above). Under the shipped `enforce`, the MEFOR_ALLOW_INSECURE_TLS
          # escape is clamped inert (ADR 0092 decision 2), so serve refuses at store open. `warn` honors
          # the escape and still reports every gate. ci.yml's `load test (smoke, sqlserver)` leg carries
          # the full reasoning, including why no narrower fix exists for a `services:` container.
          MEFOR_SECURITY_ENFORCEMENT: "warn"
          # The PHI posture's gates, provisioned as in the sqlite leg. The store key is the job's, minted above.
          MEFOR_SECURITY_DELETE_MESSAGE_BODIES_AFTER_DAYS: "30"
          MEFOR_RETENTION_DEAD_LETTER_DAYS: "30"
          MEFOR_SECURITY_BLOCK_UNLISTED_OUTBOUND: "true"
          MEFOR_EGRESS_ALLOWED_MLLP: "127.0.0.1"  # the load graph fans out to the loopback correlation sink
        run: |
          set -o pipefail
          # MEFOR_STORE_ENCRYPTION_KEY comes from the job's mint step above.
          # https + pinned, as in the sqlite leg. This step passes no --db, so [store].path keeps its
          # default relative "messagefoundry.db" and the minted pair lands under $GITHUB_WORKSPACE
          # (measured on ci.yml's sqlserver load leg, run 33511381948). serve derives the pair's
          # directory from [store].path whatever the backend, so this holds for SQL Server as well.
          # MEFOR_ALLOW_INSECURE_TLS in the job env is the engine's escape for the hop it DIALS to the
          # database. It has no reach over this hop, which is a client reaching the engine's API.
          cert="$GITHUB_WORKSPACE/api-generated-cert.pem"
          key="$GITHUB_WORKSPACE/api-generated-key.pem"
          export MEFOR_HARNESS_TLS_CERT_FILE="$cert"
          export MEFOR_HARNESS_TLS_KEY_FILE="$key"
          python -m messagefoundry serve --config harness/config/load --env dev \
            --host 127.0.0.1 --port 8765 > engine.log 2>&1 &
          engine_pid=$!
          ready=
          for _ in $(seq 1 60); do
            curl -fsS --max-time 5 --cacert "$cert" https://127.0.0.1:8765/health > /dev/null 2>&1 && { ready=1; break; } || sleep 0.5
          done
          set +e
          if [ -n "$ready" ]; then
            python -m harness --load reference --engine https://127.0.0.1:8765 --sink-port 2700 \
              --db-backend sqlserver --report-json out/load/reference-sqlserver.json --report-csv out/load/reference-sqlserver.csv
          else
            echo "::error::engine /health never answered over https verified against the pinned certificate $cert"
          fi
          set -e
          kill "$engine_pid" 2>/dev/null || true
          wait "$engine_pid" 2>/dev/null || true
          echo "===== engine log (tail) ====="; tail -40 engine.log || true
          [ -n "$ready" ]
      - name: Failover profile (two nodes, kill primary mid-load)
        # Runs even when the reference step failed: it starts its own serve nodes, so a reference
        # engine that never came up says nothing about it.
        if: ${{ !cancelled() }}
        run: |
          set +e
          python -m harness --failover failover --db-backend sqlserver \
            --report-json out/load/failover-sqlserver.json
          echo "failover exit: $?"
          set -e
      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: baseline-sqlserver
          path: out/load/
          if-no-files-found: ignore

# Runs the route-walk and thread-pool guards against the OLDEST releases pyproject.toml allows
# (vault BACKLOG #3055). The test legs in ci.yml install through constraints.lock, so none of them
# shows whether the floors pyproject.toml declares still install and still pass.
# The FastAPI floor is the case that filed this. It rests on names the route walk reads from
# FastAPI, and only a run at the floor shows those names are there.
#
# ADVISORY. This job's context is not in `.github/required-contexts.txt`, which is the only thing
# that gates a merge. It runs on a pull request only when a dependency declaration or one of the
# guards it exists for changes, and weekly, because an upstream yank or a new release can break a
# floor with no commit here.
#
# DELIBERATELY UNCONSTRAINED. `--constraint constraints.lock` is right on every other install in
# this repository and wrong here: it pins each version to the lock, so the run would measure the lock
# a second time. `--resolution lowest-direct` takes the lowest release each DIRECT dependency allows
# (the engine's own and its [dev] extra) and the newest of everything else.
#
# NO OVERRIDE AND NO `--raised` ENTRY. The four floors that did not install on Python 3.14 were
# raised in pyproject.toml (vault BACKLOG #3177), so this leg installs the floors exactly as declared.
# If one stops installing, raise it there rather than adding an override here. The floor check reads
# only runtime dependencies, so a [dev] floor that does not hold surfaces only as a failed install.
#
# A red weekly run reaches nobody on its own, so nightly-notice.yml watches this workflow by name.
name: dependency floors

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "packaging/messagefoundry-webconsole/pyproject.toml"
      # The engine surface the guards walk: a change here can use a FastAPI or Starlette feature
      # newer than the floor.
      - "messagefoundry/api/**"
      - "messagefoundry/auth/**"
      - "messagefoundry_webconsole/**"
      - "tests/conftest.py"
      - "scripts/security/route_gates.py"
      - "scripts/ci/check_dependency_floors.py"
      - "tests/test_route_gates.py"
      - "tests/test_thread_pool_fairness_baseline.py"
      - "tests/test_check_dependency_floors.py"
      - ".github/workflows/dependency-floors.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

concurrency:
  # Per-ref for pull-request events so a re-push supersedes its own run; a unique group for a
  # scheduled or dispatched run so it is never superseded. Nothing here is required.
  group: dependency-floors-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  floors:
    name: dependency floors (advisory)
    runs-on: ubuntu-latest
    # The install is the slow part; the tests take seconds. Bounded so a hung build cannot hold a
    # runner.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: |
            pyproject.toml
            packaging/messagefoundry-webconsole/pyproject.toml
      - name: Install the engine at its declared floors
        id: install
        run: |
          set -euo pipefail
          uv pip install --system --resolution lowest-direct \
            -e ".[dev]" -e packaging/messagefoundry-webconsole
      - name: Check every runtime dependency sits at its floor
        run: |
          set -euo pipefail
          python scripts/ci/check_dependency_floors.py
      # The two steps below run even when the floor check reds, so one unrelated dependency off its
      # floor does not hide whether the engine works at the FastAPI floor this leg was filed for.
      - name: Import the engine, the web console and the route walk
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          python -c "import messagefoundry.api.app, messagefoundry_webconsole, scripts.security.route_gates"
      - name: Run the route-walk and thread-pool guards
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          python -m pytest -p no:cacheprovider tests/test_route_gates.py tests/test_thread_pool_fairness_baseline.py tests/test_check_dependency_floors.py

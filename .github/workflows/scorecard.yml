name: Scorecard

# OpenSSF Scorecard — a holistic supply-chain hygiene score (Pinned-Dependencies, Dangerous-Workflow,
# Token-Permissions, Branch-Protection, Maintained, SAST-present, ...). It validates the hardening this
# repo already does (SHA-pinned Actions, least-privilege tokens) and catches regressions, and yields a
# public OpenSSF badge.
#
# WHY GUARDED TO THE REPO SLUG: like CodeQL, Scorecard uploads SARIF to GitHub code scanning (paid GHAS
# on a private repo) and `publish_results: true` requires a PUBLIC repo. THIS repo is public, so both
# are free here; the slug gate keeps it a skipped no-op anywhere else — a fork, or the retired private
# archive. Every check now assesses this repo directly, including Branch-Protection.
#
# (Pre-cutover MEFORORG was the published mirror, so the Branch-Protection score reflected the MIRROR's
# settings rather than the private source's, and this file only ran once publish.ps1 copied it across.
# Both caveats are obsolete: there is one repo, and the publish machinery was deleted.)
#
# PINNING: every step below is SHA-pinned -- actions/checkout, ossf/scorecard-action and
# github/codeql-action/upload-sarif alike. This was a PINNING CAVEAT saying the latter two were "on
# version tags pending a SHA-pin lookup"; that was true when written and has been false since they
# were pinned. It also named actions/upload-artifact, which this workflow no longer uses.
#
# NO `push:` ARM, DELETED DELIBERATELY AND NOT AN OVERSIGHT. It read `push: branches: [main]`, and
# against roughly 23 merges a day that turned a workflow declaring a WEEKLY cron into 167 runs a week
# -- about 164 of them measuring a posture that had not moved. Scorecard scores repository hygiene
# (Pinned-Dependencies, Token-Permissions, Branch-Protection, Maintained), which changes on the scale
# of a policy edit, not of a merge. NO SCAN IS DROPPED: the weekly cron still produces the badge and
# the SARIF, `branch_protection_rule` still fires on the one event most likely to move the score, and
# `workflow_dispatch` re-runs it on demand. The saving is runner SLOTS, which is the contended
# resource here -- this account's peak concurrency is 20, the free-plan ceiling, and a merge-queue
# entry waits behind anything holding one.
on:
  branch_protection_rule:
  schedule:
    - cron: "0 8 * * 1" # weekly (Mon 08:00 UTC)
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # ONLY on this repo — public, so code scanning and the badge are free; skipped no-op on a fork.
    if: github.repository == 'MEFORORG/MessageFoundry'
    runs-on: ubuntu-latest
    # Hang backstop against GitHub's 360-minute default; security.yml's `jobs:` note carries the
    # reasoning. Above the floor because the analysis makes many API calls and is rate-limit-bound.
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF results to code scanning
      id-token: write # publish results to the public OpenSSF Scorecard API (the badge)
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code scanning
        # THE ONLY DESTINATION FOR THIS SARIF, and until 2026-09-13 there was a second one: a
        # `scorecard-sarif` artifact uploaded by the step that used to sit here, 1,009 stored copies
        # of it, read by nothing. Unread is not by itself a defect -- most artifacts in this
        # repository are diagnostics a human downloads, and that is a real consumer. This one was
        # REDUNDANT, which is a different finding: code scanning holds the same findings and is what
        # a human actually queries, and `publish_results: true` above additionally sends the score to
        # the public OpenSSF API. A third copy on a retention clock served neither reader.
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif

# Backlog status hygiene — stop `docs/BACKLOG.md` from lying about build state.
#
# WHY. Work ships, the item's banner is never updated, and the backlog goes on describing finished
# work as open. A 2026-07-09 audit found 11 items misfiled as open — including #60 (turnkey DR),
# which shipped with ADR 0049 and a working `backup` / `restore-verify` CLI while its banner still
# read "PRE-RESERVED, owner-gated". That stale banner was then repeated as fact in a merged PR. The
# same rot left the Corepoint gap analysis ~22% obsolete. A doc that lies about build state is worse
# than no doc: it silently misdirects planning.
#
# TWO HALVES.
#   * The STRUCTURAL half ("every item declares exactly one status") is enforced by pytest —
#     `tests/test_backlog_status_check.py` runs the checker against the real file on every PR, so it
#     rides the existing test matrix and needs no job here.
#   * The BEHAVIOURAL half is here, because only the PR context can see it: if a PR claims to
#     implement a backlog item (`BACKLOG #N` in its title or body) and touches engine/IDE code, then
#     it must also update `docs/BACKLOG.md`. That is the step whose omission caused #60.
#
# THE JOB BELOW NOW RUNS TWO CHECKS, and its `name:` describes only the first. That is deliberate and
# must stay: the name is the branch-protection CONTEXT STRING, so renaming it makes the required
# context stop reporting and wedges every PR (see .github/required-contexts.txt). The second check is
# the CITATION gate (BACKLOG #1095) — every backlog number this PR adds beside a ledger path must
# name the file that item actually lives in. It rides this job rather than a new one for the same
# reason: an unrequired context is decoration, since auto-merge blocks only on required ones, and
# adding one to branch protection is not an in-repo change.
#
# Read-only. No secrets. Workflow expressions are hoisted into `env` and never interpolated into a
# `run:` body (zizmor: a PR title/body is attacker-controlled on a fork PR and must arrive as data).
name: backlog-hygiene

on:
  # BACKLOG #340 step 1. THE QUEUE IS LIVE, SO THIS TRIGGER IS LOAD-BEARING -- DO NOT REMOVE IT.
  # This job's name is a REQUIRED context, and branch protection evaluates required contexts on the
  # MERGE-GROUP commit, so removing this trigger means the context never reports in the queue and
  # NOTHING MERGES. That is not hypothetical: codeql.yml's header records PR 619 sitting
  # AWAITING_CHECKS on the queue's first entry with its CodeQL contexts simply absent.
  #
  # WHAT THIS JOB CHECKS ON merge_group IS NOT WHAT IT CHECKS ON A PULL REQUEST. Its question --
  # "does THIS pull request update BACKLOG.md" -- has no subject in a merge group, where every
  # `github.event.pull_request.*` field is null. The enforcement that matters therefore happens on
  # the `pull_request` run; the queue-time run is what keeps the required context reporting. The
  # concurrency note below is the other half of that story, and it was measured the hard way.
  #
  # THIS COMMENT USED TO SAY "INERT UNTIL A MERGE QUEUE EXISTS ... behaves identically today".
  # That was true when the trigger landed on 2026-08-26 and became false once a queue was
  # configured; corrected 2026-09-03, after PR 754 merged through the queue. BACKLOG #340 carries
  # the measurements and STAYS OPEN -- a live queue is not that item being finished, and who
  # enabled the queue is recorded nowhere.
  merge_group:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # KEYED ON github.ref, NOT ON THE PR NUMBER, AND THAT IS THE WHOLE FIX. This workflow also runs on
  # `merge_group`, where `github.event.pull_request` DOES NOT EXIST -- so the old key evaluated to the
  # bare string "backlog-hygiene-" for EVERY queue entry, and `cancel-in-progress` then made each new
  # entry cancel the previous entry's run.
  #
  # This job's name is a REQUIRED status context ("a PR that implements BACKLOG #N must update
  # BACKLOG.md"), and a cancelled required check can never go green, so the cancelled entry was
  # EVICTED from the merge queue. It never failed. It was cancelled by its successor.
  #
  # MEASURED over 754 `merge_group` runs: 151 backlog-hygiene runs, 102 success, 49 CANCELLED
  # (32.5 percent), ZERO failures. Every other workflow on that event cancels at 0.0 percent except
  # CI at 4.0. Two evictions were chased by hand the night this was found, one of them 50 seconds
  # after the entry was queued -- far too fast for any check to have run, which is the tell.
  #
  # `github.ref` is unique per queue entry (`refs/heads/gh-readonly-queue/main/pr-N-<sha>`) and stable
  # per pull request (`refs/pull/N/merge`), so supersede-on-push is preserved and entries stop
  # cancelling each other. It is also what asvs-prove-absences, asvs-tally-lint, freethread-smoke and
  # manifest-lint already use; this workflow was the only merge_group one keyed on the PR number.
  group: backlog-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banner-on-implementation:
    # QUOTED: an unquoted YAML scalar ends at " #" (comment start), which silently truncated this to
    # "a PR that implements BACKLOG". The job name is the required-status-check *context* string, so
    # a truncated name is what you would have to add to branch protection.
    name: "a PR that implements BACKLOG #N must update BACKLOG.md"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a backlog update when a PR claims to implement an item
        env:
          # Hoisted, never interpolated into the script body (zizmor: template injection).
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Does this PR *claim* to implement a backlog item? Only the explicit `BACKLOG #N` token
          # counts — a bare `#123` is ambiguous in this repo (it is usually a PR number).
          #
          # EVERY CITED ITEM, NOT JUST THE FIRST (BACKLOG #1347). The house form is
          # `(BACKLOG #1319, #1322, #1323, #1331)`: the prefix appears ONCE and the siblings carry a
          # bare `#N`. `grep -oiE 'BACKLOG #[0-9]+' | head -1` saw #1319 and none of the other three,
          # so a four-item PR was told to update one banner while four were owed. The repo already
          # solved this for the claim gate -- scripts/hooks/claim_check.py takes every `#N` AFTER the
          # BACKLOG token -- and that rule is reused here.
          #
          # SCOPED TO THE PARENTHETICAL, WHICH claim_check.py DOES NOT NEED TO BE AND THIS DOES.
          # A squash-merge appends the pull-request number as a trailing group, so a landed subject
          # reads `(BACKLOG #1040) (#547)`. Taking every `#N` after the token would claim item #547.
          # claim_check.py is safe from that only by TIMING -- it runs at commit-msg time, before the
          # suffix exists -- while this gate reads a PR title that can already carry one. Measured
          # over `git log --all` on 2026-08-25: the unscoped rule calls 641 subjects multi-item, the
          # parenthetical-scoped rule calls 38 of 1070. A ~17x inflation, and every one of those 603
          # extra would be a demand to update the banner of a pull-request number.
          # SPLIT ON `)` RATHER THAN MATCHING `\(BACKLOG...\)`, for two independent reasons.
          #
          # 1. It scopes without a regex. Each `)` ends a group, so the line carrying BACKLOG holds
          #    exactly that group's numbers and the trailing squash group `(#547)` becomes its own
          #    line with no BACKLOG token -- excluded by the grep rather than by a lookahead.
          # 2. A pattern containing literal parens CANNOT be written here.
          #    tests/test_security_posture.py::test_required_jobs_have_no_neutered_steps strips
          #    command substitutions before applying its `|| true` rule, because `x="$(... || true)"`
          #    is the idiomatic guard for grep exiting 1 on no-match under `set -euo pipefail`. Its
          #    substitution regex stops at the FIRST `)`, so any close-paren earlier in the line --
          #    in a grep pattern OR in a quoted `tr` argument -- orphans the `|| true` and the
          #    required gate reports a false positive on a correct script. Hence `\051`, the octal
          #    escape for `)`: it leaves the substitution's own closing paren as the first one on the
          #    line, which is what that strip is written to find. Measured: the literal-paren forms
          #    failed that gate, this one passes it.
          #    THIS IS A REAL LIMITATION IN THAT DETECTOR, not a quirk of this file -- any required
          #    step whose command substitution quotes a `)` hits it. Reported, not worked around
          #    silently.
          #
          # It also removes the need for a no-parenthetical fallback: a subject with no parens at all
          # is one line, and it still carries its BACKLOG token.
          # A MENTION IS NOT A CLAIM, so strip code before extracting (BACKLOG #1296). A token
          # written in backticks to DISCUSS this gate, or quoted inside a fenced block to show
          # this job's own error output, was indistinguishable from one written to CLAIM an item.
          # This is a REQUIRED check, so that direction is a false DENY on a compliant pull
          # request -- the direction that gets acted on, where a false pass is merely believed.
          # It fired for real on PR #428: the paragraph explaining this gate is what tripped it.
          #
          # THE RULE IS NOT INVENTED HERE. `backlog_citation_check.py`, a LATER STEP OF THIS SAME
          # JOB, already draws this line for citations -- fenced blocks by toggle, inline spans by
          # position -- and its own record says a same-line rule was tried first and read generic
          # prose as a citation. That lesson never moved upward inside this file. This is that
          # rule one stage earlier, so the two halves of one job stop disagreeing about what
          # counts as text.
          #
          # STRIPPING MUST PRECEDE THE OCTAL-ESCAPED SPLIT, not follow it: a fence marker is a
          # whole LINE, and splitting on close-paren first can cut one in half. A close-paren
          # inside a code span is dropped WITH the span, which is correct -- it never delimited a
          # group. The scoping this preserves is BACKLOG #1347's and must not be disturbed.
          #
          # NO CLOSE-PAREN APPEARS INSIDE THE STRIP SUBSTITUTION, deliberately. See the zizmor
          # note above: one appearing before a substitution's own closer orphans a trailing
          # '|| true' and reds a required gate on a correct script. Neither expression needs one,
          # which is why the strip is its own line rather than another stage on the pipeline that
          # carries the guard.
          prose="$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | awk '/^[[:space:]]*```/ { f = 1 - f; next } f { next } { print }' | sed 's/`[^`]*`/ /g')"
          items="$(printf '%s' "$prose" | tr '\051' '\n' | grep -i BACKLOG | grep -oE '#[0-9]+' | tr -d '#' | sort -un || true)"
          claim="$(printf '%s' "$items" | head -1 | sed 's/^/BACKLOG #/')"
          if [ -z "$items" ]; then
            echo "No 'BACKLOG #N' claim in this PR — nothing to enforce."
            echo "(If this PR completes a backlog item, say so with 'BACKLOG #N' and update its banner.)"
            exit 0
          fi

          # THREE-dot, deliberately. The two-dot form asks "how do these two trees differ", which
          # includes everything main gained since this PR branched -- as a REVERSE delta on paths the
          # PR never touched. Any main-side change to docs/BACKLOG.md (the archive move being one
          # large one) would then be credited to every open PR with an older base, and this gate would
          # pass while enforcing nothing. Three-dot asks the question actually being posed: what did
          # THIS PR change relative to the merge base. `ci.yml` already uses three-dot for the same
          # question. fetch-depth: 0 above guarantees the merge base is present.
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          touches_code=false
          case "$changed" in
            *messagefoundry/*|*ide/*|*messagefoundry_webconsole/*) touches_code=true ;;
          esac

          if [ "$touches_code" != true ]; then
            echo "PR claims '$claim' but changes no engine/IDE code — no banner update required."
            exit 0
          fi

          # The item's banner lives in docs/BACKLOG.md while the item is open, and moves verbatim into
          # docs/archive/backlog/ once it is retired. Updating a retired item's banner is a legitimate
          # satisfaction of this rule, so both locations count -- otherwise the one PR shape that
          # correctly amends an archived item fails a REQUIRED check with no way to comply.
          # A HERE-STRING, NOT A PIPE, AND THE DIFFERENCE IS A LIVE DEFECT THIS GATE HAD.
          # `printf ... | grep -q` fails BECAUSE the match succeeds. `grep -q` exits the instant it
          # matches, which closes the pipe; `printf` is still writing, so its next write fails with
          # "write error: Broken pipe"; and `set -o pipefail` (line 99) then takes the pipeline's
          # status from the FAILING member. A match is reported as a miss, and this gate tells the
          # author their PR does not touch docs/BACKLOG.md at the exact moment it has proved that it
          # does.
          #
          # It needs the list to be long enough that printf is still writing when grep quits, so it
          # scales with PR size. Measured 2026-09-10 on PR 1020: a 1,531-file diff whose match sat at
          # line 19, leaving 1,512 lines still to write. Attempts 1 and 3 both failed identically, so
          # IT IS NOT A FLAKE AND A RE-RUN DOES NOT CLEAR IT.
          #
          # DO NOT cite that gate's earlier green on this same branch as a contrast: that run exited
          # at the "No 'BACKLOG #N' claim" branch above and never reached this line, so it is
          # evidence of nothing here. That mistake was made and corrected while diagnosing this, and
          # it is recorded because the wrong version is the more natural thing to write.
          #
          # What DID establish the content was fine: running this gate's own logic, with the SHAs
          # from its own failing log, against a full clone -- it passes there and prints
          # docs/BACKLOG.md at line 19 of `changed`.
          #
          # A here-string has no second process and no pipe, so there is nothing to break. Do not
          # "simplify" it back into a pipe.
          if grep -qE '^(docs/BACKLOG\.md|docs/archive/backlog/.+\.md)$' <<< "$changed"; then
            echo "OK — PR claims '$claim', touches code, and updates the backlog item namespace."
            exit 0
          fi

          n="$(printf '%s' "$items" | head -1)"
          all_items="$(printf '%s' "$items" | tr '\n' ' ' | sed 's/ *$//')"
          count="$(printf '%s\n' "$items" | grep -c . || true)"
          cat >&2 <<EOF
          ERROR: this PR cites $count backlog item(s) — $all_items — and changes engine/IDE code, but
          it does not touch docs/BACKLOG.md or any file under docs/archive/backlog/.

          EVERY ITEM LISTED ABOVE OWES A BANNER, not just the first. The house citation form writes
          the BACKLOG prefix once and the siblings after it, so '(BACKLOG #1319, #1322)' declares
          TWO items. A gate that read only the first sent authors to update one banner of four
          (BACKLOG #1347).

          Update each item's status banner in the same PR — in docs/BACKLOG.md if the item is still
          open, or in its docs/archive/backlog/ file if it has already been retired. If the work is
          complete:

              > ✅ **SHIPPED in <version> (<ADR / PR>).** <one line of evidence>

          and remove its '🔢 Re-scored' banner (an item must declare exactly one status).

          This gate exists because #60 shipped while its banner still said "PRE-RESERVED", and that
          stale banner was later repeated as fact. A doc that lies about build state silently
          misdirects planning.

          If this PR only *partially* implements the item, keep the open banner and say so in the
          item body — then drop the 'BACKLOG #$n' token from this PR's title/body.
          EOF
          exit 1

      # BACKLOG #1095. Retiring an item MOVES it verbatim from docs/BACKLOG.md into
      # docs/archive/backlog/, and every citation that named the live file keeps pointing at a file
      # the item is no longer in. No link checker can see this: docs/BACKLOG.md resolves perfectly,
      # and only the human-readable number beside it is stale.
      #
      # DIFF-SCOPED, and that is the design rather than a convenience. PR #271 declined a gate partly
      # because "a gate that fails on a legitimate archive is one people delete"; with pre-existing
      # violations a corpus-wide gate is red on day one and gets suppressed. --base/--head restricts
      # findings to lines THIS PR added, so it can only be red about something the PR wrote. Run the
      # script with neither flag for the repo-wide report, which is a measurement, not a merge gate.
      #
      # No setup-python: the checker and the parse_items module it imports are stdlib-only, so the
      # runner's preinstalled python3 is enough and the job stays a checkout plus two scripts.
      - name: Every backlog citation this PR adds must name the file its item lives in
        env:
          # Hoisted, never interpolated into the script body (zizmor: template injection).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/docs/backlog_citation_check.py --base "$BASE_SHA" --head "$HEAD_SHA"

  prose-anchor:
    # BACKLOG #1315. A bare `path:line` in the ledger asserts nothing an independent reference could
    # check, and it does not FAIL when the code moves -- it resolves to a line that still exists and
    # says something else. `scripts/docs/prose_anchor_check.py` refuses a citation THIS PR ADDS to
    # docs/BACKLOG.md unless the sentence names a symbol or pins the base commit it was read against.
    #
    # A SEPARATE JOB, NOT A STEP IN THE JOB ABOVE, AND THE DIFFERENCE IS WHO DECIDES. That job's
    # `name:` IS a required status-check context, so a step added there BLOCKS A MERGE from the
    # moment it lands. This repository's own rule is that making a check RUN is a Builder's call and
    # making one BLOCK is the owner's -- quality-advisory.yml's `verdict-divergence` job states it in
    # those words, and BACKLOG #353 sits unbuilt on the same reasoning. So this reports as its own
    # context, goes RED on a finding rather than hiding behind continue-on-error, and gates nothing
    # until someone adds it to branch protection. Promotion stays available and untaken.
    #
    # IT IS DELIBERATELY ABSENT FROM .github/required-contexts.txt. Adding it there without adding it
    # to the server first is exactly the lie that file exists to prevent, and the order is written
    # down in that file: protection first, then the line, then the pinned count -- in one PR.
    #
    # NO `continue-on-error` AND NO `|| true`, ON PURPOSE. Its finding is actionable by the author in
    # the diff under review -- name a symbol, or pin a commit -- which is the property that separates
    # a check worth going red from one that has to be advisory.
    #
    # DIFF-SCOPED, WHICH IS WHAT MAKES IT WIRABLE AT ALL: docs/BACKLOG.md carries about 3,001 naked
    # citations today, so a corpus-wide rule would be red for everyone on day one and get deleted --
    # the reasoning the citation gate above already records. The existing rows are NOT retrofitted;
    # #1315's own measurement is that they are not rotting, only unverifiable, and the fix for that
    # is the convention holding from here on.
    name: a new path-line citation in BACKLOG.md must be findable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ON PULL REQUESTS ONLY. The question is "what did THIS pull request write", which has no subject
    # in a merge group -- every `github.event.pull_request.*` field is null there. The job above
    # keeps its merge_group trigger because it holds a required context that must report in the
    # queue; this one holds none, so triggering it there would run it against empty shas.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Three-dot diff needs the merge base, and it cannot be computed on a shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - name: Every path:line citation this PR adds must carry a symbol or a pinned commit
        env:
          # Hoisted, never interpolated into the script body (zizmor: template injection).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/docs/prose_anchor_check.py --base "$BASE_SHA" --head "$HEAD_SHA"

# Backlog status hygiene -- RETIRED IN SUBSTANCE, KEPT AS A REPORTING CONTEXT (BACKLOG #1250).
#
# WHAT THIS JOB DID. Two checks, both over `docs/BACKLOG.md` and `docs/archive/backlog/`:
#   1. a PR claiming `BACKLOG #N` in its title or body, and touching engine/IDE code, had to update
#      that item's status banner in the same PR;
#   2. every backlog citation a PR added beside a ledger path had to name the file its item lives in
#      (`backlog_citation_check.py`, BACKLOG #1095).
#
# BOTH LOST THEIR SUBJECT. The numbered-item ledger moved to the maintainer-internal repository and
# both files are gone from this tree, so a PR here CANNOT update an item banner and there are no
# ledger paths for a citation to name. Enforcement moved with the ledger.
#
# ***THE JOB AND ITS `name:` STAY, AND THAT IS THE WHOLE REASON THIS FILE STILL EXISTS.*** The name
# below is a REQUIRED status-check CONTEXT STRING in branch protection. Deleting the job, renaming
# it, or dropping either trigger makes the context never report -- and a required context that never
# reports does not fail, it WEDGES: nothing merges, in the queue or out of it. codeql.yml's header
# records PR 619 sitting AWAITING_CHECKS with its contexts simply absent. Retiring the context is a
# branch-protection change, which is not an in-repo edit, so it is a separate act by whoever holds
# that setting -- not something this file may do on its own.
#
# SO THE STEP BELOW IS A DELIBERATE NO-OP, AND IT SAYS SO RATHER THAN LOOKING LIKE A PASS. A green
# check whose reason is "there was nothing to check" must not read like a green check whose reason is
# "the rule was satisfied". It prints which is which.
#
# DO NOT ADD A NEW RULE HERE JUST BECAUSE THE SLOT IS FREE. The context string names one specific
# rule; a job doing something else under that name is a check whose label points at the wrong
# subject, which is exactly what BACKLOG #1254 is about.
#
# Read-only. No secrets. Nothing is interpolated into a `run:` body.
name: backlog-hygiene

on:
  # THE QUEUE IS LIVE, SO THIS TRIGGER IS LOAD-BEARING -- DO NOT REMOVE IT (BACKLOG #340 step 1).
  # Branch protection evaluates required contexts on the MERGE-GROUP commit, so without this trigger
  # the context never reports in the queue and NOTHING MERGES. That remains true of a no-op job: what
  # branch protection waits for is the context reporting, not the work it does.
  merge_group:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # KEYED ON github.ref, NOT ON THE PR NUMBER, AND THAT IS THE WHOLE FIX. This workflow also runs on
  # `merge_group`, where `github.event.pull_request` DOES NOT EXIST -- so the old key evaluated to the
  # bare string "backlog-hygiene-" for EVERY queue entry, and `cancel-in-progress` then made each new
  # entry cancel the previous entry's run.
  #
  # This job's name is a REQUIRED status context, and a cancelled required check can never go green,
  # so the cancelled entry was EVICTED from the merge queue. It never failed. It was cancelled by its
  # successor.
  #
  # MEASURED over 754 `merge_group` runs: 151 backlog-hygiene runs, 102 success, 49 CANCELLED
  # (32.5 percent), ZERO failures. Every other workflow on that event cancels at 0.0 percent except
  # CI at 4.0. Two evictions were chased by hand the night this was found, one of them 50 seconds
  # after the entry was queued -- far too fast for any check to have run, which is the tell.
  #
  # `github.ref` is unique per queue entry (`refs/heads/gh-readonly-queue/main/pr-N-<sha>`) and stable
  # per pull request (`refs/pull/N/merge`), so supersede-on-push is preserved and entries stop
  # cancelling each other. A no-op job is fast, which makes an eviction race LESS likely and not
  # impossible -- keep the key.
  group: backlog-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banner-on-implementation:
    # QUOTED: an unquoted YAML scalar ends at " #" (comment start), which silently truncated this to
    # "a PR that implements BACKLOG". The job name is the required-status-check *context* string, so
    # a truncated name is what you would have to add to branch protection.
    #
    # ***BYTE-IDENTICAL TO .github/required-contexts.txt. DO NOT EDIT IT.*** It no longer describes
    # what the job does, and that is accepted: the string is an identifier in a setting outside this
    # repository, so its accuracy is worth less than its stability.
    name: "a PR that implements BACKLOG #N must update BACKLOG.md"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # NO CHECKOUT. The job reads nothing, so cloning the tree would only make it look like it did.
      - name: Report that this rule moved with the ledger
        run: |
          set -euo pipefail
          echo "NO-OP. This context is kept so branch protection keeps seeing it report."
          echo
          echo "The rule it names -- a PR citing 'BACKLOG #N' must update that item's status banner"
          echo "-- was retired with its subject. The numbered-item ledger left this repository"
          echo "(BACKLOG #1250); docs/BACKLOG.md is now a stub and docs/archive/backlog/ is gone, so"
          echo "there is no banner here to update and no ledger path for a citation to name."
          echo
          echo "This is GREEN BECAUSE THERE WAS NOTHING TO CHECK, not because a rule was satisfied."
          echo "Do not read it as coverage. Enforcement moved to the repository holding the ledger."

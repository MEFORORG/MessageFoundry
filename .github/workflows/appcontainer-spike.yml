# CPython in an AppContainer under a real NT SERVICE account -- a SPIKE, NOT A GATE (vault BACKLOG
# #3411, wave 3.1; one of the Windows spikes in the key-custody drafts-index item 6).
#
# WHAT IT MEASURES. The key-custody draft plans a config worker that runs in an AppContainer under
# the same service account as the engine, and rests the worker's separation from the account's key
# material on a file access list. Whether that holds was not run. This job runs it on both hosted
# Windows Server images, from a real service registered the way scripts/service/install-service.ps1
# registers the engine (virtual account NT SERVICE\<name>, restricted service SID, the installer's
# privilege list), installed through the pinned and checked NSSM. The service starts the job's
# CPython inside an AppContainer with no capabilities, and asks:
#
#   Q1  does CPython start and run a script in an AppContainer the service account launched?
#   Q2  handed the bytes of the service's user-scope DPAPI blob, can the container unprotect them?
#   Q3  is the container refused read of the blob's FILE, when the file's access list grants the
#       service account and names no package or capability?
#   Q4  can the container open a persisted CNG key in the account's key store (the Microsoft
#       Software Key Storage Provider, user scope), and sign with it?
#
# HOW TO READ IT. Each leg's job summary holds lines starting `APPCONTAINER-SPIKE <image> Q1..Q4`,
# an answer, a detail line and one line per control, HELD or FAILED. The answers and their controls
# are defined once, in judge_reports() in scripts/ci/appcontainer_spike_worker.py;
# scripts/ci/appcontainer_spike.ps1 is the rig. YES, NO and NOT RUN (Q2 to Q4 when Q1 is NO) are
# findings and leave the job green. Only UNANSWERED, an answer the instrument could not give with
# its reason beside it, or a rig failure turns it red.
#
# IT CAN NEVER BLOCK A MERGE, by structure:
#   * a separate workflow, not in ci.yml, so not in the `CI gate` roll-up's `needs`;
#   * its job is not a required context, and must not become one. The live required set is branch
#     protection's (gh api repos/MEFORORG/MessageFoundry/branches/main/protection/required_status_checks);
#   * nothing here touches the windows-service-smoke legs or the dpapi spike.
#
# TRIGGERS. Manual dispatch, and pull requests that touch the paths listed below, so the pull
# request that changes the spike carries its result. No schedule: a spike answers once. The job
# also depends on at least scripts/service/install-service.ps1, scripts/ci/service_token_probe.py
# and messagefoundry/secrets_dpapi.py, and a change to any of them does NOT re-run it. Dispatch it
# by hand when the answers could depend on such a change.
#
# COST AND FORKS. Two 2x-billed Windows legs, free on this public repository and billed to a fork's
# owner, so the job runs only here, as windows-service-smoke does.
#
# DATA. Synthetic only: one constant payload, never a key. The CNG key is made for the run, used
# to sign that payload, and deleted by the run.

name: appcontainer spike

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/appcontainer-spike.yml
      - ci/python-version
      - scripts/ci/appcontainer_spike.ps1
      - scripts/ci/appcontainer_spike_worker.py

concurrency:
  group: appcontainer-spike-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: no gh writes, no secrets.
permissions:
  contents: read

jobs:
  appcontainer-spike:
    name: appcontainer spike (${{ matrix.os }})
    if: github.repository == 'MEFORORG/MessageFoundry'
    runs-on: ${{ matrix.os }}
    # The rig's own waits come to about three minutes (a 120-second report wait, a 30-second stop,
    # and the containers' own 60-second bounds). Granting the interpreter's folder walks every file
    # of the standard library. The NSSM download is uncached, and Save-PinnedNssm bounds a stalled
    # source only by a read timeout of about five minutes on Windows PowerShell 5.1.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The two Windows Server images the windows-service-smoke legs run on.
        os: [windows-2022, windows-2025]
    env:
      # An administrator-only folder for the nssm.exe the installer's own Resolve-Nssm downloads
      # and checks against its pins. No run: line below names any other nssm (tests/test_nssm_pin.py).
      SPIKE_NSSM_DIR: C:\Program Files\MeforAcSpike\nssm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # read-only job; keep the token out of .git/config (zizmor: artipacked)

      - name: Set up Python
        id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ci/python-version

      # Windows PowerShell 5.1, as the windows-service-smoke install step runs the installer whose
      # definitions this rig lifts.
      - name: Run the AppContainer spike
        shell: powershell
        env:
          SPIKE_PYTHON: ${{ steps.py.outputs.python-path }}
          SPIKE_IMAGE: ${{ matrix.os }}
        run: |
          .\scripts\ci\appcontainer_spike.ps1 -NssmDir $env:SPIKE_NSSM_DIR -PythonExe $env:SPIKE_PYTHON -Image $env:SPIKE_IMAGE -Summary $env:GITHUB_STEP_SUMMARY

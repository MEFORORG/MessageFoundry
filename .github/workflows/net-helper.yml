name: net-helper

# Publishes mefor-net-helper.exe, the privileged helper ADR 0056 specifies (net-helper/), with
# NativeAOT, and signs it when a signing credential is configured. This is the repository's first compiled
# artifact and first signing step, so each choice is written down here.
#
# NOT A REQUIRED CHECK, AND IT CANNOT BE ONE AS WRITTEN. It is paths-filtered, so it does not report on a
# pull request that touches neither the helper nor this file. A required context that never reports wedges
# every such pull request (docs/CI.md, the required-but-absent trap; .github/required-contexts.txt).
# Nothing in the engine calls the helper yet. When a release ships the binary, gate this build through
# ci.yml's `CI gate` roll-up rather than requiring this job directly.
#
# SIGNING RUNS ONLY FOR CODE ON MAIN. The certificate signs a push to main or a manual dispatch on main,
# never a pull request, because a signature says the code was reviewed and merged. A fork pull request has
# no secrets anyway. When the secret is absent the signing step SKIPS and the sign job still passes, leaving
# only the unsigned development build: the owner is procuring the certificate separately, and the build must
# not wait on it. No credential lives in this repository.
#
# THE ENVIRONMENT PROTECTS THE KEY, NOT THE `if:` GUARDS. GitHub runs a workflow from the ref it builds, so a
# branch can run its own copy of any workflow file with every guard deleted. That copy can read a repository
# or organization secret. It cannot read an environment secret unless the environment's deployment branch
# rule admits its ref, and no branch can change that rule. So both secrets must live only in
# net-helper-signing, and its rule must admit main alone. A repository administrator sets that rule, not this
# file; net-helper/README.md, "Signing", has the steps. The rule admits whatever is merged to main, so it
# narrows who can reach the key to merged code rather than sealing it.
#
# THE CREDENTIAL SHAPE IS A BASE64 PFX, AND THAT MAY NOT FIT THE CERTIFICATE THAT ARRIVES. The CA/Browser
# Forum code-signing baseline requirements have required hardware-protected private keys for publicly
# trusted code-signing certificates issued since June 2023, so such a key cannot be exported as a PFX. A
# certificate from an internal CA can be. If the key lives in a cloud HSM, replace the certificate import
# in the signing step with that provider's signtool integration, and keep the rest: the environment, the
# secret-gated skip, the RFC 3161 timestamp, and the signature check.
#
# Environment secrets read here, from net-helper-signing only: NET_HELPER_SIGNING_PFX_BASE64 and
# NET_HELPER_SIGNING_PFX_PASSWORD. tests/test_net_helper_signing_scope.py pins where they are read.
on:
  pull_request:
    paths: &helper_paths
      - "net-helper/**"
      - "!net-helper/README.md"
      - ".github/workflows/net-helper.yml"
  push:
    branches: [main]
    paths: *helper_paths
  workflow_dispatch:

concurrency:
  # zizmor.yml's pattern: a re-push supersedes its own pull request run; push and dispatch runs are never
  # cancelled, because each one is the only build of its commit.
  group: net-helper-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The build job's checkout needs this and nothing more. The sign job drops even this.
permissions:
  contents: read

env:
  # net-helper/.gitignore ignores this directory, and the README's build command uses it too.
  HELPER_OUT: net-helper/out

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: net-helper build
    # Windows because NativeAOT compiles a Windows binary only on Windows. The image's Visual Studio C++
    # tools supply the linker NativeAOT calls.
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not kept on disk (zizmor: artipacked).
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The csproj targets .NET 10 and publishes with NativeAOT; its comments record why.
          dotnet-version: "10.0.x"

      - name: Publish (Release, NativeAOT)
        run: |
          # Publish, not build: only publish runs the NativeAOT compiler. Build output needs the .NET runtime
          # installed and is not the binary to ship.
          dotnet publish net-helper/MeforNetHelper.csproj --configuration Release --output $env:HELPER_OUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the binary requires administrator
        run: |
          # Without its manifest the helper would start without administrator rights and fail each operation
          # later, instead of refusing to launch. Windows reads only the Win32 manifest resource, ID 1, so this
          # extracts that resource: a text search would also pass on a copy Windows ignores.
          $exe = Join-Path $env:HELPER_OUT 'mefor-net-helper.exe'
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" |
            Where-Object { $_.Directory.Parent.Name -as [version] } |
            Sort-Object { [version]$_.Directory.Parent.Name } |
            Select-Object -Last 1
          if (-not $mt) { throw 'mt.exe was not found in the Windows SDK' }
          $manifest = Join-Path $env:RUNNER_TEMP 'mefor-net-helper.manifest'
          & $mt.FullName -nologo "-inputresource:$exe;#1" "-out:$manifest"
          if ($LASTEXITCODE -ne 0) { throw "mt.exe could not read manifest resource 1: exit code $LASTEXITCODE" }
          $level = (Select-Xml -Path $manifest -XPath "//*[local-name()='requestedExecutionLevel']").Node.level
          if ($level -ne 'requireAdministrator') {
            throw "mefor-net-helper.exe requests execution level '$level', not requireAdministrator"
          }
          Write-Host 'the Win32 manifest requires administrator'

      - name: Check a DLL planted beside the binary is not loaded
        run: |
          # NativeAOT binds SendARP and other Windows APIs when it links, so the loader resolves IPHLPAPI.DLL at
          # start-up. The csproj's /DEPENDENTLOADFLAG confines that search to System32. Here a copy of the binary
          # runs beside a planted IPHLPAPI.DLL that exports no SendARP. Hosted runners run as an administrator
          # with UAC off, so the manifest does not stop the launch. With the flag, the helper starts and exits 2
          # for its missing configuration. Without it, the load fails with STATUS_ENTRYPOINT_NOT_FOUND.
          $dir = Join-Path $env:RUNNER_TEMP 'planted-dll'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item (Join-Path $env:HELPER_OUT 'mefor-net-helper.exe') $dir
          Copy-Item (Join-Path $env:SystemRoot 'System32\version.dll') (Join-Path $dir 'IPHLPAPI.DLL')
          $copy = Join-Path $dir 'mefor-net-helper.exe'
          $helper = Start-Process -FilePath $copy -WorkingDirectory $dir -NoNewWindow -PassThru
          # Reading Handle keeps the process handle open, so ExitCode is still readable after the process exits.
          $null = $helper.Handle
          if (-not $helper.WaitForExit(30000)) {
            $helper.Kill()
            throw 'the helper did not exit within 30 seconds'
          }
          if ($helper.ExitCode -ne 2) {
            throw ('the helper exited 0x{0:X8}, not 2, so a planted DLL may have loaded' -f $helper.ExitCode)
          }
          Write-Host 'a DLL planted beside the binary was not loaded'

      - name: Record the SHA-256
        run: |
          $exe = Join-Path $env:HELPER_OUT 'mefor-net-helper.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          "mefor-net-helper.exe: UNSIGNED development build, SHA-256 $hash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mefor-net-helper
          path: ${{ env.HELPER_OUT }}/
          if-no-files-found: error
          retention-days: 14

  sign:
    name: net-helper sign
    needs: build
    # Its own job, skipped on every other ref, for two reasons. Once the environment admits only main, a job
    # that names it on another ref fails, so naming it in the build job would turn every pull request touching
    # the helper red. And the key never shares a runner with the build, which compiles and runs the helper.
    if: github.ref == 'refs/heads/main'
    environment: net-helper-signing
    # Windows because signtool is Windows-only.
    runs-on: windows-2025
    timeout-minutes: 10
    # No checkout, and download-artifact calls the GitHub API only when given a token, which it needs just
    # for another run's artifacts. So the token gets no scope in the one job that can hold the key.
    permissions: {}
    env:
      # A step's `if:` cannot read the secrets context, so only whether the secret is set reaches this
      # variable, as "true" or "false". The secret itself does not.
      HAS_SIGNING_CREDENTIAL: ${{ secrets.NET_HELPER_SIGNING_PFX_BASE64 != '' }}
      # RFC 3161 responses are themselves signed, so plain HTTP is the norm for timestamp servers.
      TIMESTAMP_URL: http://timestamp.digicert.com
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mefor-net-helper
          path: ${{ env.HELPER_OUT }}

      - name: Sign (signtool, RFC 3161 timestamp)
        id: sign
        # Repeats the job's guard, so an edit that drops one of the two still signs nothing but main.
        if: env.HAS_SIGNING_CREDENTIAL == 'true' && github.ref == 'refs/heads/main'
        env:
          SIGNING_PFX_BASE64: ${{ secrets.NET_HELPER_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.NET_HELPER_SIGNING_PFX_PASSWORD }}
        run: |
          $exe = Join-Path $env:HELPER_OUT 'mefor-net-helper.exe'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Where-Object { $_.Directory.Parent.Name -as [version] } |
            Sort-Object { [version]$_.Directory.Parent.Name } |
            Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe was not found in the Windows SDK' }

          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]'PersistKeySet, UserKeySet'
          $pfx = [System.Convert]::FromBase64String($env:SIGNING_PFX_BASE64)
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:SIGNING_PFX_PASSWORD, $flags)
          # signtool needs neither secret, so both leave this process's environment before it starts.
          Remove-Item Env:SIGNING_PFX_BASE64, Env:SIGNING_PFX_PASSWORD

          # The certificate sits in the user store only while signtool runs, and is selected by thumbprint,
          # so the password never appears on a command line.
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('My', 'CurrentUser')
          $store.Open('ReadWrite')
          try {
            $store.Add($cert)
            # /tr and /td ask for an RFC 3161 timestamp, so the signature stays valid after the certificate expires.
            & $signtool.FullName sign /sha1 $cert.Thumbprint /s My /fd SHA256 /tr $env:TIMESTAMP_URL /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }
          } finally {
            $store.Remove($cert)
            $store.Close()
          }

          # Checked without chain trust: a certificate from an internal CA is not trusted by this runner, and
          # whether to trust it is the deploying site's decision. Signed and timestamped is what is asserted.
          $signature = Get-AuthenticodeSignature -FilePath $exe
          if (-not $signature.SignerCertificate -or -not $signature.TimeStamperCertificate) {
            throw 'the binary is not both signed and timestamped'
          }
          Write-Host "signed by $($signature.SignerCertificate.Subject); timestamped by $($signature.TimeStamperCertificate.Subject)"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          "mefor-net-helper.exe: signed, SHA-256 $hash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.sign.outcome == 'success'
        with:
          # Its own name, so the unsigned build's artifact is never replaced and each name means one thing.
          name: mefor-net-helper-signed
          path: ${{ env.HELPER_OUT }}/
          if-no-files-found: error
          retention-days: 14

# Release — build, SBOM, Sigstore-sign, publish a GitHub release, and upload to PyPI when a `vX.Y.Z`
# tag is pushed.
#
# Cut a release:  git tag v0.1.0 && git push origin v0.1.0   (on a commit that already passed CI on main).
# Dry-run:        run this workflow manually (workflow_dispatch) — it builds + SBOMs + signs and uploads
#                 the artifacts for inspection. It does NOT create a GitHub release and does NOT publish
#                 to PyPI, so the dry-run validates build/SBOM/sign/upload ONLY. The first live PyPI
#                 publish is the first real tag; validate it with a `vX.Y.Z-rc1` pre-release tag (also
#                 matched below) once Trusted Publishing is configured.
#
#                 EVERY STEP THAT PUBLISHES A RELEASE ARTIFACT TESTS THE EVENT AS WELL AS THE REF —
#                 `github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')` (BACKLOG
#                 #1584). A ref test ALONE does not keep the dry-run promise above:
#                 `workflow_dispatch` accepts any ref this workflow is present on, a TAG included,
#                 and on such a run `github.ref` IS `refs/tags/...`. So a manual dispatch picked
#                 against a tag would satisfy a ref-only guard and publish to PyPI — which is what
#                 "run it manually to dry-run it" invites an operator to do. Reading the old guard as
#                 "a branch ref isn't `refs/tags/...`" is what hid this: a true sentence about the
#                 wrong half of the trigger. The steps carrying the pair are at least the three PyPI
#                 publishes and the three GitHub-release mutations; the COUNT is pinned in
#                 tests/test_release_pipeline.py, which is its one authority — do not restate a
#                 number here that nothing keeps in sync with that test.
#
#                 THE DRY-RUN IS NOT SILENT, AND THE SENTENCE ABOVE IS DELIBERATELY NARROWER THAN
#                 "every mutating step". Two steps below write to public, append-only sinks on a
#                 dispatch and carry NEITHER half of that pair: `python -m sigstore sign` is
#                 unconditional and, being keyless, appends an entry to the public Rekor transparency
#                 log; `actions/attest-build-provenance` is gated on `!github.event.repository.private`
#                 alone. Both predate #1584 — a dispatch against a BRANCH already reached them — and
#                 both are filed as BACKLOG #1805. The promise this file keeps today is that a manual
#                 run publishes no release ARTIFACT, not that it writes nothing public.
#
# PyPI publish uses Trusted Publishing (OIDC) — no API token. OWNER PREREQ (one-time, before the first
# tag): claim the `messagefoundry` PyPI project + configure a Trusted Publisher (a PENDING publisher works
# before the first upload) for repo MEFORORG/MessageFoundry + workflow `release.yml`. Note: pre-release
# `-*` tags publish to PRODUCTION PyPI (a TestPyPI route would need its own Trusted Publisher). Cut the tag
# only AFTER the py.typed marker (WS-3) is on main — the wheel smoke step enforces this on a tag.
#
# SECOND distribution — `messagefoundry-harness` (the synthetic test/load/failover harness,
# packaging/messagefoundry-harness/) — is built + published in lockstep by the `release-harness` job
# below (same version, same tag). Its PyPI publish is GATED on the `PUBLISH_HARNESS` repo variable so it
# stays a no-op until the OWNER (one-time): (1) configures a `messagefoundry-harness` PyPI Trusted
# Publisher — a PENDING publisher for repo MEFORORG/MessageFoundry + workflow `release.yml` (blank
# environment, matching the engine) — then (2) sets repo variable PUBLISH_HARNESS=true. Until then the
# job still BUILDS + version-checks the harness wheel each release and attaches it to the GitHub release.
#
# The version is single-sourced from messagefoundry/__init__.py (hatchling dynamic version), so the built
# artifact's version must match the tag.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"  # pre-releases: v0.1.0-rc1, …
      # The web console is SEPARATELY VERSIONED (its own __version__, changelog and PyPI cadence —
      # docs/WEBCONSOLE-PACKAGE.md), so it gets its own tag namespace rather than riding an engine tag.
      # It lives in THIS workflow rather than its own file because the PyPI Trusted Publisher for
      # messagefoundry-webconsole is registered against `release.yml`; a separate file would not match it.
      - "webconsole-v[0-9]+.[0-9]+.[0-9]+"
      - "webconsole-v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

# Deny-all at the workflow level; each job below requests only the scopes it uses (least privilege).
permissions: {}

jobs:
  release:
    # Source-repo only — and since the MEFORORG cutover, MEFORORG/MessageFoundry IS the source repo.
    #
    # THIS GUARD WAS INVERTED UNTIL THE CUTOVER, AND THE INVERSION IS NOW WRONG. The old rationale: this
    # repo was the published MIRROR, the mirror must never release, and scripts/publish/publish.ps1
    # rewrote the private slug to the public one across *.yml — so an `==` private-slug test would be
    # rewritten into `== 'MEFORORG/MessageFoundry'` and become true exactly where it had to be false.
    # Naming only the public slug made the test rewrite-proof.
    #
    # Both premises are gone: publish.ps1 was retired at the cutover (nothing rewrites anything), and
    # this repo is the source, not the mirror. Left inverted, the job skips on the ONLY repo that can
    # release — PyPI Trusted Publishing is bound to MEFORORG/MessageFoundry + `release.yml` (see the
    # header), so the guard and the OIDC binding pointed in opposite directions and no tag could ever
    # publish. Every other slug guard in .github/workflows (ci, codeql, quality-advisory, scorecard)
    # was already flipped to `==` at the cutover; release.yml was missed.
    #
    # `==` is also the safe form now: a fork, or the retired private vault, still cannot release.
    # NOT on a console tag: the console has its own job below and its own version root, so an
    # engine release built from `webconsole-v*` would ship the engine at the console's version.
    if: github.repository == 'MEFORORG/MessageFoundry' && !startsWith(github.ref_name, 'webconsole-')
    runs-on: ubuntu-latest
    # Hang backstop against GitHub's 360-minute default; security.yml's `jobs:` note carries the
    # reasoning. The most generous cap in this file: it builds, signs and publishes, so it waits on
    # Sigstore and PyPI, and a release that dies at a cap is far cheaper than one wedged for six hours.
    timeout-minutes: 30
    permissions:
      contents: write       # create the release + upload its assets
      id-token: write       # Sigstore signing, PyPI Trusted Publishing, + provenance — all via the GitHub OIDC identity
      attestations: write   # write the SLSA build-provenance attestation (actions/attest-build-provenance)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # release uses GH_TOKEN env / OIDC, never the persisted git credential

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # REMOVED at the MEFORORG cutover: "Rewrite README repo slug for the public PyPI
      # long_description". It rewrote the private source slug to the public mirror's before `build`
      # embedded README.md, because PyPI fetches the long_description anonymously and a private repo's
      # badge SVGs and body links 404 for anonymous readers.
      #
      # There is one repo now, and README.md already names it — so there is nothing to rewrite. Worse,
      # the step could no longer even fail safely: publish.ps1's slug rewrite had been applied to this
      # workflow itself, collapsing BOTH sides of the substitution to the same string. The sed became a
      # no-op that replaced the public slug with itself, and the guard immediately after it failed if
      # that slug appeared in the README — which it always does, 19 times. So the step failed on EVERY
      # tag push. That is exactly what happened: the v0.3.0 tag (2026-07-13) died here, and the repo has
      # zero published releases as a result. Same root cause as the release job's inverted `if:` guard —
      # mirror-era logic that the slug rewrite mangled and the cutover left behind.
      # (tests/test_release_pipeline.py rejects both the step and any self-substituting sed returning.)

      - name: Build sdist + wheel
        run: |
          # HASH-PINNED (Scorecard PinnedDependenciesID; ADR 0034 §3, BACKLOG #332 step 6). This runs in
          # the job holding contents/id-token/attestations: write, and `build` produces the very artifact
          # that is then signed, attested and published -- so whatever executes here is inside the trust
          # boundary of the release.
          # This WAS an inline `pip install` that pinned the TOP package and left every transitive
          # floating, resolved from PyPI at tag time. `build` now flows through the PEP 735
          # `release-tools` group into ci/locks/release-tools.lock, so the transitives are hashed too and
          # Dependabot's `uv` ecosystem can see the pin (no ecosystem parses an inline workflow install).
          # The version rationale lives ONCE, at that group in pyproject.toml.
          # NO pip bootstrap, deliberately, and this is the same call the sigstore step and both SBOM
          # steps make: `--require-hashes` resolves NOTHING, so every version and artifact hash comes out
          # of the lock and the installer's own version is not an input to what gets installed. The line
          # it replaces fetched `pip==26.1.2` itself UNHASHED from PyPI; dropping it leaves the pip that
          # actions/setup-python ships, which arrives from an action pinned by SHA.
          python -m pip install --require-hashes -r ci/locks/release-tools.lock
          python -m build
          ls -l dist/

      - name: Leak gate — sdist MUST be package-only (private-doc/PHI publish guard)
        # Referenced by the artifact-upload step's `if:` below — a rejection there must not be
        # handed out as a downloadable workflow artifact. Keep the id if you rename the step.
        id: leak-gate
        run: |
          # WITHOUT [tool.hatch.build.targets.sdist].only-include, hatchling sweeps the whole repo into
          # the sdist and this workflow uploads it to PUBLIC PyPI — which leaked docs/security/* and other
          # deny-listed private docs on releases 0.1.0..0.2.15. This gate fails the release BEFORE the
          # (last-step) PyPI publish if any sdist member is outside the package + its standard metadata,
          # so a regression in the allowlist can never re-leak. Belt-and-suspenders to the pyproject pin.
          #
          # THIS GATE DECIDES ON EVIDENCE OF A LISTING, NEVER ON THE ABSENCE OF MATCHES. The earlier
          # body asked only the second question, and three inputs measured against it printed
          # "package-only" and exited 0 having inspected nothing: two tarballs in dist/ (`sd` went
          # multiline, so the tar argument was malformed, and one of the two carried
          # docs/security/PRIVATE.md), a corrupt or truncated tarball, and a tarball listing zero
          # members. Two more were caught only by luck: an empty dist/ died on the bare `ls` under the
          # runner's `bash -e`, with no ::error:: annotation, and a foreign sdist tripped only because
          # its own members happened to sit outside the allowlist. A green that inspected nothing is
          # the worst outcome for the one step whose entire value is that a human believes it, so
          # steps (1) to (4) below each PROVE something before the allowlist question is asked at all.
          #
          # `set -o pipefail` would not have fixed that, and is not what fixes it here. Measured: the
          # old body under pipefail still printed package-only and returned 0 on all three, because
          # the trailing `|| true` swallowed the status whichever pipeline element failed. Separating
          # the listing from the filtering is what fixes it.

          # (1) EXACTLY ONE sdist. Resolved through an array so zero matches and two matches are both
          # visible as a count, instead of collapsing into one silently malformed `tar` argument.
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::leak gate needs exactly one sdist in dist/, found ${#sdists[@]}: ${sdists[*]:-none}"
            exit 1
          fi
          sd="${sdists[0]}"

          # (2) THE LISTING MUST SUCCEED **AND COVER THE WHOLE FILE**. `--ignore-zeros` is the
          # load-bearing flag, not a nicety: plain `tar tzf` STOPS AT THE FIRST end-of-archive marker
          # and exits 0, so a clean sdist with a SECOND gzip stream appended lists only the clean
          # members and passes. Measured: such a file hides docs/security/PRIVATE.md from `tar tzf`
          # while `gzip -dc | grep -a` recovers its body text, and the private bytes ship. Proving the
          # listing SUCCEEDED is not proving it was COMPLETE. No pipe on this line on purpose: the
          # status has to be tar's own, and in `tar ... | sed ...` it is the sed's.
          if ! raw=$(tar --ignore-zeros -tzf "$sd"); then
            echo "::error::leak gate could not list $sd (tar failed), so nothing was inspected"
            exit 1
          fi

          # (3) A LISTING OF ZERO MEMBERS is not a clean sdist, it is no evidence at all.
          rawcount=$(grep -c . <<<"$raw" || true)
          if [ "$rawcount" -eq 0 ]; then
            echo "::error::leak gate listed $sd and got ZERO members, so nothing was inspected"
            exit 1
          fi

          # (4) ONE ROOT, AND IT MUST BE OURS. This is an IDENTITY check and the strip depends on it.
          # The old form stripped `^[^/]+/` from EACH LINE INDEPENDENTLY and then asked whether SOME
          # line began `messagefoundry/`. Both halves were exploitable and both were measured:
          #   - a foreign tarball whose members are `evilpkg-9.9/messagefoundry/...` satisfied the
          #     "is it ours" test, because that test only ever saw the SECOND path component;
          #   - `docs/messagefoundry/security/PRIVATE.md` inside an sdist rooted at
          #     `messagefoundry-0.3.0/` laundered itself into `messagefoundry/security/PRIVATE.md`,
          #     which the allowlist then trusted. A per-line strip is not a prefix removal.
          # So: derive the ONE root from the first member, require EVERY member to carry it, and strip
          # that exact literal. A sdist has a single root by construction, so this rejects nothing real.
          root=${raw%%/*}
          if [ "$root" = "$raw" ] || [ -z "$root" ]; then
            echo "::error::leak gate could not derive a single root directory from $sd"
            exit 1
          fi
          case "$root" in
            messagefoundry-*) ;;
            *)
              echo "::error::leak gate found root '$root', not messagefoundry-<version>, so this is not the MessageFoundry sdist"
              exit 1
              ;;
          esac
          # Matched with `case`, not `grep "^$root/"`: a version contains dots, and in an ERE a dot is
          # any character, so the regex form would also accept a root spelled `messagefoundry-0X3X0`.
          # Stripped with `${line#"$root"/}`, not `${raw//"$root"\//}`: the latter substitutes EVERY
          # occurrence anywhere in the member, so a crafted `<root>/docs/<root>/x` would be rewritten
          # mid-path. Remove exactly one LEADING root per line, which is what "strip the prefix" means.
          members=""
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            case "$line" in
              "$root"/*) members+="${line#"$root"/}"$'\n' ;;
              *)
                echo "::error::sdist member does not carry the archive root '$root/', refusing to strip a prefix that is not one: $line"
                exit 1
                ;;
            esac
          done <<<"$raw"
          count=$(grep -c . <<<"$members" || true)

          # (5) THE ARCHIVE MUST BE COMPLETE, not merely readable. A tar stream truncated and THEN
          # gzipped is a VALID gzip of a SHORT tar: measured at 10 and 50 percent, `tar` listed a
          # partial member set, exited 0 and warned about nothing. Publishing that burns the version
          # number on PyPI forever, so a partial listing must not read as a clean one.
          #
          # A complete tar ends with an end-of-archive marker of NUL blocks, and a truncated one is
          # cut mid-data. So decompress and require the last 1024 bytes to be entirely NUL. Measured
          # across the fixtures: clean, leaky and gzip-concatenated archives all give 0 non-NUL
          # trailing bytes; the 50-percent truncation gives 119. NOTE A SIZE CHECK WOULD NOT WORK -
          # that truncation is still a whole multiple of 512, so block alignment proves nothing.
          trailing=$(gzip -dc "$sd" | tail -c 1024 | tr -d '\000' | wc -c)
          if [ "$trailing" -ne 0 ]; then
            echo "::error::sdist $sd does not end in a tar end-of-archive marker ($trailing non-NUL bytes in the last 1024) - the archive is truncated"
            exit 1
          fi

          # (6) AND IT MUST HAVE THE SHAPE OF AN sdist. Cheap, independent of (5), and it catches a
          # well-formed archive that is simply not one: hatchling force-includes both of these in
          # every sdist it emits.
          for required in PKG-INFO pyproject.toml; do
            if ! grep -qxF "$required" <<<"$members"; then
              echo "::error::sdist is missing $required, which hatchling force-includes in every sdist - this is not a hatchling sdist"
              exit 1
            fi
          done

          # Only now the allowlist question.
          # allowlist = the package tree + the metadata files hatchling force-includes in every sdist
          # (PKG-INFO, pyproject.toml, .gitignore) + README/CHANGELOG + license files (root or licenses/).
          #
          # KEEP THE `|| true` ON THIS GREP. grep exits 1 when it matches nothing, and "nothing outside
          # the allowlist" is the CLEAN case, so a nonzero status here is a pass. The bug was never
          # `|| true` itself: it was that ONE `|| true` covered BOTH the tar and the grep, so an
          # upstream listing failure and a clean result became the same empty string. The listing is
          # proved separately above, which is what makes this `|| true` safe. Do not merge the two
          # back into a single pipeline.
          leak=$(grep -vE '^(messagefoundry/|licenses/|README\.md$|CHANGELOG\.md$|LICENSE$|NOTICE$|PKG-INFO$|pyproject\.toml$|\.gitignore$|$)' <<<"$members" || true)
          if [ -n "$leak" ]; then
            echo "::error::sdist contains non-package files — private-doc leak guard tripped:"
            printf '%s\n' "$leak"
            exit 1
          fi
          # Print the COUNT, not just a word: a green log line has to show the gate inspected something.
          echo "sdist is package-only: inspected $count members in $sd, none outside the allowlist"

      # PAIRED WITH THE ALLOWLIST ABOVE, and it asks the other question (BACKLOG #1832). The gate
      # above asks WHERE a member sits; its allowlist is a path regex. It cannot ask WHAT KIND of file
      # something is, which is why `messagefoundry/CLAUDE.md` — this project's instructions to its own
      # coding agents — matched the `messagefoundry/` branch and shipped to PyPI on every release from
      # 0.1.0 to 0.2.15. Widening the regex would not have helped: the next internal note inside the
      # package tree passes a location test identically. So the pair is allowlist-by-location plus
      # DENYLIST-by-name, and the denylist is also what reaches the WHEEL — the step above reads
      # `dist/*.tar.gz` only, so the engine wheel had no member gate at all.
      #
      # The rule lives in the script, not here, so the console and harness jobs share one copy instead
      # of carrying two bash transcriptions that drift. Stdlib only, and it runs before the wheel smoke
      # for the obvious reason: nothing downstream should touch an archive that is about to be refused.
      - name: Member gate — no distribution may ship a maintainer-internal file (sdist AND wheel)
        # Referenced by the artifact-upload step's `if:` below, exactly as the leak gate above is:
        # a refused archive must not be handed out as a downloadable workflow artifact. Keep the id
        # if you rename the step. (BACKLOG #1838 — this gate shipped without the guard its sibling
        # already had, so a refused sdist and wheel were still uploaded.)
        id: member-gate
        run: python scripts/release/forbidden_members.py 'dist/*.tar.gz' 'dist/*.whl'

      - name: Smoke-check the built wheel (clean venv → import + version)
        run: |
          python -m venv /tmp/relsmoke
          /tmp/relsmoke/bin/pip install --quiet dist/*.whl
          # `-I` IS THE CHECK, not decoration. The interpreter was already the clean venv, which reads
          # as sufficient and is not: for `python -c` sys.path[0] is the empty string — the CURRENT
          # WORKING DIRECTORY — and this job's cwd is the checkout, so `import messagefoundry`
          # resolved to the checkout's SOURCE TREE rather than to the wheel just installed. A wheel
          # missing the package entirely still printed a version and exited 0, so the one step whose
          # whole job is to prove the artifact imports could not fail. Measured both ways (a planted
          # source tree, flags on and off) in tests/test_release_pipeline.py.
          # `-I` over `-P`: -P drops only the cwd and leaves PYTHONPATH and the user site-packages as
          # two more routes back onto sys.path; -I is -P plus -E plus -s, so one flag closes all three
          # and this step needs none of them. A `cd` out of the checkout would work too, but this same
          # step later reads constraints.lock and dist/*.whl by RELATIVE path, so it would need a
          # subshell and would break quietly on a later edit.
          built=$(/tmp/relsmoke/bin/python -I -c "import messagefoundry; print(messagefoundry.__version__)")
          # An empty read is the same false green one layer down: the import succeeded and told us
          # nothing. The tag guard below would catch it (Version("") is unparseable), but the
          # workflow_dispatch dry-run — the arm that exists to validate this path BEFORE a tag — would
          # not, so fail here where both arms see it.
          if [ -z "$built" ]; then
            echo "::error::the wheel smoke read an EMPTY __version__ from the installed wheel, so it proved nothing"; exit 1
          fi
          echo "built version: $built"
          # On a tag push, the built version MUST equal the tag (single-source check).
          #
          # Compared as PEP 440 VERSIONS, not as strings. A pre-release tag has to be spelled with a
          # hyphen to match the `v[0-9]+.[0-9]+.[0-9]+-*` trigger above (`v0.3.0rc1` fires nothing), so
          # a string compare forced __version__ to carry the non-canonical "0.3.0-rc1" purely to satisfy
          # the gate — while hatchling/PyPI normalise it to 0.3.0rc1 everywhere else, meaning the tag,
          # the module attribute and the wheel filename could not all be canonical at once. Version()
          # normalises both sides, so canonical "0.3.0rc1" in __init__.py matches tag v0.3.0-rc1 and the
          # check still fails loudly on a genuine mismatch.
          # `packaging` pin DERIVED from constraints.lock, never hardcoded — it IS a DEP-1 dependency
          # (requirements.lock + constraints.lock both pin it), so a literal here would drift silently on
          # the next Dependabot bump. Same run-time-read pattern as quality-advisory.yml's ruff pin, but
          # FAIL-CLOSED rather than falling back to an unpinned fetch: this is the release path. Installed
          # OUTSIDE the tag guard so a workflow_dispatch dry-run exercises the pinned install — the guard
          # below is what stays tag-only, and an install this step never reaches cannot be validated
          # before the tag that depends on it.
          PKG_PIN="$(sed -n 's/^packaging==\([^ ;]*\).*/\1/p' constraints.lock | head -1)"
          if [ -z "$PKG_PIN" ]; then
            echo "::error::no packaging== pin in constraints.lock — refusing an unpinned install on the release path"; exit 1
          fi
          echo "packaging pin from constraints.lock: $PKG_PIN"
          /tmp/relsmoke/bin/pip install --quiet "packaging==$PKG_PIN"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            want="${GITHUB_REF_NAME#v}"
            /tmp/relsmoke/bin/python - "$built" "$want" <<'PYVER'
          import sys
          from packaging.version import InvalidVersion, Version

          built, want = sys.argv[1], sys.argv[2]
          try:
              b, w = Version(built), Version(want)
          except InvalidVersion as exc:
              raise SystemExit(f"::error::unparseable version ({exc}) — built={built!r} tag={want!r}")
          if b != w:
              raise SystemExit(
                  f"::error::built version {built} != tag {want} (normalised {b} != {w})"
              )
          print(f"version matches tag: {b}")
          PYVER
            # A released wheel MUST ship the PEP 561 marker so an external consumer's mypy sees the
            # typed surface. Enforced ONLY on a tag, so the workflow_dispatch dry-run is never blocked
            # before py.typed (WS-3) merges. This is the CI enforcement of the cross-workstream rule
            # "py.typed must merge before the v0.1.0 tag is cut" — a wheel is a zip, so grep its listing.
            if ! unzip -l dist/*.whl | grep -q 'messagefoundry/py.typed'; then
              echo "::error::messagefoundry/py.typed missing from the wheel — the py.typed marker (WS-3) must merge before tagging a release"; exit 1
            fi
          fi

      - name: Stage a clean dist for PyPI (wheel + sdist only — no signature bundles)
        run: |
          # PyPI's uploader (twine) rejects non-distribution files, and the Sigstore step below signs
          # in-place into dist/ (writing *.sigstore bundles there). Snapshot ONLY the wheel + sdist into
          # a clean dir now — before signing — and publish FROM it as the last step, so the irreversible
          # PyPI upload runs last and the uploader never sees the signature bundles.
          mkdir -p dist-pub
          cp dist/*.whl dist/*.tar.gz dist-pub/
          ls -l dist-pub/

          # EVERY GATE ABOVE INSPECTED `dist/`. THE PYPI PUBLISH READS `dist-pub/` (BACKLOG #1841).
          # Today this step is a plain `cp`, so the two are byte-identical and the gates transfer. That
          # is a property of these three lines, not of the pipeline -- nothing downstream re-checks, and
          # `tests/test_release_member_gate.py` pins the engine gate to `dist/`, so a future change here
          # (a rebuild, a rename, a filter, a signature landing in the wrong directory) would move the
          # published bytes out from under every check that ran, and no test would red.
          #
          # So PROVE the copy rather than assume it. Compare by CONTENT, not by name or size: a rebuild
          # would produce the same filenames and a near-identical size while differing in members.
          # COUNTED IN THE LOOP, NOT WITH `ls -1 dist-pub | wc -l`. This step runs under `bash -e`
          # WITHOUT pipefail, so a pipeline takes its LAST command's status and `ls` failing on a
          # missing directory would be discarded by `wc`, which happily reports 0 -- turning "the
          # directory is gone" into "zero files", the reading that then trips the check below with the
          # wrong diagnosis. tests/test_workflow_pipefail_screen.py caught exactly this line.
          staged_count=0
          for staged in dist-pub/*; do
            # An unmatched glob is left LITERAL here (no nullglob), so this arm is also the empty-
            # directory case and it must not be read as a missing-file case.
            if [ ! -e "$staged" ]; then
              echo "::error::dist-pub/ is EMPTY after staging, so nothing was compared and nothing would be published"; exit 1
            fi
            source="dist/$(basename "$staged")"
            if [ ! -f "$source" ]; then
              echo "::error::dist-pub/ holds $(basename "$staged"), which is not in dist/ -- the published set is not the inspected set"; exit 1
            fi
            if ! cmp -s "$staged" "$source"; then
              echo "::error::$staged differs from $source -- every gate above inspected dist/, so the bytes about to reach PyPI were never checked"; exit 1
            fi
            staged_count=$((staged_count + 1))
          done
          if [ "$staged_count" -eq 0 ]; then
            echo "::error::dist-pub/ yielded zero comparable files, so this check proved nothing"; exit 1
          fi
          echo "dist-pub is byte-identical to the inspected dist: verified $staged_count file(s)"

          # AND re-run the member gate on the staged copy. Redundant while the check above holds, and
          # deliberately so: it is the arm that still refuses if somebody replaces the `cp` with a build
          # and updates the comparison to match. A gate costs a second; discovering this on PyPI is
          # permanent, because a version number cannot be re-used.
          python scripts/release/forbidden_members.py 'dist-pub/*.whl' 'dist-pub/*.tar.gz'

      - name: Generate the shipped CycloneDX SBOM (license-complete, hash-locked core runtime)
        run: |
          # Build the SBOM from the ACTUAL installed core runtime (docker/locks/requirements-core.lock,
          # hash-locked) via `cyclonedx-py environment`, NOT `requirements <lockfile>`: environment mode
          # reads each installed dist's METADATA, so component LICENSES are populated (a draft-2025 CISA
          # minimum element) — the requirements parser has no metadata and emits license-less components.
          # The core lock is the honest closure a `pip install messagefoundry` pulls (the all-extras
          # requirements.lock drags PySide6/dev tooling the wheel never requires); pip-audit still audits
          # the all-extras set. See docs/SUPPLY-CHAIN.md + ADR 0149.
          # HASH-PINNED (BACKLOG #332 step 6): `cyclonedx-bom` replaced an inline pin of the top package
          # only, and now flows through the PEP 735 `release-tools` group into ci/locks/release-tools.lock
          # so its transitives are hashed too. The `~=7.3.1` bound is UNCHANGED, and its rationale lives
          # ONCE, at that group in pyproject.toml.
          # No pip bootstrap: --require-hashes resolves nothing (tests/test_ci_venv_pinning.py).
          # BYTE-IDENTICAL to security.yml's SBOM install, enforced by tests/test_ci_venv_pinning.py.
          # Nothing in PR CI executes release.yml (tag push only), so ADR 0034's documented pre-tag check
          # is to dispatch security.yml's sbom job and read ITS log -- which only proves anything while
          # the two steps run the same commands. NOTE that job is ALSO gated to schedule/workflow_dispatch,
          # so the dry-run has to be dispatched by hand; no pull request performs it. Both halves of this
          # install are therefore unexercised until a tag, a dispatch, or the nightly cron on `main`.
          python -m pip install --require-hashes -r ci/locks/release-tools.lock
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/pip install --require-hashes -r docker/locks/requirements-core.lock
          python -m cyclonedx_py environment /tmp/sbomenv/bin/python \
            --pyproject pyproject.toml --mc-type application \
            --of JSON -o messagefoundry-sbom.cdx.json
          # Declare the SBOM's lifecycle (CISA "Build" type / draft-2025 "Generation Context") and backfill
          # the root component's version (hatchling-dynamic, so --pyproject leaves it null). Exits non-zero
          # on a structurally broken BOM, failing the release before it ships one.
          python scripts/security/sbom_finalize.py messagefoundry-sbom.cdx.json \
            --phase build --set-version-from messagefoundry/__init__.py

      - name: Stage the VEX companion (from the maintained source of truth)
        run: |
          # Ship the maintained OpenVEX alongside the SBOM so a hospital operator's scanner can suppress
          # vulnerabilities we've assessed as not-affected/fixed instead of chasing unreachable CVEs
          # (CISA VEX; NTIA Consumer Playbook). Source of truth: security/vex/messagefoundry.openvex.json.
          cp security/vex/messagefoundry.openvex.json messagefoundry-vex.openvex.json

      - name: Score the SBOM quality (sbomqs — advisory, never blocks a release)
        continue-on-error: true
        run: |
          # Machine-score the SBOM (0-10) and print the NTIA-minimum-elements breakdown, so a regression in
          # SBOM completeness is visible in the release log. Advisory — SBOM quality is a signal, not a
          # gate. ADR 0149.
          #
          # PINNED IN-REPO, not against the asset's own checksums.txt (BACKLOG #1698). The security.yml
          # twin still verifies same-origin and that is adequate THERE. It is not adequate here, and the
          # difference is the job, not the tool: this step runs inside `id-token: write` — the identity
          # that Sigstore-signs the artifacts and publishes to PyPI a few steps below — and it runs
          # BEFORE the signing step, so anything that executes here executes next to the credential that
          # vouches for the release. A backdoored sbomqs at this point is in position before every
          # control standing after it.
          #
          # A checksums.txt fetched from the SAME origin as the asset is signed by nothing and moves
          # with it: whoever can replace the tarball can replace the line attesting it, so that check
          # establishes the bytes are self-consistent, never that they are the bytes anyone reviewed.
          # The literal below was recorded at review time and can only change in a reviewed commit, so
          # a re-tagged, re-uploaded or substituted asset fails here rather than running beside the key.
          #
          # BUMPING: change VER and SBOMQS_SHA256 in the same commit, and take the new digest from BOTH
          # checksums.txt and GitHub's server-side asset digest (the releases API `digest` field). Two
          # independent routes agreeing is what makes the literal evidence instead of a copied line;
          # this one was established that way on 2026-09-18.
          #
          # `set -o pipefail` IS READ BY A TEST, though it guards nothing at run time TODAY.
          # tests/test_workflow_pipefail_screen.py no longer grandfathers this step, so deleting
          # the line makes that screen report the `echo` pipe below as a new finding.
          # At run time the one pipeline left is `echo … | sha256sum -c -`, and its first element
          # cannot fail. The line stays so the next edit that adds a pipe here inherits it.
          # The DELETED `grep " ${asset}$" sbomqs-checksums.txt | sha256sum -c -` was a latent
          # hazard, not a live one. security.yml's "Install gitleaks (pinned + checksum-verified)"
          # step records why that shape fails safe. security.yml's sbomqs twin still runs it with
          # no pipefail, in the same latent state; that file is not in this change's scope.
          set -o pipefail
          VER=2.0.11
          SBOMQS_SHA256=14fd58b89d4948265cce0fdb95d9b635ff667f352b5a9a05b3d13dbefa5d0195
          asset="sbomqs_${VER}_Linux_x86_64.tar.gz"
          base="https://github.com/interlynk-io/sbomqs/releases/download/v${VER}"
          curl -sSfL "${base}/${asset}" -o "${asset}"
          # Verify BY the canonical asset name: sha256sum -c reads "<digest>  <filename>" and checks
          # that file, so the name must match what curl wrote.
          echo "${SBOMQS_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "${asset}" sbomqs
          sudo install -m 0755 sbomqs /usr/local/bin/sbomqs
          sbomqs score -b messagefoundry-sbom.cdx.json
          sbomqs compliance --ntia messagefoundry-sbom.cdx.json || true

      - name: Sign artifacts with Sigstore (keyless, GitHub OIDC)
        run: |
          # PINNED — the sharpest of these installs: this step is unconditional (every tag AND every
          # dispatch) and the very next command signs the release artifacts with the job's OIDC identity,
          # the same identity that publishes to PyPI below — so ANY code that executes here runs with
          # the credential that signs the artifacts. A backdoored wheel produced at this point carries a
          # VALID Sigstore bundle and VALID SLSA provenance, and every downstream verifier reports
          # success: the compromise defeats the controls it is standing next to.
          #
          # HASHED LOCK, not an inline pin (BACKLOG #332). The previous form was
          # `pip install "sigstore==4.4.0"`, which had TWO defects that a version bump does not fix:
          #   1. It pinned the TOP package only. ~30 transitive dependencies still floated, unhashed,
          #      resolved at signing time.
          #   2. NO Dependabot ecosystem parses an inline `pip install X==Y` inside a workflow `run:`
          #      block (.github/dependabot.yml registers uv, github-actions, npm). So the pin had no
          #      updater, no trigger and no owner: its own comment said "re-evaluate once it has aged
          #      past the window" and nothing would ever have prompted that.
          #      tests/test_ci_venv_pinning.py words the class: "a stale pin rots invisibly and a
          #      DELETED pin is invisible twice over."
          # Routing it through `uv.lock` fixes both: the transitives are hash-pinned, and the group is
          # under the `uv` ecosystem Dependabot already watches.
          #
          # ON THE VERSION: the lock pins sigstore 4.4.0 BY OWNER RULING -- given 2026-08-22, and
          # re-affirmed 2026-09-03 with the full history in hand. "NOT 4.5.0." The rationale lives
          # ONCE, at the `release-tools` group in pyproject.toml; BACKLOG #332 carries the record.
          # The one thing worth repeating HERE, because this is where the thought occurs to a reader
          # standing at the install: DO NOT RE-DERIVE THE COOLDOWN ARGUMENT. dependabot.yml's 5-day
          # window closed 2026-08-02 and BOTH rulings postdate it, so "the objection is spent" is not
          # news to this pin -- it is what the rulings were made in spite of. That argument has been
          # published and RETRACTED BY ITS OWN AUTHOR once already (PR 531, 2026-08-27), and shipped
          # anyway two days later in a9354808e before being corrected back. dependabot.yml now
          # carries a matching `ignore` entry so a bot cannot repeat it.
          python -m pip install --require-hashes -r ci/locks/release-tools.lock
          # Sign the wheel + sdist AND the SBOM + VEX, so an operator can verify the provenance of the
          # bill-of-materials and the exploitability assessment too — not just the code artifacts (ADR 0149).
          python -m sigstore sign dist/*.tar.gz dist/*.whl \
            messagefoundry-sbom.cdx.json messagefoundry-vex.openvex.json
          ls -l dist/ messagefoundry-sbom.cdx.json.sigstore* messagefoundry-vex.openvex.json.sigstore*

      # SLSA build provenance (Beyond-ASVS-L3 WP-BL3-01): a signed in-toto provenance attestation
      # (predicateType slsaprovenance v1) binding each artifact's sha256 -> this source commit + the
      # builder workflow identity, transparency-logged via the OIDC identity above. This is the
      # GitHub-native artifact attestation for the GitHub release assets, COMPLEMENTING the PyPI-side
      # PEP 740 attestations emitted by the publish step below (dist-pub/ is a byte-identical copy, so
      # the digests match either source). Runs on a tag push AND the workflow_dispatch dry-run, so the
      # attestation path is validated before the real tag. Verify a downloaded artifact with:
      #   gh attestation verify dist/<artifact> --repo MEFORORG/MessageFoundry
      # GATED to PUBLIC repos: the GitHub attestation API (actions/attest-build-provenance) is "not
      # available for user-owned private repositories" and FAILS there, aborting the job BEFORE the PyPI
      # publish below. THIS repo is public since the cutover, so the step now RUNS and every release
      # carries SLSA provenance. The gate remains for a private fork, where it SKIPS rather than fails
      # (skip != fail, so the release proceeds) and provenance is still covered by the Sigstore bundle
      # above plus the PyPI-side PEP 740 attestations from the publish step.
      # `github.event.repository.private` is populated on the tag-push event.
      - name: Attest build provenance (SLSA) for sdist + wheel
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz, dist/*.whl, messagefoundry-sbom.cdx.json, messagefoundry-vex.openvex.json"

      # CREATE-OR-UPDATE, not create. This was a bare `gh release create`, which fails with "a release
      # with the same tag name already exists" on any re-run — and because it sits BEFORE the PyPI
      # publish below, that turned one publish failure into a permanent retry deadlock: every re-run
      # died here and SKIPPED the publish, so a re-run could not even test the fix it was meant to
      # verify. Observed on v0.3.1 — attempt 1 created the release then failed at PyPI (403, publisher
      # mismatch); attempts 2-3 died here; only deleting the public release by hand let attempt 4 through.
      #
      # The step ORDER is deliberate and stays: the reversible action (a GitHub release, deletable)
      # precedes the irreversible one (a PyPI upload burns that version forever). Publishing first would
      # leave a failure here with an un-retryable PyPI version and no release. The defect was never the
      # ordering — it was that the reversible half could not be repeated.
      - name: Create or update the GitHub release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          # Release notes = this version's CHANGELOG section (fall back to a one-liner).
          awk -v v="$ver" 'BEGIN{f=0} /^## \[/{ if(f) exit; if(index($0,"["v"]")) f=1 } f{print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "MessageFoundry $tag" > notes.md
          # `edit` needs an explicit true/false: a bare `--prerelease` only ever SETS the flag, so a
          # re-run could never demote a release that had been mis-marked as a pre-release.
          case "$ver" in
            *-*) pre_create="--prerelease"; pre_edit="--prerelease=true"  ;;
            *)   pre_create="";             pre_edit="--prerelease=false" ;;
          esac
          assets=( dist/*.tar.gz dist/*.whl dist/*.sigstore*
                   messagefoundry-sbom.cdx.json messagefoundry-sbom.cdx.json.sigstore*
                   messagefoundry-vex.openvex.json messagefoundry-vex.openvex.json.sigstore* )
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — updating in place (this is a re-run)."
            gh release edit "$tag" --title "$tag" --notes-file notes.md "$pre_edit"
            # --clobber: re-uploading an existing asset name errors otherwise, and a re-run regenerates
            # every artifact (fresh signatures), so replacing is the correct semantic.
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "$tag" --notes-file notes.md $pre_create
          fi

      - name: Upload artifacts (dry-run / always)
        # `always()` EXCEPT a leak-gate rejection, which is the one failure this step must not carry
        # past the gate. The gate refuses to PUBLISH an archive holding non-package files; this step
        # then uploaded the whole of dist/ regardless, so on a packaging regression a deploying
        # project's rejected sdist WOULD stay downloadable as a workflow artifact to any signed-in
        # reader of this public repository — the one archive the release declined to ship would be
        # the one it handed out. Enumerated at the time of writing: this is the ONLY step in this job
        # that runs after a gate failure (every other later step carries no `if:`, or one that ANDs
        # with the implicit success(); release-harness is `needs: release` and release-webconsole is
        # gated on a mutually exclusive ref), so the singular wording is the finding.
        # Every OTHER failure mode keeps the always() behaviour this step exists for: a build, sign,
        # SBOM, release or publish failure still uploads whatever dist/ holds.
        # DELIBERATELY THE WHOLE STEP'S OUTCOME, not just its leak branch. The gate exits non-zero
        # from several paths and only one of them is "a member is outside the allowlist" — the rest
        # are "the listing did not succeed / did not cover the file / is not our archive". Narrowing
        # the exclusion to the leak branch would hand out an archive in exactly the cases where the
        # gate proved it COULD NOT INSPECT it, which inverts this gate's own founding rule: decide on
        # evidence of a listing, never on the absence of matches. The cost is that a dry run whose
        # sdist is merely truncated yields no download; the gate's error names the cause and a
        # re-dispatch is cheap, so pay it.
        # `outcome`, not `conclusion` — conclusion is read AFTER continue-on-error, so adding
        # `continue-on-error` to the gate would silently turn a rejection back into a success here.
        #
        # ONE HOLE IS LEFT OPEN ON PURPOSE, AND IT IS NOT CLOSED BY THIS LINE. A run where the gate
        # NEVER EXECUTED leaves the context empty, and '' != 'failure' is true — so if `build` writes
        # the sdist and then fails, dist/ uploads with nothing having listed it. That is NOT "an
        # archive the gate rejected", but it is also not one the gate cleared. `== 'success'` would
        # close it and would additionally withhold the artifact on a plain build failure, which is
        # always() behaviour this step is meant to keep. The `!=` form is the narrower change and is
        # what is built; the trade is recorded here rather than left for someone to rediscover.
        # tests/test_release_pipeline.py pins the gate itself as unconditional and free of
        # `continue-on-error`, which are the two ways the skipped-gate case could be made common.
        #
        # BOTH gates are named here, not just the leak gate (BACKLOG #1838). They refuse different
        # things -- the leak gate asks where a member sits, the member gate asks what kind of file it
        # is -- so guarding on one and not the other uploads whatever the other one caught.
        if: always() && steps.leak-gate.outcome != 'failure' && steps.member-gate.outcome != 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: |
            dist/
            messagefoundry-sbom.cdx.json
            messagefoundry-sbom.cdx.json.sigstore*
            messagefoundry-vex.openvex.json
            messagefoundry-vex.openvex.json.sigstore*
          if-no-files-found: ignore

      # LAST step on purpose: PyPI is the one IRREVERSIBLE sink (uploads can't be replaced), so it runs
      # after build/smoke/sign/release — the step's `if` has an implicit success(), so any earlier
      # failure skips it and nothing can fail AFTER an upload. Gated on a tag PUSH — the EVENT and the
      # ref, not the ref alone: a `workflow_dispatch` can be pointed at a tag, where `github.ref` is
      # `refs/tags/...` and a ref-only guard would have published (BACKLOG #1584). Reads dist-pub/ (clean wheel +
      # sdist; dist/ now also holds the *.sigstore bundles, which twine would reject). Trusted Publishing
      # (OIDC) — no token, uses the job's `id-token: write`. attestations: PEP 740 provenance ON PyPI,
      # distinct from the Sigstore bundle attached to the GitHub release above. skip-existing: a re-run /
      # same-version re-push is a no-op, NOT a failure (a version bump is required to republish; the
      # version==tag smoke check already prevents a wrong-version upload).
      - name: Publish to PyPI (Trusted Publishing / OIDC)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-pub/
          skip-existing: true
          attestations: true

  release-webconsole:
    # Build + publish the SEPARATE `messagefoundry-webconsole` distribution (the browser ops console,
    # packaging/messagefoundry-webconsole/). Unlike release-harness this is NOT lockstep with the engine:
    # the console has its own __version__ root, changelog and PyPI cadence (docs/WEBCONSOLE-PACKAGE.md),
    # so it fires on its OWN `webconsole-v*` tag and has NO `needs: release` — an engine release must not
    # drag the console along, and a console release must not wait on one.
    #
    # ASVS 15.2.4 (dependency confusion). `messagefoundry-webconsole` is REGISTERED on PyPI -- the first
    # `webconsole-v*` run of this job created the project on 2026-07-29 -- so this job now republishes a
    # name the project owns, and shipped text may name it in a bare-name install. The pre-claim wording
    # that stood here is retired rather than restated as a retraction (BACKLOG #1193).
    # tests/test_install_instruction_provenance.py holds the classification (`_PUBLISHED_DISTRIBUTIONS`)
    # and fails if any tracked text drifts back to the pre-claim claim.
    if: github.repository == 'MEFORORG/MessageFoundry' && startsWith(github.ref_name, 'webconsole-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # gh release upload (attach the console wheel)
      id-token: write   # PyPI Trusted Publishing (OIDC) — no API token anywhere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build the console wheel (wheel-only — the package tree is force-included from the repo root)
        run: |
          # Hash-pinned like every other build job on this path: this workflow's jobs hold contents/id-token
          # write and publish the release artifacts, so an unpinned resolve takes whatever PyPI serves at
          # tag time (Scorecard PinnedDependenciesID, ADR 0034 §3). `build` and its transitives come from
          # ci/locks/release-tools.lock -- see the engine build step above for why there is no pip
          # bootstrap. Guarded by tests/test_ci_venv_pinning.py.
          python -m pip install --require-hashes -r ci/locks/release-tools.lock
          # Wheel-only for the same reason as the harness: messagefoundry_webconsole/ lives OUTSIDE this
          # project dir and is pulled in via force-include, so an sdist would not be self-contained.
          python -m build --wheel ./packaging/messagefoundry-webconsole --outdir webconsole-dist
          ls -l webconsole-dist/

      # The same gate the engine job runs, on this job's own output (BACKLOG #1832). This job had NO
      # member gate before: its only check was a version comparison, so any file the force-include
      # swept in shipped unexamined. Shares the engine's script rather than re-deriving the denylist,
      # because two copies of a rule are two rules.
      - name: Member gate — no distribution may ship a maintainer-internal file
        # Referenced by this job's artifact-upload `if:` below (BACKLOG #1838). This job had
        # a BARE always() there, so a refused wheel was uploaded as a downloadable artifact
        # regardless -- the engine job's leak gate already had this guard and these did not.
        id: member-gate
        run: python scripts/release/forbidden_members.py 'webconsole-dist/*.whl'

      - name: Smoke-check the console wheel (clean venv, install, then the console's OWN __version__ == tag)
        run: |
          # THIS STEP USED TO READ THE VERSION OUT OF THE WHEEL FILENAME and never open the file
          # (BACKLOG #1701): `re.search(r'messagefoundry_webconsole-([^-]+)-', glob(...))`. That proves
          # the artifact is NAMED right and nothing else — a wheel whose force-include silently produced
          # no package tree, or whose metadata says one thing and whose payload says another, passed the
          # step's own promise ("== the console's OWN __version__") while the promise was never checked.
          # The version now comes out of the INSTALLED distribution, and the installed `__init__.py` is
          # read back for its `__version__` literal, so the step measures the artifact it is about to
          # publish rather than the string somebody typed into its name.
          #
          # Derived from the lock, exactly as the relsmoke/harnesssmoke jobs do, so one bump moves
          # every release-path packaging install together instead of drifting apart. Hoisted OUT of the
          # tag guard for the same reason the engine job hoists its own: an install a dispatch dry-run
          # never reaches cannot be validated before the tag that depends on it.
          PKG_PIN="$(sed -n 's/^packaging==\([^ ;]*\).*/\1/p' constraints.lock | head -1)"
          if [ -z "$PKG_PIN" ]; then
            echo "::error::no packaging== pin in constraints.lock — refusing an unpinned install on the release path"; exit 1
          fi
          echo "packaging pin from constraints.lock: $PKG_PIN"
          # A THROWAWAY VENV, not this job's interpreter (ADR 0034). This job holds contents: write +
          # id-token: write, and the steps after this one attach the wheel to a GitHub release and
          # publish it to PyPI — so anything resolved into the main interpreter here sits inside the
          # publishing identity. The engine job has always done it this way (/tmp/relsmoke); the console
          # was the one wheel job still installing into the job interpreter.
          python -m venv /tmp/webconsolesmoke
          /tmp/webconsolesmoke/bin/pip install --quiet "packaging==$PKG_PIN"
          # --no-deps IS LOAD-BEARING, NOT AN OPTIMISATION. `messagefoundry-webconsole` depends on
          # `messagefoundry`, and this job has no `needs: release`, so a full install would resolve that
          # engine FROM PYPI inside a job holding id-token: write. Install the built wheel alone.
          /tmp/webconsolesmoke/bin/pip install --quiet --no-deps webconsole-dist/*.whl
          # Then INSPECT it rather than import it. messagefoundry_webconsole/__init__.py eagerly imports
          # .pages, ._auth and .mount, so under --no-deps (no fastapi, no engine) an import would fail on
          # a perfectly good wheel. find_spec resolves the package WITHOUT executing it, which is exactly
          # the reach this check needs.
          #
          # A FAILURE INSIDE THIS COMMAND SUBSTITUTION FAILS THE STEP. Actions runs the block as
          # `bash -e {0}`, and for a simple assignment bash takes the substitution's own status, so
          # errexit fires and nothing after this line runs. Measured, not assumed: under `bash -e`,
          # `built=$(python -c 'raise SystemExit(3)')` exits 3 without reaching the next command.
          built=$(/tmp/webconsolesmoke/bin/python -I - <<'PYSMOKE'
          import re
          import sys
          from importlib.metadata import distribution
          from importlib.util import find_spec
          from pathlib import Path

          DIST = "messagefoundry-webconsole"
          PKG = "messagefoundry_webconsole"

          # -I (isolated) is what keeps the CHECKOUT out of sys.path. The repo root carries a
          # messagefoundry_webconsole/ of its own, and this step runs from that root, so without it the
          # checkout would answer every question below and the wheel would never be touched. -P or
          # PYTHONSAFEPATH would do as well; -E alone is a silent no-op here.
          prefix = Path(sys.prefix).resolve()

          spec = find_spec(PKG)
          if spec is None or not spec.origin:
              raise SystemExit(
                  f"::error::{PKG} is not importable from the smoke venv — the wheel shipped no package tree"
              )
          origin = Path(spec.origin).resolve()
          if not origin.is_relative_to(prefix):
              raise SystemExit(
                  f"::error::{PKG} resolved to {origin}, OUTSIDE the smoke venv {prefix} — "
                  f"the checkout shadowed the wheel and this step inspected the wrong tree"
              )

          # BIND THE MODULE TO THIS DISTRIBUTION. find_spec above proves SOME module for PKG sits in
          # the venv; RECORD is what says it came out of THIS wheel. Without the membership test the
          # two questions are separate, and a venv where another distribution owns the import name
          # answers the first one happily.
          dist = distribution(DIST)
          recorded = [name for f in (dist.files or []) if (name := str(f)).startswith(PKG + "/")]
          if not recorded:
              raise SystemExit(
                  f"::error::{DIST} RECORD lists no {PKG}/ members — the wheel is metadata wrapped around "
                  f"an empty package tree (a broken force-include builds and installs cleanly)"
              )
          if not any(Path(f.locate()).resolve() == origin for f in (dist.files or [])):
              raise SystemExit(
                  f"::error::{origin} is not a file {DIST} recorded — the module this step resolved "
                  f"belongs to something else on sys.path, so the wheel was never inspected"
              )

          # The step name promises "the console's OWN __version__", so read it — out of the INSTALLED
          # file, not the checkout. It must agree with the metadata hatchling derived from it; a
          # disagreement means the version root and the built artifact are not the same thing any more.
          # Both quote styles: scripts/security/sbom_finalize.py reads this same literal with the looser
          # pattern, and a check that is stricter than its sibling finds a version the sibling ships.
          text = origin.read_text(encoding="utf-8")
          m = re.search(r"""^__version__\s*=\s*["']([^"']+)["']""", text, re.M)
          if m is None:
              raise SystemExit(f"::error::no __version__ literal in the installed {origin}")
          # COMPARED AS PEP 440 VERSIONS, NOT AS STRINGS — the two sides are normalised differently by
          # construction. `dist.version` comes out of `Version:`, which hatchling canonicalises, while
          # `__version__` is whatever was typed into the version root, and the hyphen spelling is
          # SUPPORTED here rather than tolerated (tests/test_version.py::test_version_is_semver admits
          # it, and the tag trigger above only fires on `...-*`, so a pre-release tag cannot be spelled
          # any other way). A string compare therefore rejects `0.3.0-rc1` against metadata `0.3.0rc1`
          # — the same release — and reds every console pre-release at the last gate before the PyPI
          # upload burns the version. Its sibling tag-vs-built compare below was fixed for exactly this
          # trap; this is the same trap one comparison over.
          # tests/test_version.py::test_installed_metadata_matches_dunder_version parses both sides of
          # the identical question for the engine, and says why in its own comment.
          #
          # WHAT THIS GIVES UP, stated rather than left to be discovered: the check is now PEP 440
          # equality, not a spelling check, so `v0.3.0`, `0.3.0.0` and `0.3` all pass against metadata
          # `0.3.0` as well. That is the whole equivalence class, not just the hyphen. Nothing else
          # constrains the console literal's spelling, and its only consumer is the version string
          # printed at messagefoundry_webconsole/__init__.py. What the check still catches is the
          # failure it exists for — a wheel whose package tree and metadata came from different trees
          # — because epochs, post-releases and local segments all still compare unequal.
          #
          # `packaging` is installed into this venv above, from the constraints.lock pin. Imported HERE
          # rather than at the top, matching the harness smoke: everything before this point is
          # stdlib-only, and that is what lets the guards above report a broken wheel instead of a
          # missing dependency.
          from packaging.version import InvalidVersion, Version

          try:
              source_version, metadata_version = Version(m.group(1)), Version(dist.version)
          except InvalidVersion as exc:
              raise SystemExit(
                  f"::error::unparseable version ({exc}) — installed {PKG}.__version__ "
                  f"{m.group(1)!r}, wheel metadata {dist.version!r}"
              )
          if source_version != metadata_version:
              raise SystemExit(
                  f"::error::installed {PKG}.__version__ {m.group(1)} != wheel metadata version "
                  f"{dist.version} (normalised {source_version} != {metadata_version}) — the console's "
                  f"version root and its built artifact disagree"
              )

          print(
              f"console wheel installed from {origin}: {len(recorded)} {PKG}/ members, "
              f"__version__ == metadata == {dist.version}",
              file=sys.stderr,
          )
          print(dist.version)
          PYSMOKE
          )
          echo "console wheel version: $built"
          # Compared against the CONSOLE's version root, never the engine's — that is the whole point of
          # the separate tag namespace. PEP 440 comparison because hatchling normalises the version
          # (tag webconsole-v0.3.0-rc1 -> 0.3.0rc1), so a string compare could never match a pre-release.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            want="${GITHUB_REF_NAME#webconsole-v}"
            /tmp/webconsolesmoke/bin/python -I - "$built" "$want" <<'PYVER'
          import sys
          from packaging.version import InvalidVersion, Version

          built, want = sys.argv[1], sys.argv[2]
          try:
              b, w = Version(built), Version(want)
          except InvalidVersion as exc:
              raise SystemExit(f"::error::unparseable version ({exc}) — built={built!r} tag={want!r}")
          if b != w:
              raise SystemExit(
                  f"::error::console wheel version {built} != tag {want} (normalised {b} != {w})"
              )
          print(f"console version matches tag: {b}")
          PYVER
          fi

      # CREATE-OR-UPDATE, and it must CREATE — unlike release-harness, this job has no `needs: release`,
      # so on a `webconsole-v*` tag NO engine job has run and NO GitHub release exists. A bare
      # `gh release upload` (what the harness can safely use, because `needs: release` guarantees the
      # release) would fail with "release not found" on every console tag, killing the job BEFORE the
      # publish step below — i.e. the one job whose purpose is to claim the PyPI name could never claim it.
      #
      # The update arm is equally load-bearing: v0.3.1 showed a bare `gh release create` turns a single
      # PyPI failure into a permanent retry deadlock (every re-run dies here and SKIPS the publish, so a
      # re-run cannot even test the fix it exists to verify). Step ORDER is deliberate and matches the
      # engine: the reversible action (a GitHub release, deletable) precedes the irreversible one (a PyPI
      # upload burns that version forever).
      - name: Create or update the console GitHub release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#webconsole-v}"
          # Notes come from the CONSOLE's own changelog, not the engine's — separate cadence, separate
          # version root, separate release notes.
          awk -v v="$ver" 'BEGIN{f=0} /^## \[/{ if(f) exit; if(index($0,"["v"]")) f=1 } f{print}'             packaging/messagefoundry-webconsole/CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "MessageFoundry web console $tag" > notes.md
          case "$ver" in
            *-*) pre_create="--prerelease"; pre_edit="--prerelease=true"  ;;
            *)   pre_create="";             pre_edit="--prerelease=false" ;;
          esac
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — updating in place (this is a re-run)."
            gh release edit "$tag" --title "$tag" --notes-file notes.md "$pre_edit"
            gh release upload "$tag" webconsole-dist/*.whl --clobber
          else
            gh release create "$tag" webconsole-dist/*.whl --title "$tag" --notes-file notes.md $pre_create
          fi

      - name: Upload console artifact (dry-run / always)
        # always() so a FAILED build still yields something to inspect -- but never an
        # archive the member gate refused, which is what a bare always() did (BACKLOG #1838).
        if: always() && steps.member-gate.outcome != 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: webconsole-artifacts
          path: webconsole-dist/
          if-no-files-found: ignore

      # GATED like the harness: no-op until the owner sets repo variable PUBLISH_WEBCONSOLE=true. The
      # build + version-check above still run on every console tag, so the publish path is exercised
      # before it is armed. Flipping the variable is what actually claims the PyPI name.
      - name: Publish messagefoundry-webconsole to PyPI (Trusted Publishing / OIDC)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_WEBCONSOLE == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: webconsole-dist/
          skip-existing: true
          attestations: true

  release-harness:
    # Build + publish the SEPARATE `messagefoundry-harness` distribution (the synthetic test/load/failover
    # harness, packaging/messagefoundry-harness/) in lockstep with the engine — same version, same tag.
    # Isolated from the `release` job so a harness-side issue can never jeopardize the engine release;
    # `needs: release` so the engine ships (and its GitHub release exists) first. Inherits the workflow's
    # contents:write + id-token:write. The PyPI publish is GATED on the `PUBLISH_HARNESS` repo variable:
    # until the owner sets up the harness Trusted Publisher AND PUBLISH_HARNESS=true (see the header note),
    # this job still BUILDS + version-checks the wheel and attaches it to the GitHub release, but does not
    # publish — so a missing harness PyPI project can never red a release.
    #
    # Source-repo only, same guard as `release` above (see the rationale there — it was inverted for the
    # retired mirror topology and is flipped as of the cutover). `needs: release` already cascades the
    # skip, so this is belt-and-braces: it keeps the harness release from firing anywhere that is not the
    # source repo even if that dependency is ever dropped.
    if: github.repository == 'MEFORORG/MessageFoundry'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # gh release upload (attach the harness wheel)
      id-token: write   # PyPI Trusted Publishing (OIDC) for the harness wheel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # gh upload uses GH_TOKEN env / OIDC, never the persisted git credential

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build the harness wheel (wheel-only — harness/ is force-included from the repo root)
        run: |
          # HASH-PINNED, same rationale as the engine's build step: this job also holds contents/id-token:
          # write, and it publishes the harness wheel when PUBLISH_HARNESS is set. `build` and its
          # transitives come from ci/locks/release-tools.lock; see that step for why no pip bootstrap.
          python -m pip install --require-hashes -r ci/locks/release-tools.lock
          # Wheel-only on purpose: the harness source (harness/) lives OUTSIDE this project dir (it is
          # force-included from ../../harness), so an sdist would not be self-contained. Pure-Python, so a
          # wheel suffices. Version is read from messagefoundry/__init__.py (lockstep with the engine).
          python -m build --wheel ./packaging/messagefoundry-harness --outdir harness-dist
          ls -l harness-dist/

      # THE ARTIFACT THAT MOST NEEDS THIS, and the one that had no gate at all (BACKLOG #1832, #1702).
      # `harness/` is FORCE-INCLUDED from the repo root, and hatchling's `exclude` does not filter a
      # force-included tree — so unlike the engine sdist, the harness wheel has no build-time defence
      # to fall back on, and `harness/CLAUDE.md` was inside it by construction. #1702 fixed the build
      # config; this is the release-time backstop, and for this distribution it is the only one.
      - name: Member gate — no distribution may ship a maintainer-internal file
        # Referenced by this job's artifact-upload `if:` below (BACKLOG #1838). This job had
        # a BARE always() there, so a refused wheel was uploaded as a downloadable artifact
        # regardless -- the engine job's leak gate already had this guard and these did not.
        id: member-gate
        run: python scripts/release/forbidden_members.py 'harness-dist/*.whl'

      - name: Smoke-check the harness wheel (clean venv, install, import, version == engine == tag)
        run: |
          # THIS STEP USED TO READ THE VERSION OUT OF THE WHEEL FILENAME and never install the wheel
          # (BACKLOG #1701): `re.search(r'messagefoundry_harness-([^-]+)-', glob(...))`. harness/ is
          # force-included from two directories up, which is the one part of this build most likely to
          # break silently — and a wheel carrying no harness/ at all is named exactly like a good one,
          # so the old step passed it and the release shipped an empty distribution. The wheel is now
          # installed into the smoke venv and its entry module imported out of it.
          #
          # PEP 440 comparison below, for a STRONGER reason than the engine's copy of this check: `built`
          # comes from the wheel's own METADATA, which hatchling has already normalised. On tag
          # v0.3.0-rc1 the metadata says 0.3.0rc1 while want=0.3.0-rc1, so a string compare could NEVER
          # match — this job failed on every pre-release tag by construction, whatever __version__ said.
          # With PUBLISH_HARNESS=true it also runs after the engine has already uploaded, so the failure
          # would land half-published.
          #
          # Pin DERIVED from constraints.lock + installed outside the tag guard — see the engine job's
          # wheel smoke above for the full rationale — and into a THROWAWAY VENV, not this job's
          # interpreter, which is the other half of ADR 0034's recommendation. This job holds
          # contents: write + id-token: write and the steps AFTER this one attach the wheel to the
          # release and publish it to PyPI, so an install resolved into the main interpreter here sits
          # inside the publishing identity.
          PKG_PIN="$(sed -n 's/^packaging==\([^ ;]*\).*/\1/p' constraints.lock | head -1)"
          if [ -z "$PKG_PIN" ]; then
            echo "::error::no packaging== pin in constraints.lock — refusing an unpinned install on the release path"; exit 1
          fi
          echo "packaging pin from constraints.lock: $PKG_PIN"
          python -m venv /tmp/harnesssmoke
          /tmp/harnesssmoke/bin/pip install --quiet "packaging==$PKG_PIN"
          # --no-deps IS LOAD-BEARING, NOT AN OPTIMISATION. messagefoundry-harness depends on
          # messagefoundry[harness], so a full install would resolve the ENGINE AND PySide6 FROM PYPI
          # inside a job holding id-token: write — and at this moment the engine release above has just
          # published, so it would also be a live index round-trip on the release path. Install the
          # built wheel alone; the import below is chosen to need nothing else.
          /tmp/harnesssmoke/bin/pip install --quiet --no-deps harness-dist/*.whl
          # A failure inside this command substitution fails the step: Actions runs the block as
          # `bash -e {0}` and a simple assignment carries the substitution's own status. See the
          # console job's copy of this note for the measurement.
          built=$(/tmp/harnesssmoke/bin/python -I - <<'PYSMOKE'
          import importlib
          import sys
          from importlib.metadata import distribution
          from pathlib import Path

          DIST = "messagefoundry-harness"
          PKG = "harness"

          # -I (isolated) is what keeps the CHECKOUT out of sys.path. The repo root carries harness/ —
          # that is where this wheel's contents come from — and this step runs from that root, so
          # without it the checkout would answer every question below and the wheel would never be
          # touched. -P or PYTHONSAFEPATH would do as well; -E alone is a silent no-op here.
          prefix = Path(sys.prefix).resolve()

          # harness/ IS A PEP 420 NAMESPACE PACKAGE (no __init__.py), so `import harness` SUCCEEDS
          # against an empty directory and its __file__ is None — a top-level import would pass on
          # exactly the empty wheel this check exists to reject. Import the ENTRY module instead: it
          # has a real __file__, and its module top level is argparse/sys/datetime only (PySide6 and
          # the engine are imported lazily inside the subcommands), so it loads under --no-deps.
          try:
              entry = importlib.import_module(PKG + ".__main__")
          except ImportError as exc:
              raise SystemExit(
                  f"::error::cannot import {PKG}.__main__ from the smoke venv ({exc}) — the wheel "
                  f"shipped no package tree, or shipped one this interpreter cannot load"
              ) from None

          if not getattr(entry, "__file__", None):
              raise SystemExit(
                  f"::error::{PKG}.__main__ has no __file__ — the wheel shipped no module there"
              )
          origin = Path(entry.__file__).resolve()
          if not origin.is_relative_to(prefix):
              raise SystemExit(
                  f"::error::{PKG}.__main__ resolved to {origin}, OUTSIDE the smoke venv {prefix} — "
                  f"the checkout shadowed the wheel and this step inspected the wrong tree"
              )

          # BIND THE MODULE TO THIS DISTRIBUTION. Everything above proves SOME module for PKG sits in
          # the venv; RECORD is what says it came out of THIS wheel. Without the membership test the
          # two questions are separate, and a venv where another distribution owns the import name
          # answers the first one happily.
          dist = distribution(DIST)
          recorded = [name for f in (dist.files or []) if (name := str(f)).startswith(PKG + "/")]
          if not recorded:
              raise SystemExit(
                  f"::error::{DIST} RECORD lists no {PKG}/ members — the wheel is metadata wrapped "
                  f"around an empty package tree (a broken force-include builds and installs cleanly)"
              )
          if not any(Path(f.locate()).resolve() == origin for f in (dist.files or [])):
              raise SystemExit(
                  f"::error::{origin} is not a file {DIST} recorded — the module this step imported "
                  f"belongs to something else on sys.path, so the wheel was never inspected"
              )

          # The declared console_scripts target, resolved. `messagefoundry-harness` on a fresh install
          # calls harness.__main__:main, and a wheel whose entry point does not resolve is a wheel that
          # fails on its user's first command.
          if not callable(getattr(entry, "main", None)):
              raise SystemExit(
                  f"::error::{PKG}.__main__ has no callable main() — the messagefoundry-harness "
                  f"console script would fail on first run"
              )

          # THE LOCKSTEP PIN, CHECKED ON THE BUILT ARTIFACT (BACKLOG #1585). packaging/
          # messagefoundry-harness/pyproject.toml pins messagefoundry[harness]==<engine version>, and
          # PEP 621 `dependencies` is STATIC, so a version bump is two edits. tests/test_packaging.py
          # catches a drift, but NOTHING in this workflow runs that suite and a tag can be cut from a
          # commit the merge queue never gated. This is the last place the claim is checkable before
          # the PyPI upload burns the version forever, and the metadata is already open.
          # `packaging` is installed above, in this same venv, from the constraints.lock pin. Imported
          # here rather than at the top because everything before this point is stdlib-only, and that
          # is what lets the earlier guards report a broken wheel instead of a missing dependency.
          from packaging.requirements import Requirement
          from packaging.version import InvalidVersion, Version

          # AN EXTRA'S REQUIREMENT IS NOT ONE OF THESE, and counting it was a defect that could only
          # surface AFTER the upload. `[project.optional-dependencies]` reaches Requires-Dist as
          # `<requirement>; extra == "<name>"`, a line a plain `pip install messagefoundry-harness`
          # never installs. The sibling packaging/messagefoundry-webconsole/pyproject.toml already
          # carries `dev = ["messagefoundry[dev]"]`, so the first such table added here puts a SECOND
          # messagefoundry line in this wheel's metadata and the count below reads 2.
          # tests/test_packaging.py cannot catch it -- that suite reads `project.dependencies`, and an
          # extra is not in it -- so ci.yml stays GREEN and this step, which carries `needs: release`,
          # reds with the engine already on PyPI. Half a release, and the version burnt.
          #
          # SKIPPED NARROWLY, AND THAT IS THE HALF WORTH NOT LOSING. Dropping every requirement whose
          # marker is false in this venv reads simpler and would also drop a platform- or
          # python_version-gated one, so a drifted pin wearing `; sys_platform == "win32"` would sail
          # past the check BACKLOG #1585 exists to provide, on a step that only ever runs on ubuntu.
          # A line is skipped only when an extra this wheel DECLARES is what turns its marker true;
          # a marker false here for any other reason is still counted, and still fails loudly.
          #
          # NOT COVERED: `extra == "dev" and sys_platform == "win32"`, where the non-extra half is
          # false on the runner too. No declared extra turns that marker true, so it is counted
          # rather than skipped -- erring toward the loud failure, which is the safe side of this.
          extras = dist.metadata.get_all("Provides-Extra") or []

          def gated_by_an_extra(req: Requirement) -> bool:
              if req.marker is None or req.marker.evaluate({"extra": ""}):
                  return False
              return any(req.marker.evaluate({"extra": extra}) for extra in extras)

          engine = [
              req
              for raw in (dist.metadata.get_all("Requires-Dist") or [])
              if (req := Requirement(raw)).name.replace("_", "-").lower() == "messagefoundry"
              and not gated_by_an_extra(req)
          ]
          if len(engine) != 1:
              # The surviving requirements are named because this message is read at tag time, with
              # the engine already published: "2" alone does not say which line to delete.
              raise SystemExit(
                  f"::error::{DIST} {dist.version} declares {len(engine)} requirements on the engine, "
                  f"expected exactly one (BACKLOG #1585): {[str(req) for req in engine]}"
              )
          # THE PINNED VERSION IS COMPARED AS A PEP 440 VERSION, NOT AS A SPECIFIER STRING. `packaging`
          # preserves the raw spelling: str(Requirement("messagefoundry[harness]==0.3.0-rc1").specifier)
          # is "==0.3.0-rc1", and str(Requirement(...)) round-trips it, so a hyphen typed into the
          # harness pyproject reaches Requires-Dist intact while `Version:` beside it has been
          # canonicalised to 0.3.0rc1. An f"=={dist.version}" string compare therefore calls a CORRECT
          # lockstep pin a drift on every pre-release, and prints two versions that are the same one.
          #
          # THE OPERATOR AND THE EXTRA STAY EXACT, and that is the half worth not losing: a range is
          # not a lockstep pin however it is spelled, and dropping [harness] makes the table look
          # stricter while it quietly stops installing PySide6
          # (tests/test_packaging.py::test_the_harness_pin_keeps_the_extra_the_harness_actually_needs).
          clauses = list(engine[0].specifier)
          pinned = None
          if len(clauses) == 1 and clauses[0].operator == "==":
              try:
                  pinned = Version(clauses[0].version)
              except InvalidVersion:
                  # A WILDCARD PIN IS A DRIFT, NOT A BROKEN ARTIFACT, and it must not escape through
                  # the metadata branch below. `==0.3.0.*` is a legal specifier that Version() refuses
                  # — and it matches 0.3.0.1 and 0.3.0.post1, so it is precisely the loose shape this
                  # check exists to refuse (tests/test_packaging.py::_engine_pin screens the same
                  # shape). Reported as "unparseable version" it would drop BACKLOG #1585 and the
                  # instruction to fix the dependencies table, telling the operator the wheel is
                  # corrupt when the pyproject is merely wrong.
                  pinned = None
          try:
              shipped = Version(dist.version)
          except InvalidVersion as exc:
              # The DISTRIBUTION's own version, not the pin: a build that wrote an unparseable
              # `Version:` is a broken artifact and gets its own message.
              raise SystemExit(
                  f"::error::unparseable version ({exc}) — {DIST} metadata {dist.version!r}"
              )
          if pinned is None or pinned != shipped or engine[0].extras != {"harness"}:
              raise SystemExit(
                  f"::error::{DIST} {dist.version} requires "
                  f"messagefoundry{sorted(engine[0].extras)}{engine[0].specifier}, not "
                  f"messagefoundry[harness]=={dist.version} — this is a LOCKSTEP distribution and its "
                  f"pin drifted from the version it ships at (BACKLOG #1585). Fix the dependencies "
                  f"table in packaging/messagefoundry-harness/pyproject.toml and re-cut the tag."
              )

          print(
              f"harness wheel installed from {origin}: {len(recorded)} {PKG}/ members, "
              f"entry point {PKG}.__main__:main resolves, requires "
              f"messagefoundry[harness]{engine[0].specifier}, version {dist.version}",
              file=sys.stderr,
          )
          print(dist.version)
          PYSMOKE
          )
          echo "harness wheel version: $built"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            want="${GITHUB_REF_NAME#v}"
            /tmp/harnesssmoke/bin/python -I - "$built" "$want" <<'PYVER'
          import sys
          from packaging.version import InvalidVersion, Version

          built, want = sys.argv[1], sys.argv[2]
          try:
              b, w = Version(built), Version(want)
          except InvalidVersion as exc:
              raise SystemExit(f"::error::unparseable version ({exc}) — built={built!r} tag={want!r}")
          if b != w:
              raise SystemExit(
                  f"::error::harness wheel version {built} != tag {want} (normalised {b} != {w})"
              )
          print(f"harness version matches tag: {b}")
          PYVER
          fi

      - name: Attach the harness wheel to the GitHub release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" harness-dist/*.whl --clobber

      - name: Upload harness artifact (dry-run / always)
        # always() so a FAILED build still yields something to inspect -- but never an
        # archive the member gate refused, which is what a bare always() did (BACKLOG #1838).
        if: always() && steps.member-gate.outcome != 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: harness-artifacts
          path: harness-dist/
          if-no-files-found: ignore

      # GATED: no-op until the owner configures the messagefoundry-harness PyPI Trusted Publisher AND sets
      # repo variable PUBLISH_HARNESS=true. The build + version-check above still run every release.
      - name: Publish messagefoundry-harness to PyPI (Trusted Publishing / OIDC)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_HARNESS == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: harness-dist/
          skip-existing: true
          attestations: true

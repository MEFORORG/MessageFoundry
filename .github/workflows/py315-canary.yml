# Python 3.15 readiness canary -- ADVISORY, NEVER REQUIRED.
#
# The project requires Python 3.14. This workflow tells us, before 3.15 ships, what changes when the
# engine runs on it. Two changes matter most:
#
#   * PEP 686 makes UTF-8 the default for every text read, write and subprocess decode that names no
#     encoding. The engine and harness name theirs, pinned by tests/test_subprocess_text_encoding.py.
#   * SSLContext.set_groups and SSLContext.set_ciphersuites exist on 3.15. The TLS code feature-
#     detects both with hasattr (config/tls_policy.py, apiclient/client.py), so on 3.15 they go live
#     on every TLS context. If the bundled OpenSSL rejected a group name, building a context would
#     raise and the engine would not start. The TLS and apiclient tests are what exercise that.
#
# IT MUST NEVER BLOCK A MERGE:
#   * Its job name, "python 3.15 canary (<os>)", is NOT in .github/required-contexts.txt, and
#     tests/test_required_contexts.py lists it in _MUST_NOT_BE_REQUIRED. Do not add it to branch
#     protection: it has no merge_group trigger, so a required copy would never report in the queue
#     and would wedge every entry.
#   * On a pull request it runs only when this file changes, so the PR that edits the canary can
#     read it. Weekly cron and manual dispatch are its normal cadence.
#
# IT IS ALLOWED TO GO RED, and that is deliberate. It copies freethread-smoke.yml's shape: every
# diagnostic step is continue-on-error so all outcomes are collected, and a final verdict step rules
# on them. A canary that cannot fail cannot tell "flew clean" from "never flew".
#
# EXPECT RED WHEN IT FIRST RUNS. Measured locally 2026-09-30 on CPython 3.15.0b3 / OpenSSL 3.5.7,
# Windows: the TLS and apiclient subset went 16 failed, 1017 passed, 19 skipped. Five of those are
# tripwires built to fire when the 3.15 APIs appear; the rest are recorded in the pull request that
# added this file. Two dependencies had no cp315 Windows wheel for the version pip picked (pyyaml,
# httptools), and released pydantic 2.13.5 pins a pydantic-core with no cp315 wheel.

name: python 3.15 canary

on:
  schedule:
    - cron: "30 6 * * 2" # Tuesdays 06:30 UTC, off freethread-smoke's Monday slot
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/py315-canary.yml"

concurrency:
  group: py315-canary-${{ github.ref }}
  cancel-in-progress: true

# Read-only: install and test. No gh writes, no secrets.
permissions:
  contents: read

defaults:
  run:
    # Explicit bash gives `-eo pipefail` on every OS, including the Windows leg (Git Bash).
    shell: bash

jobs:
  canary:
    name: python 3.15 canary (${{ matrix.os }})
    # NO job-level continue-on-error: see the header.
    strategy:
      fail-fast: false
      matrix:
        # Windows is the deployment target; Linux is the cheap breadth.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # read-only job; do not persist the token (zizmor: artipacked)

      - name: Set up Python 3.15
        id: setup
        continue-on-error: true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true

      # What the canary is actually measuring. If set_groups is absent, the TLS half of this run did
      # not exercise the 3.15 path, and the verdict says so rather than reporting a clean run.
      - name: Record the interpreter and its TLS surface
        id: probe
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import os, ssl, sys
          ctx = ssl.create_default_context()
          groups = hasattr(ctx, "set_groups")
          print(f"sys.version = {sys.version}")
          print(f"ssl.OPENSSL_VERSION = {ssl.OPENSSL_VERSION}")
          print(f"utf8_mode = {sys.flags.utf8_mode}")
          print(f"set_groups = {groups}, set_ciphersuites = {hasattr(ctx, 'set_ciphersuites')}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={sys.version.split()[0]}\n")
              out.write(f"openssl={ssl.OPENSSL_VERSION}\n")
              out.write(f"set_groups={groups}\n")
          PY

      # DELIBERATELY UNCONSTRAINED, as in freethread-smoke.yml: constraints.lock records what
      # resolved on 3.14, and pinning it here measures the lock instead of 3.15. A dependency with no
      # cp315 wheel is a FINDING, so sdists are allowed and the next step names each one.
      - name: Install the engine (dev extra)
        id: install
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install --report pip-report.json -e ".[dev]"

      - name: Name the dependencies that installed from an sdist
        id: wheels
        if: always() && steps.setup.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path("pip-report.json")
          if not report.is_file():
              names = "unknown (install failed before pip wrote its report; read the install log)"
          else:
              items = json.loads(report.read_text(encoding="utf-8"))["install"]
              sdists = sorted(
                  i["metadata"]["name"]
                  for i in items
                  if i.get("download_info", {}).get("url", "").endswith((".tar.gz", ".zip"))
              )
              names = ", ".join(sdists) or "none"
          print(f"built from sdist (no cp315 wheel): {names}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"sdists={names}\n")
          PY

      - name: TLS policy and apiclient tests
        id: tls
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          # Redirect and re-read rather than `| tee`, so pytest's own status is the step's.
          STATUS=0
          python -m pytest -q -rfE -p no:cacheprovider \
            tests/test_tls_*.py tests/test_apiclient*.py tests/test_api_tls.py \
            tests/test_connection_tls_*.py tests/test_mllp_tls.py \
            tests/test_subprocess_text_encoding.py > tls.txt 2>&1 || STATUS=$?
          cat tls.txt
          PASSED="$(grep -oE '[0-9]+ passed' tls.txt | tail -1 | grep -oE '[0-9]+' || true)"
          echo "passed=${PASSED:-0}" >> "$GITHUB_OUTPUT"
          echo "summary=$(tail -1 tls.txt)" >> "$GITHUB_OUTPUT"
          exit $STATUS

      # A smoke of the engine suite with the same selection the required legs use. Its result goes in
      # the verdict and the summary; read the log for which tests failed and why.
      - name: Engine suite smoke
        id: suite
        if: steps.install.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 50
        run: |
          STATUS=0
          python -m pytest -q -n auto --dist loadfile -p no:cacheprovider -m 'not tooling' \
            --ignore-glob='*messagefoundry-webconsole*' --continue-on-collection-errors \
            --timeout=120 > suite.txt 2>&1 || STATUS=$?
          tail -200 suite.txt
          echo "summary=$(tail -1 suite.txt)" >> "$GITHUB_OUTPUT"
          exit $STATUS

      - name: Verdict -- did the canary fly, and what did it find?
        if: always()
        env:
          SETUP: ${{ steps.setup.outcome }}
          PROBE: ${{ steps.probe.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          TLS: ${{ steps.tls.outcome }}
          SUITE: ${{ steps.suite.outcome }}
          VERSION: ${{ steps.probe.outputs.version }}
          OPENSSL: ${{ steps.probe.outputs.openssl }}
          SET_GROUPS: ${{ steps.probe.outputs.set_groups }}
          SDISTS: ${{ steps.wheels.outputs.sdists }}
          TLS_PASSED: ${{ steps.tls.outputs.passed }}
          TLS_SUMMARY: ${{ steps.tls.outputs.summary }}
          SUITE_SUMMARY: ${{ steps.suite.outputs.summary }}
        run: |
          VERDICT=""
          if [ "$SETUP" != "success" ]; then
            echo "::error title=3.15 canary did not fly::could not provision Python 3.15 (setup outcome=$SETUP)"
            VERDICT="did-not-fly"
          else
            if [ "$SET_GROUPS" != "True" ]; then
              echo "::error title=3.15 TLS path not exercised::SSLContext.set_groups is absent on $VERSION, so the group pin stayed inert and the TLS tests measured the 3.14 path"
              VERDICT="tls-path-not-exercised"
            fi
            for pair in "probe:$PROBE" "install:$INSTALL" "TLS tests:$TLS" "suite smoke:$SUITE"; do
              NAME="${pair%%:*}"
              OUT="${pair##*:}"
              if [ "$OUT" != "success" ]; then
                echo "::error title=3.15 canary finding::$NAME outcome=$OUT on Python $VERSION"
                VERDICT="found"
              fi
            done
            if [ "$TLS" = "success" ] && [ "${TLS_PASSED:-0}" -eq 0 ]; then
              echo "::error title=3.15 canary measured nothing::the TLS step succeeded with 0 passing tests"
              VERDICT="vacuous"
            fi
          fi
          if [ -n "$SDISTS" ] && [ "$SDISTS" != "none" ]; then
            echo "::warning title=No cp315 wheel::installed from sdist: $SDISTS"
          fi
          {
            echo "## Python 3.15 canary (${RUNNER_OS})"
            echo ""
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| provision 3.15 | $SETUP (${VERSION:-n/a}, ${OPENSSL:-n/a}) |"
            echo "| SSLContext.set_groups present | ${SET_GROUPS:-n/a} |"
            echo "| install | $INSTALL |"
            echo "| built from sdist | ${SDISTS:-n/a} |"
            echo "| TLS and apiclient tests | $TLS: ${TLS_SUMMARY:-n/a} |"
            echo "| engine suite smoke | $SUITE: ${SUITE_SUMMARY:-n/a} |"
            echo ""
            if [ -z "$VERDICT" ]; then
              echo "The canary flew clean on Python $VERSION."
            else
              echo "Verdict: \`$VERDICT\`. This job is advisory and blocks nothing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$VERDICT" ]

name: CLA Assistant

# Requires every PR contributor to agree to CLA.md before their PR can be merged.
# Signatures are recorded in-repo on the `cla-signatures` branch, so no extra secret is
# needed — the default GITHUB_TOKEN (with contents: write below) is sufficient.
#
# NOTE: pull_request_target workflows only run from the DEFAULT branch, so this takes effect
# once it is merged to main. Signing IS already mandatory: the required status-check context is
# `cla` -- the JOB key below, because that job declares no `name:`. It is NOT "CLA Assistant",
# which is this WORKFLOW's name and matches no status check; adding that string to branch
# protection would wedge every PR forever (docs/CI.md, "the required-but-absent trap").
# See .github/required-contexts.txt.

on:
  # BACKLOG #340 step 1. THE QUEUE IS LIVE, SO THIS TRIGGER IS LOAD-BEARING -- DO NOT REMOVE IT.
  # `cla` is a REQUIRED context, and branch protection evaluates required contexts on the
  # MERGE-GROUP commit, so removing this trigger means `cla` never reports in the queue and NOTHING
  # MERGES. That is not hypothetical: codeql.yml's header records PR 619 sitting AWAITING_CHECKS on
  # the queue's first entry with its CodeQL contexts simply absent.
  #
  # THIS JOB'S GREEN MEANS TWO DIFFERENT THINGS UNDER ONE CONTEXT NAME, AND THE NAME CANNOT SHOW
  # THE DIFFERENCE. The `CLA Assistant` step below is gated to the comment triggers and to
  # `pull_request_target`, so on a merge_group event it is SKIPPED and the job still reports `cla`
  # success. Measured 2026-09-03 on PR 754, a paired run on one change: run 33796353619
  # (pull_request_target) RAN the step, run 33797809984 (merge_group) SKIPPED it, and both jobs
  # were green. That is BACKLOG #340's option (i), whose own 2026-08-14 amendment warns it
  # manufactures a permanent green-that-means-not-applicable on the merge path -- the silent-control
  # decay ADR 0158 names.
  #
  # WHETHER THAT QUEUE-TIME GREEN IS MERELY DECORATIVE IS UNESTABLISHED. DO NOT READ IT EITHER WAY.
  # PR 754 did carry a green PR-time `cla` before it was queued (check-run success 19:25:55Z, the
  # only `cla` among 41 check-runs on head 1e9f1cb3), which is consistent with the PR-time check
  # being the one that does the work. But nobody has established that GitHub REQUIRES that PR-time
  # green before an entry may join the queue, and no negative case was manufactured to find out. It
  # is recorded as open on BACKLOG #340. Signing enforcement is NOT weakened by anything written
  # here; it is also not proven by it.
  #
  # THIS COMMENT USED TO SAY "INERT UNTIL A MERGE QUEUE EXISTS ... behaves identically today".
  # That was true when the trigger landed on 2026-08-26 and became false once a queue was
  # configured; corrected 2026-09-03. BACKLOG #340 carries the measurements and STAYS OPEN -- a
  # live queue is not that item being finished, and who enabled the queue is recorded nowhere.
  merge_group:
  issue_comment:
    types: [created]
  pull_request_target:
    # No `closed` (CI cost): the action's on-close behavior (locking the sign-comment thread) is
    # moot while every author is allowlisted below — each merged/closed PR was billing a 1-min
    # runner to do nothing. Signing enforcement lives on the opened/synchronize runs + the required
    # `cla` status context, both untouched.
    #
    # NOTE: this previously read "moot on this private repo". The repo is PUBLIC, so the re-add
    # condition is no longer hypothetical — a fork PR from a non-allowlisted contributor is
    # possible today. It is the ALLOWLIST, not repo visibility, that currently makes the on-close
    # behavior unnecessary. Re-add `closed` if/when such PRs are accepted.
    types: [opened, synchronize]

concurrency:
  # KEYED ON THE PULL REQUEST NUMBER, NOT ON `github.ref` -- BACKLOG #1533.
  # Under `pull_request_target` github.ref is the BASE ref (`refs/heads/main`), not
  # `refs/pull/<n>/merge`, so the previous key put EVERY open pull request into ONE group named
  # `cla-refs/heads/main`. With this arm cancellable, a push to ANY pull request cancelled the
  # in-flight `cla` run of an UNRELATED one. `cla` is a REQUIRED context and a cancelled run is not
  # a success, so the victim cannot merge until something re-runs it -- and what it waits on reports
  # `conclusion: cancelled` with `steps: 0` and no downloadable log (measured on run 34560869543; a
  # healthy run has 5 steps), so it renders in the fail column with NOTHING TO READ. That is why the
  # cause sat unattributed: the evidence is not in the victim's own run, it is in the start time of a
  # run on somebody else's branch. Measured 2026-09-11 over this workflow's last 100 runs, with
  # security.yml as a paired control; numbers and method in BACKLOG #1533.
  #
  # DO NOT "RESTORE" THE SIBLING SPELLING. security.yml, codeql.yml, net-helper.yml, zizmor.yml and
  # quality-advisory.yml all write `github.event_name == 'pull_request' && github.ref`, and they are
  # CORRECT because they declare `pull_request`, where github.ref IS per-pull-request. This workflow
  # declares `pull_request_target`, where that same expression is wrong twice over: the condition
  # never matches, and the ref it would select is shared across every open pull request anyway.
  # dependabot-auto-merge.yml and dependabot-lock-resync.yml already key on the payload number,
  # which is the pattern used here.
  #
  # ONLY THE PULL-REQUEST ARM IS CANCELLABLE; THE OTHER TWO EVENTS KEEP `github.run_id` ON PURPOSE:
  #   * `merge_group` -- `cla` is required and branch protection evaluates it on the merge-group
  #     commit. A cancelled run reports a cancelled context, the same wedge the `on:` note above
  #     records for an ABSENT one. One group per run, so nothing can cancel it.
  #   * `issue_comment` -- the signing path: a contributor's sign comment is processed by that run.
  #     Keying it on the pull request would be unsafe EVEN AT `cancel-in-progress: false`, because
  #     GitHub cancels a run already PENDING in a group when a newer one queues. Two sign comments
  #     in quick succession on one pull request would then discard the first instead of queueing it.
  #     One group per run: never cancelled, never pending behind a sibling.
  #
  # DO NOT HOIST THE NUMBER OUT OF THE CONDITION. `github.event.pull_request.number` is populated on
  # `pull_request_target` but is EMPTY on `issue_comment`, whose payload carries no top-level
  # `pull_request` object at all (the pull request number is `github.event.issue.number` there) and
  # empty on `merge_group`, whose payload carries no pull request number in any form. An
  # unconditional `cla-${{ github.event.pull_request.number }}` would therefore give EVERY
  # issue_comment and merge_group run the single key `cla-`, which is this same defect rebuilt on the
  # signing path. The condition is what keeps those two events on their own keys.
  #
  # THE FALLBACK ARM ALSO FAILS SAFE. If the payload ever carried no number, `A && B || C` yields C,
  # so the group degrades to unique-per-run and cancels nothing; it cannot degrade back into a key
  # shared between pull requests. The saving this block exists for is unchanged -- a rapid sequence
  # of pushes to ONE pull request supersedes itself, which is what the previous key was trying and
  # failing to express.
  group: cla-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # REQUIRED BECAUSE THE ACTION BELOW IS LOCAL (BACKLOG #1381 vendored it from a remote one).
      # A remote `uses:` needs no working copy; a LOCAL `uses: ./...` resolves against
      # GITHUB_WORKSPACE, so without a checkout the runner cannot find action.yml and the job dies
      # with "Did you forget to run actions/checkout before running your local action?". The
      # vendoring swapped remote for local and did not add this step, which broke the required `cla`
      # context once GitHub began serving the new default-branch workflow -- measured live between
      # 05:18Z (last passing run, which still downloaded the REMOTE action) and 11:13Z.
      #
      # NO `ref:` HERE, DELIBERATELY. Under `pull_request_target` the default checkout is the BASE
      # commit, which is what this job wants and is the safe form. Setting `ref:` to the pull
      # request's head would run FORK-AUTHORED code with this workflow's write-scoped token and its
      # access to the signature branch -- the classic pull_request_target privilege escalation. The
      # action needs only its own vendored source, which the base already carries.
      - name: Check out the base, so the vendored local action resolves
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The step above deliberately checks out the BASE, not the head, so fork code never runs
          # with this workflow's write scope. `persist-credentials: false` closes the other half:
          # without it, checkout writes the job's token into .git/config, where any later step --
          # or anything that can read the workspace -- could use it against the signature branch.
          # Zizmor calls this `artipacked`. It is a low finding in general and worth more here,
          # because this job holds `contents: write` on a `pull_request_target` trigger.
          #
          # SAFE, AND MEASURED RATHER THAN ASSUMED. The vendored action is a node20 action that
          # takes GITHUB_TOKEN through `env:` and talks to the REST API; it never shells out to
          # git, so it does not read these credentials. Against dist/index.js: ZERO matches for
          # child_process|execSync|spawnSync|simple-git, against 357 for octokit/api.github.com.
          # It needs the action's FILES on disk, which this checkout still provides.
          persist-credentials: false

      - name: CLA Assistant
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA and I agree to its terms.') ||
          github.event_name == 'pull_request_target'
        uses: ./.github/actions/cla-assistant-lite # vendored ca4a40a7d1004f18d9960b404b97e5f30a505a08 (v2.6.1); upstream archived, see .github/actions/cla-assistant-lite/README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/MEFORORG/MessageFoundry/blob/main/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'cla-signatures'
          custom-pr-sign-comment: 'I have read the CLA and I agree to its terms.'
          custom-notsigned-prcomment: >-
            Thanks for your contribution! Before we can merge it, please read our
            [Contributor License Agreement](https://github.com/MEFORORG/MessageFoundry/blob/main/CLA.md)
            and sign it by posting the comment below.
          custom-allsigned-prcomment: 'All contributors have signed the CLA. ✅'
          # The maintainer and known bot accounts don't need to sign. Enumerate the actual bots —
          # a `bot*` glob would let any human whose username starts with "bot" skip signing (low-28).
          allowlist: 'wshallwshall,dependabot[bot],github-actions[bot]'

name: Branch leak scan

# DETECTION, NOT A GATE. Read that first, because the difference is the whole design.
#
# This repo IS the published artifact. A push to a public remote makes its content public the instant
# it completes, so nothing that runs afterwards can prevent a leak -- it can only tell you one
# happened, in time to delete the branch, assess the exposure and respond. Do NOT add this to
# .github/required-contexts.txt and do not describe it anywhere as a control that stops a leak. A
# required context gates MERGING, which is not the event this watches.
#
# WHY IT EXISTS AT ALL, i.e. why the leak gate in security.yml is not enough. That workflow's
# `forbidden-content` job triggers on at least pull_request, merge_group and a daily cron; read that
# workflow's `on:` block for the live set rather than this sentence. A branch pushed WITHOUT a pull
# request is scanned by none of them, and that is exactly the shape of the realistic leak: a branch
# cut from a fetched private-lineage ref carries docs/security inside a commit TREE, where
# .gitignore is never consulted because the files never went through the index.
#
# WHY THIS IS NOT DONE SERVER-SIDE, which would be strictly better. It cannot be, and this was
# measured on 2026-08-05 rather than assumed:
#
#   gh api -X POST repos/MEFORORG/MessageFoundry/rulesets -f target='push' \
#     -f 'rules[][type]=file_path_restriction' ...
#   -> 422  "Source public repos cannot have push rules"
#
# BACKLOG #1034's "durable answer is server-side" also names `enforce_admins`, and for THIS job that
# half is beside the point under either value: the setting governs PROTECTED BRANCHES, so it does
# nothing about an arbitrary feature branch. Its value is deliberately not restated here -- it is a
# server setting and it has moved more than once. This header used to name re-enabling it as the
# OUTSTANDING half of #1034, and that framing went false without a single edit to the line, which is
# the argument for a pointer rather than a fresh copy. Read it if it matters:
#
#   gh api repos/MEFORORG/MessageFoundry/branches/main/protection/enforce_admins
#
# So there is no server-side content control available for this repository, and the only prevention is
# the client-side pre-push guard (scripts/hooks/push_guard.py) -- which `git push --no-verify` skips
# and which a fresh clone does not have installed until scripts/coord/install-git-hooks.ps1 runs.
# This job is the backstop behind that, and nothing else is.
#
# WHY NO `paths:` FILTER, despite the obvious cost saving. A filter of `paths: ['docs/security/**']`
# would make this nearly free, but GitHub's path filtering for a push event is evaluated against the
# commits in the push, and its behaviour for a NEWLY CREATED branch is not clearly specified. A filter
# that might silently not fire on the one case this exists to catch is worse than no job: it would
# report green by not running. Paying for a small job on every branch push buys an answer that does
# not depend on undocumented behaviour.
#
# COST, stated because CI cost is a live constraint here -- live enough that security.yml dropped its
# post-merge `push: branches: [main]` arm on 2026-09-08 as a re-scan of a tree its merge_group run had
# just scanned: one ubuntu job, a full-history checkout plus setup-python plus a stdlib-only scanner,
# no install step and no dependency resolution.
#
# WHAT IT SCANS (BACKLOG #5595): the TIP working tree, and then every file each commit on the branch
# added or changed, at that commit. Scanning only the tip missed content added in one pushed commit
# and removed in a later one: the earlier commit is still public by SHA while the tip is clean. The
# commits are EVERY commit reachable from the pushed head and not from `origin/main`, on every push,
# since main's content went through the merge queue's scan. It is NOT the push's `before..after`
# (BACKLOG #8244 item 63): that range trusts the run for the earlier push to have finished, and a run
# that errored, timed out or never started left its commits unscanned, with the next push's range
# beginning after them. A commit a force-push dropped from the branch is reachable from neither, so it
# is scanned only if the run for the push that carried it completed. A merge commit is diffed against
# its FIRST parent, so content a conflict resolution introduced is scanned too. Each distinct file
# path and content pair is written once per run, so a branch's earlier commits and its merges of
# main cost one copy each rather than one per commit that repeats them.

on:
  push:
    # `main` is out of scope for a different reason than the rest of this file. This job watches a
    # branch pushed WITHOUT a pull request; branch protection refuses that shape on `main`, so what
    # reaches `main` arrives through the merge queue, where security.yml's `forbidden-content` has
    # already run fully-loaded on the queue entry, with the daily cron behind it. This comment used to
    # cite security.yml's own push-to-main arm, removed 2026-09-08.
    branches-ignore:
      - main

# NO `concurrency:` BLOCK, so no push's scan is ever cancelled or dropped (BACKLOG #5595). This used
# to be a per-ref group with cancel-in-progress, on the premise that "the newer push runs the same scan
# over a superset of the same refs". That premise is FALSE for a force-push: it can drop the earlier
# commits from the branch, so the newer run no longer reaches them, yet they stay public by SHA, and
# the cancelled run was the only one that would have scanned them. A per-ref group without
# cancel-in-progress would not fix it either: GitHub keeps one pending run per group and cancels the
# older pending one. tests/test_branch_leak_scan_range.py refuses the block's return.

permissions:
  contents: read

jobs:
  branch-leak-scan:
    name: branch leak scan (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # zizmor artipacked: checkout leaves the job token in .git/config unless told not to, and a
          # later step or a packaged artifact can then carry it. This job only READS the tree and runs
          # a scanner -- it pushes nothing and calls no API -- so it needs no persisted credential and
          # the flag costs nothing. Fixed here rather than suppressed in .github/zizmor.yml: that file
          # is for findings that are safe-by-design, and this one is simply fixable.
          persist-credentials: false
          # FULL HISTORY, for the range scan below: it needs every pushed commit and origin/main.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ci/python-version
      - name: Scan the pushed tree and every pushed commit for forbidden content
        # Same scanner, same fail-closed posture, same per-section floor as security.yml's
        # forbidden-content job. The floor is what makes "fail closed" mean anything: a
        # partially-mangled secret can load a handful of detectors and pass with a green tick, so
        # requiring a token SOURCE is not sufficient and the section minimums are asserted too.
        #
        # zizmor: the secret is never interpolated into this run: body. It arrives as a step-level env
        # var, which is an opaque value rather than an Actions-expression sink.
        env:
          MEFOR_FORBIDDEN_TOKENS: ${{ secrets.MEFOR_FORBIDDEN_TOKENS }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ -n "$MEFOR_FORBIDDEN_TOKENS" ]; then
            export MEFOR_REQUIRE_TOKENS=1
            export MEFOR_MIN_DETECTORS=names=8,estate=14,site_prefixes=2
            echo "token list loaded from the MEFOR_FORBIDDEN_TOKENS secret (fail-closed, per-section floor)."
          else
            # A push event cannot come from a fork, so unlike security.yml there is no legitimate
            # secret-unavailable case to degrade into. Absent here means misconfigured, and a scanner
            # that quietly drops to structural-only while reporting green is the failure this whole
            # class of gate exists to avoid.
            echo "::error::MEFOR_FORBIDDEN_TOKENS is absent on a push run. The branch leak scan cannot run. Check the repository secret (repo-scoped, not environment-scoped)." >&2
            exit 2
          fi

          # THE PUSHED RANGE (BACKLOG #5595). Every git call below fails the step on error: a range that
          # cannot be computed is not a clean range.
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          for sha in "$PUSH_BEFORE" "$PUSH_AFTER"; do
            case "$sha" in
              *[!0-9a-f]*|"") echo "::error::push SHA '$sha' is not a hex object id." >&2; exit 2 ;;
            esac
            # Exactly 40: a short hex value would resolve as an abbreviated id.
            if [ "${#sha}" -ne 40 ]; then echo "::error::push SHA '$sha' is not 40 hex characters." >&2; exit 2; fi
          done
          if [ "$PUSH_AFTER" = "$zero" ]; then
            echo "branch deleted: no pushed commits to scan; scanning the checked-out tree only."
            python scripts/security/scan_forbidden.py --path .
            exit 0
          fi
          # EVERY commit not on origin/main, never only `before..after` (BACKLOG #8244 item 63): an
          # earlier push's run may have errored, timed out or never started. `before` is validated
          # above and never narrows the scan.
          echo "scanning every commit reachable from the pushed head and not from origin/main."
          commits="$(git rev-list "$PUSH_AFTER" --not refs/remotes/origin/main)"
          snap="$RUNNER_TEMP/branch-leak-scan-commits"
          rm -rf "$snap"
          mkdir -p "$snap"
          roots=()
          files=0
          # One copy of each path-and-content pair: the same blob at the same path is the same scan
          # input, and every push now walks the whole branch, its merges of main included.
          declare -A seen=()
          while read -r sha; do
            [ -n "$sha" ] || continue
            root="$snap/$sha"
            # To a FILE, not a variable: the -z output carries NULs, which a shell variable drops, and
            # a redirect keeps git's exit status, which `set -e` then acts on.
            raw="$snap/$sha.raw"
            base=(--root)
            if git rev-parse -q --verify "${sha}^1" >/dev/null; then base=("${sha}^1"); fi
            # --no-commit-id: with --root, diff-tree otherwise writes the commit id first, which shifts
            # every meta/path pair below by one and skipped every file of a root commit.
            git diff-tree -r -z --raw --no-renames --no-commit-id "${base[@]}" "$sha" > "$raw"
            n=0
            # -z raw records are ":oldmode newmode oldsha newsha status" NUL path NUL.
            while IFS= read -r -d '' meta && IFS= read -r -d '' path; do
              read -r _ newmode _ blob status <<< "$meta"
              case "$status" in A|M|T) ;; *) continue ;; esac
              # A gitlink has no blob here. A symlink's blob is its target text, written as a regular
              # file so the scanner reads that text and never follows the link.
              case "$newmode" in 100644|100755|120000) ;; *) continue ;; esac
              case "/$path/" in
                //*|*/../*|*/./*|*/.git/*)
                  echo "::error::pushed commit $sha names an unsafe path; refusing to write it." >&2
                  exit 2
                  ;;
              esac
              # The scanner skips this path so a working-tree scan on the owner's machine does not
              # trip on the git-ignored real token list. Inside a pushed COMMIT it is committed by
              # definition, so its presence is the leak.
              if [ "$path" = "scripts/security/scan-tokens.local.txt" ]; then
                echo "::error::pushed commit $sha commits scripts/security/scan-tokens.local.txt, the real token list." >&2
                exit 1
              fi
              key="$blob $path"
              if [ -n "${seen[$key]+x}" ]; then continue; fi
              seen[$key]=1
              case "$path" in
                */*) mkdir -p "$root/${path%/*}" ;;
                *) mkdir -p "$root" ;;
              esac
              git cat-file blob "$blob" > "$root/$path"
              n=$((n + 1))
            done < "$raw"
            if [ "$n" -gt 0 ]; then
              roots+=("$root")
              files=$((files + n))
            fi
          done <<< "$commits"
          echo "branch range: ${#roots[@]} commit(s) with $files distinct added or changed file(s)."
          # ONE scan of the tip tree and every commit root. Each commit is its own root, so a path
          # detector keyed on `docs/security/` still sees the repository-relative path, and the tip
          # always has files, so the scanner's zero-files refusal cannot fire on a push whose only
          # files sit under a directory the scanner skips.
          python scripts/security/scan_forbidden.py --path . "${roots[@]}"
      - name: Say what a failure here does and does not mean
        if: failure()
        run: |
          echo "::warning::Either this branch carries forbidden content, or the scan could not run. Read"
          echo "::warning::the scan step's log: a FORBIDDEN CONTENT report or an ::error:: naming a leak means"
          echo "::warning::the content is ALREADY PUBLIC -- the push completed before this ran; this job"
          echo "::warning::detects, it cannot prevent. Any other refusal is the instrument failing, not a leak."
          echo "::warning::Respond: delete the branch, assess what was exposed, and check whether the"
          echo "::warning::pre-push guard was bypassed (--no-verify) or simply never installed"
          echo "::warning::(pwsh -NoProfile -File scripts/coord/install-git-hooks.ps1)."

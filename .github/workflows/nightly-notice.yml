name: Nightly failure notice

# A scheduled run's failure reports NOWHERE. That is the gap this closes.
#
# THE DEFECT THIS EXISTS FOR. Measured 2026-07-30: the `load test (smoke, sqlserver)` legs had been red
# for FOUR consecutive nights (2026-07-27 through 07-30) and nothing surfaced it. Across the last 14
# nightly CI runs, 5 failed. A nightly is not a PR context, so nobody sees it unless they go looking --
# and the one thing that could have carried it onto a merge path, the `CI gate` roll-up, treats a
# SKIPPED leg as a pass (correctly: those legs do not run on PRs at all).
#
# So the repo had a whole class of test -- the server-DB store, load/throughput and service-smoke legs,
# i.e. exactly what the three required `test` legs SKIP -- whose failures were invisible by
# construction. This is the same shape as the gate-liveness work (`scripts/quality/liveness.py`): a
# signal that reports into the void is not a signal.
#
# WHY `workflow_run` AND NOT A JOB INSIDE ci.yml. A job would have to `needs:` every nightly leg and
# would silently stop covering any leg added later. `workflow_run` fires on the WHOLE run's conclusion,
# so a new leg is covered the day it is added, with nothing to keep in step.
#
# SCOPE: schedule-only, deliberately. A push/PR failure is already visible on the PR itself; alerting
# there would be pure noise, and `workflow_run` fires for every CI completion regardless of trigger.
#
# ONE ISSUE PER WATCHED WORKFLOW. `Security` was added because its daily cron carries jobs
# that do not run on a PR -- `released-line-audit` most of all, whose whole subject (the LATEST
# RELEASE) no PR can change. `DAST` was added for a stronger version of the same reason (BACKLOG
# #318): it has NO `pull_request` trigger AT ALL, deliberately, so before this every DAST finding
# surfaced in the Actions tab and nowhere else -- an authenticated authorization sweep reporting into
# the void, which is precisely the shape this workflow exists to end.
#
# `Stalled PRs` was added for the same reason as DAST, after the gap stopped being hypothetical. It is
# schedule-and-dispatch only, so it can never report on a pull request, and its daily 07:05 UTC run
# FAILED THREE MORNINGS RUNNING -- 2026-09-03, 09-04 and 09-05 -- with nothing anywhere saying so. It
# reports on OTHER pull requests, so its own silence is indistinguishable from a clean sweep: a day
# with no report reads exactly like a day with nothing to report. That is a detector whose failure
# hides itself, which is one level worse than the defect it was built to catch.
#
# `Required workflow state` WAS ADDED FOR BACKLOG #1450, AND IT IS THE SAME SHAPE ONE STEP FURTHER IN.
# Both of its jobs reconcile the repository against BRANCH PROTECTION, which no in-repo test can read:
# `reachable` asks whether a required context can ever report, `accurate` asks whether
# `.github/required-contexts.txt` still matches the live required set. Neither is a required context,
# deliberately -- `accurate` reads the API, and requiring it would put every merge behind that call --
# so before this entry their 07:00 UTC cron could go red with nothing carrying it. The detector had
# already caught a real drift and reported to nobody; the missing half was alerting, never detection,
# which is why this is a watch-list entry and not a second detector. The incident is recorded once, in
# `scripts/ci/check_required_contexts_drift.py`'s docstring.
#
# THE WATCH LIST IS HAND-MAINTAINED AND HAS NO COVERAGE GUARD, WHICH IS THE NEXT DEFECT, NOT THIS ONE.
# `failure-signal.yml` solves the same problem for itself with a machine-parsed `not-watched: <file> --
# <reason>` register that `tests/test_failure_signal.py` enforces in both directions, so a workflow
# nobody thought about cannot look like one deliberately excluded. This file has only the forward half:
# `tests/test_nightly_notice.py` checks that every watched name resolves and has a cron, and nothing
# checks the reverse. Several scheduled workflows here are unwatched, and some of those carry no
# `pull_request` or `push` arm at all -- the same structural shape that justified DAST above. Some are
# deliberate non-targets; today nothing says which, and that is the gap. Neither a count nor a list of
# names is written here on purpose: both would be checked-in claims nothing re-measures, which is the
# defect this whole file exists to end. Measure it instead -- every `schedule:` trigger is
# `git grep -l "^  schedule:" .github/workflows`, and the watch list is the `workflows:` line below.
# Porting the register is a filed follow-up, unallocated.
#
# AT LEAST ONE CLAIM THIS ENTRY FALSIFIES IS LEFT STANDING ON PURPOSE. `.github/required-contexts.txt`
# still says nothing watches this cron and that giving its red a consumer is "still not done", in more
# than one sentence. The script and `docs/CI.md` were corrected alongside this entry; that register was
# not, and it is not enumerated here because an enumeration is the thing that goes quietly wrong.
# `git grep -n "still not done" .github/required-contexts.txt` is the whole census.
#
# A WATCHED WORKFLOW MUST HAVE A `schedule:` TRIGGER. The job below fires only when the completed
# run's event was `schedule`, so watching a workflow with no cron adds a name that can never match:
# dead config that reads as coverage. `tests/test_nightly_notice.py` pins this for every watched name.
#
# The issue title is DERIVED from the completed workflow's name, so a green nightly CI cannot close an
# issue opened by a red Security or DAST run: a single shared title would let one signal close
# another, which is the same silence this workflow exists to end.
#
# THE `run:` BODY BELOW IS EXECUTED BY A TEST, VERBATIM, so edit it knowing that. The `if:` gate and
# the whole script are driven under `bash -e` against a stubbed `gh` by tests/test_nightly_notice.py,
# which asserts what each (workflow, conclusion) pair actually does -- including that a green CI run
# leaves a red DAST run's issue alone. That harness runs the body UNCHANGED, which holds only while
# every input arrives through `env:` and nothing here interpolates `${{ }}` into the script.
on:
  workflow_run:
    workflows: ["CI", "Security", "DAST", "Stalled PRs", "Required workflow state"]
    types: [completed]

# Read-only by default; the one job that writes escalates to `issues: write` and nothing else.
permissions:
  contents: read

jobs:
  notice:
    name: nightly failure notice
    # ONLY scheduled runs. `github.event.workflow_run.event` is the trigger of the run that COMPLETED,
    # not of this one -- this workflow is always itself a `workflow_run`.
    if: github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Open, update, or close the nightly-failure issue
        env:
          # Hoisted, never interpolated into the script body (zizmor: template injection). A run title
          # is attacker-influenceable in the general case -- a branch name reaches it -- so none of
          # these are pasted into shell.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_STARTED: ${{ github.event.workflow_run.run_started_at }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # Derived, not hardcoded: one issue per watched workflow. A shared title would let a green
          # nightly CI close an issue a red Security run opened.
          WF_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail

          TITLE="Nightly $WF_NAME is failing"
          LABEL="bug"

          # Find an OPEN issue with this exact title. `--search` is deliberately anchored on the title
          # so a human renaming the issue starts a fresh one rather than silently detaching this
          # workflow from it -- a stale reference that opens duplicates forever is worse than a new
          # issue.
          existing="$(gh issue list --state open --label "$LABEL" --limit 50 \
                        --json number,title \
                        --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")"

          if [ "$CONCLUSION" = "success" ]; then
            # Recovered. Close it so the issue tracks CURRENT state rather than becoming a permanent
            # nag nobody reads -- an alert that is always on is the same as no alert.
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body \
                "Nightly $WF_NAME is green again as of [this run]($RUN_URL) (\`$HEAD_SHA\`). Closing."
              gh issue close "$existing"
              echo "closed #$existing — nightly recovered"
            else
              echo "nightly green, no open issue — nothing to do"
            fi
            exit 0
          fi

          # `cancelled` and `skipped` are not failures: a cancelled nightly is usually a superseded or
          # manually-stopped run, and reporting it as a break would train the reader to ignore this.
          if [ "$CONCLUSION" != "failure" ]; then
            echo "nightly concluded '$CONCLUSION' — not a failure, nothing to do"
            exit 0
          fi

          # WHAT THIS RED HIDES, FOR THE WORKFLOW THAT ACTUALLY FAILED AND NO OTHER. This used to be one
          # static paragraph naming CI, Security and DAST, sent verbatim to the reader of all five --
          # so a Stalled PRs issue explained the server-DB store legs and named nothing about itself. A
          # body that explains four workflows to the reader of one is how an alert stops being read.
          #
          # AN UNMATCHED NAME GETS NOTHING, deliberately. `*)` stays empty rather than guessing: a
          # generic sentence here would be the same defect with one more indirection, and
          # tests/test_nightly_notice.py asserts from the other side that a DAST issue carries no other
          # arm's text.
          #
          # THE ARM LABELS ARE WORKFLOW NAMES AND ARE LOAD-BEARING. `workflow_run` matches on `name:`,
          # so renaming a watched workflow detaches its arm silently -- the arm simply stops matching
          # and the issue ships with no detail. `test_every_case_arm_names_a_watched_workflow` reds on
          # that rather than letting it go quiet.
          # EACH ARM IS A WHOLE PARAGRAPH, NOT A SENTENCE FRAGMENT. An earlier draft ended the line
          # above with "Here that covers" and let each arm complete it, which reads as a truncated
          # sentence for any workflow the `case` does not match -- and `*)` matching is exactly the
          # state a sixth watch-list entry starts in. An empty DETAIL must degrade to a blank line.
          DETAIL=""
          case "$WF_NAME" in
            "CI")
              DETAIL="Here that covers the server-DB store, load/throughput and service-smoke legs
          that the three required \`test\` legs skip."
              ;;
            "Security")
              DETAIL="Here that covers the daily dependency audits and the released-line audit, whose
          subject is a published release that no pull request can change. It also covers the
          container-image scan (\`trivy\`), which reds only when the scan produced no verdict; a
          vulnerability it finds stays green and is listed in that job's summary."
              ;;
            "DAST")
              DETAIL="Here that covers the entire workflow, which carries no \`pull_request\` trigger
          by design."
              ;;
            "Stalled PRs")
              DETAIL="Here that covers the daily sweep for pull requests that went green and can no
          longer merge. A day with no report reads exactly like a day with nothing to report, so a red
          here means the sweep itself did not run."
              ;;
            "Required workflow state")
              # BOTH JOBS, because this fires on the RUN's conclusion and cannot tell them apart.
              # Naming only the drift half would hand a red \`reachable\` a remedy that does not fix it
              # and forbid the one that would -- the misdirection this workflow exists to avoid.
              DETAIL="Here that covers one of two branch-protection reconciles, which read a server
          setting no in-repo test can see. READ THE FAILING JOB; the remedies are different and only
          one of them is a repository edit.

          - \`the required-contexts file matches the server\` failed: the checked-in
            \`.github/required-contexts.txt\` no longer matches branch protection. Mirror the SERVER
            into that file and the prose it names. Do NOT edit branch protection to match the file --
            that is the owner's decision, and a required context that never reports wedges every pull
            request in the repository rather than failing one.
          - \`required contexts belong to active workflows\` failed: a required context's workflow
            cannot report at all -- typically disabled on the server, renamed, or deleted. No edit to
            the register fixes that. Re-enable or restore the workflow, or ask the owner to drop the
            context; both halves are owner decisions."
              ;;
          esac

          BODY="Nightly (scheduled) $WF_NAME failed.

          - run: $RUN_URL
          - commit: \`$HEAD_SHA\`
          - started: $RUN_STARTED

          A scheduled run is not a PR context, so this failure appears nowhere else.
          $DETAIL

          This issue is opened once and commented on each subsequent failure; it closes itself when a
          nightly goes green again."

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$BODY"
            echo "commented on #$existing"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
            echo "opened a new issue"
          fi

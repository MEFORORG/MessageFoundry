name: Dependabot lock resync

# Re-exports the SEVEN committed "uv export" artifacts (requirements.lock +
# docker/locks/requirements-core.lock + docker/locks/requirements-sqlserver.lock + the HASHLESS
# constraints.lock + the three PEP 735 dependency-group locks ci/locks/ci-scanners.lock,
# ci/locks/ci-quality.lock and ci/locks/release-tools.lock) on a Dependabot PR that touched uv.lock /
# pyproject.toml, and commits them back to the PR branch so the DEP-1 drift gate (security.yml ->
# pip-audit job, step "Check the lockfile is in sync with pyproject (DEP-1)") goes green WITHOUT a human
# re-export.
#
# WHY: the native "uv" Dependabot ecosystem regenerates uv.lock + pyproject.toml in its PR, but NOT
# the exported lock artifacts. The DEP-1 gate re-runs "uv lock --check" + all six "uv export"s and
# "git diff --exit-code"s the result, so a Dependabot uv PR would otherwise leave the exports stale
# and red the gate. This workflow runs the IDENTICAL commands and pushes the refreshed exports onto
# the Dependabot branch.
#
# The three ci/locks/*.lock artifacts are what makes the CI and release-signing toolchains hash-pinned
# rather than merely version-pinned (ADR 0034 §3). They are ALSO what keeps them fresh: a hash-pinned
# toolchain outside this resync machinery would rot into a pinned, stale, unpatched toolchain — worse
# posture than floating.
#
# KEEP THIS LIST IN LOCKSTEP WITH security.yml's DEP-1 step. A file the gate diffs but this job does
# not re-export is un-fixable by the bot: the resync pushes an incomplete set, DEP-1 re-exports the
# full set, finds the missing one stale, and the PR stays red with no human-free path to green.
# (That is exactly what happened to constraints.lock between #1193 and this commit.)
#
# SECURITY MODEL (read before editing):
#  - Trigger is "pull_request" (NOT pull_request_target). A Dependabot-triggered "pull_request" run is
#    sandboxed like a fork PR: GITHUB_TOKEN is READ-ONLY (the permissions block cannot elevate it) and
#    ONLY Dependabot secrets are readable — never the full Actions secret store. The writable
#    capability is a self-minted, narrowly-scoped (contents:write), ~1h GitHub App token.
#  - Author gate is the IMMUTABLE github.event.pull_request.user.login == 'dependabot[bot]', not the
#    spoofable github.actor — a third party injecting commits into a Dependabot PR cannot make it run.
#  - NO project install/tests/build runs here, and "uv lock --check" (validate-only, never builds an
#    sdist) + "uv export" (serializes the existing lock) execute NO package code — so no
#    attacker-controlled build backend ever runs while the token is on the runner.

on:
  pull_request:
    paths:
      - "uv.lock"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: dependabot-lock-resync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resync:
    name: Re-export lock files and push to the PR branch
    runs-on: ubuntu-latest
    # TWO conditions, both required. This is a conjunction — it only ever NARROWS who can run the job.
    #
    #  1. pull_request.user.login — the IMMUTABLE PR author. A third party pushing commits into a
    #     Dependabot PR still cannot make this job run. (Unchanged; see SECURITY MODEL above.)
    #
    #  2. github.triggering_actor — who caused THIS run. Dependabot secrets are exposed only when the
    #     run is triggered by dependabot[bot]. When this job pushes the resynced locks, that push
    #     fires a `synchronize` event whose triggering actor is the App (mefor-lock-resync[bot]); the
    #     follow-up run therefore sees NO Dependabot secrets, `create-github-app-token` gets an empty
    #     client-id, and the job dies — a phantom red on a PR whose resync had already SUCCEEDED
    #     seconds earlier. Observed on #801:
    #         00:04:30  triggering_actor=dependabot[bot]        -> success, pushed the resync commit
    #         00:04:48  triggering_actor=mefor-lock-resync[bot] -> failure, "client-id ... is required"
    #     Skipping the self-triggered re-run is correct: the work is already done.
    #
    #     (This line used to end "the secrets are configured correctly ... nothing to add". True of the
    #     PRIVATE repo, and it did NOT survive the cutover: MEFORORG carried only MEFOR_FORBIDDEN_TOKENS,
    #     so the App credentials were absent and this job would have skipped on every Dependabot uv PR
    #     while the comment asserted it was configured. LOCK_RESYNC_APP_ID + LOCK_RESYNC_APP_PRIVATE_KEY
    #     were added to MEFORORG > Secrets > Dependabot on 2026-07-27. State a configuration fact WITH
    #     the repository it applies to, or a migration turns it into a confident lie.)
    if: >-
      ${{ github.event.pull_request.user.login == 'dependabot[bot]'
      && github.triggering_actor == 'dependabot[bot]' }}
    timeout-minutes: 10
    steps:
      # Belt and braces. With the triggering_actor gate above, a run that reaches this step IS
      # Dependabot-triggered, so the Dependabot secrets should be visible. If they are not, that is a
      # genuine misconfiguration (the App was removed, or the secrets were added under *Actions*
      # secrets rather than *Dependabot* secrets) — say so precisely rather than dying on an opaque
      # "client-id is required". Skipping stays SAFE: DEP-1 lock/export sync is independently enforced
      # by the `pip-audit` job in security.yml, which fails a genuinely stale lock.
      - name: Are the App credentials visible to this run?
        id: creds
        env:
          APP_ID: ${{ secrets.LOCK_RESYNC_APP_ID }}
        run: |
          set -euo pipefail
          if [ -n "${APP_ID:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=lock-resync skipped (misconfiguration)::This run WAS triggered by dependabot[bot], yet LOCK_RESYNC_APP_ID is empty. The App credentials must live under Settings > Secrets and variables > *Dependabot* (not Actions) for a Dependabot-triggered run to read them. Skipping the re-export; DEP-1 lock sync is still enforced by the pip-audit job in security.yml."
          fi

      - name: Mint a scoped GitHub App token
        id: app-token
        if: steps.creds.outputs.present == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.LOCK_RESYNC_APP_ID }}
          private-key: ${{ secrets.LOCK_RESYNC_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out the PR head
        if: steps.creds.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref }}
          # The App token is persisted as the git credential so the push below uses it WITHOUT the
          # token ever appearing in a command line / process table. Safe because no untrusted package
          # code runs in this job (uv lock --check + uv export only).

      - name: Set up uv
        if: steps.creds.outputs.present == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Re-export the lock files (DEP-1 — byte-for-byte identical flags/paths)
        if: steps.creds.outputs.present == 'true'
        run: |
          set -euo pipefail
          # Mirror the DEP-1 gate (security.yml, pip-audit job) EXACTLY. "--check" validates the
          # Dependabot-produced uv.lock WITHOUT building any sdist (no arbitrary build-backend code);
          # a genuinely-stale lock fails here loudly (the same red the gate would raise), rather than
          # silently re-locking. "uv export" then serializes the validated lock (runs no package code).
          uv lock --check
          uv export --all-extras --no-emit-project --format requirements.txt -o requirements.lock
          uv export --no-emit-project --no-dev --format requirements.txt -o docker/locks/requirements-core.lock
          uv export --no-emit-project --no-dev --extra sqlserver --format requirements.txt -o docker/locks/requirements-sqlserver.lock
          # The hashless constraint export every CI install pins against (`--constraint constraints.lock`,
          # ci.yml). Same lock, --no-hashes; omitted here it would stay stale and red DEP-1 forever.
          uv export --all-extras --no-emit-project --no-hashes --format requirements.txt -o constraints.lock
          # The CI TOOLCHAIN locks (PEP 735 dependency groups, ADR 0034 §3). Same lockstep rule as the
          # four above: the gate diffs them, so the bot must re-export them or the PR has no path green.
          uv export --only-group ci-scanners --format requirements.txt -o ci/locks/ci-scanners.lock
          uv export --only-group ci-quality --format requirements.txt -o ci/locks/ci-quality.lock
          uv export --only-group release-tools --format requirements.txt -o ci/locks/release-tools.lock

      - name: Commit and push the resynced locks
        if: steps.creds.outputs.present == 'true'
        env:
          # Pass the PR head ref through the environment, NOT inline ${{ }} in the run block, so a branch
          # name containing shell metacharacters can never be evaluated as code (template injection).
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'dependabot[bot]'
          git config user.email '49699333+dependabot[bot]@users.noreply.github.com'
          if git diff --quiet -- requirements.lock docker/locks/requirements-core.lock docker/locks/requirements-sqlserver.lock constraints.lock ci/locks/ci-scanners.lock ci/locks/ci-quality.lock ci/locks/release-tools.lock; then
            echo 'Exported lock files already in sync; nothing to push.'
            exit 0
          fi
          git add requirements.lock docker/locks/requirements-core.lock docker/locks/requirements-sqlserver.lock constraints.lock ci/locks/ci-scanners.lock ci/locks/ci-quality.lock ci/locks/release-tools.lock
          git commit -m 'chore(deps): resync exported lock files (DEP-1)'
          # Push with the persisted App-token credential (NOT GITHUB_TOKEN). An App-token push emits a
          # synchronize event so the required checks (DEP-1, ci.yml) re-run on the new commit; a
          # GITHUB_TOKEN push would leave them pending and the PR unmergeable.
          git push origin "HEAD:${HEAD_REF}"

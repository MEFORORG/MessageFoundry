name: Dependabot lock resync

# Re-exports the committed "uv export" artifacts (requirements.lock +
# docker/locks/requirements-core.lock + docker/locks/requirements-sqlserver.lock +
# docker/locks/requirements-postgres.lock + security/locks/requirements-harness.lock + the HASHLESS
# constraints.lock + the two PEP 735 CI-toolchain locks ci/locks/ci-scanners.lock and
# ci/locks/ci-quality.lock, and the release-signing lock ci/locks/release-tools.lock) on a Dependabot PR that touched uv.lock / pyproject.toml, and commits them
# back to the PR branch so the DEP-1 drift gate (security.yml -> pip-audit job, step "Check the
# lockfile is in sync with pyproject (DEP-1)") goes green WITHOUT a human re-export.
#
# WHY: the native "uv" Dependabot ecosystem regenerates uv.lock + pyproject.toml in its PR, but NOT
# the exported lock artifacts. The DEP-1 gate re-runs "uv lock --check" + every "uv export" and
# "git diff --exit-code"s the result, so a Dependabot uv PR would otherwise leave the exports stale
# and red the gate. This workflow runs the IDENTICAL commands and pushes the refreshed exports onto
# the Dependabot branch.
#
# The two ci/locks/*.lock artifacts are what makes the CI toolchain hash-pinned rather than merely
# version-pinned (ADR 0034 §3). They are ALSO what keeps it fresh: a hash-pinned toolchain outside this
# resync machinery would rot into a pinned, stale, unpatched toolchain — worse posture than floating.
#
# KEEP THIS LIST IN LOCKSTEP WITH security.yml's DEP-1 step. A file the gate diffs but this job does
# not re-export is un-fixable by the bot: the resync pushes an incomplete set, DEP-1 re-exports the
# full set, finds the missing one stale, and the PR stays red with no human-free path to green.
# (That is exactly what happened to constraints.lock between #1193 and this commit.)
#
# SECURITY MODEL (read before editing):
#  - Trigger is "pull_request" (NOT pull_request_target). A Dependabot-triggered "pull_request" run is
#    sandboxed like a fork PR: GITHUB_TOKEN is READ-ONLY (the permissions block cannot elevate it) and
#    ONLY Dependabot secrets are readable — never the full Actions secret store. The writable
#    capability is a self-minted, narrowly-scoped (contents:write), ~1h GitHub App token.
#  - Author gate is the IMMUTABLE github.event.pull_request.user.login == 'dependabot[bot]', not the
#    spoofable github.actor — a third party injecting commits into a Dependabot PR cannot make it run.
#  - THREE JOBS, SPLIT BY WHAT THEY HOLD (BACKLOG #5477). `preflight` reads the App id to decide
#    whether to run at all. `export` runs uv and the repository script on the Dependabot-changed tree
#    and references NO secret: not the App id, not the App key, not a minted token, so no step of it
#    is handed one. (Whether the service ever delivers an unreferenced secret to a job's runner is
#    not measured here.) It hands its output to `push` as an artifact. `push` mints the App token
#    and pushes, and runs no code from the Dependabot-changed tree: it checks the tree out as data,
#    stages the artifact's files by content into git's index at a fixed list of paths, writing
#    nothing through the checkout's filesystem, and commits and pushes. Every step of `push` and of
#    `preflight` is pinned by content hash in tests/test_dep1_lock_resync_lockstep.py, so any edit to
#    one turns that test red until a reviewer re-pins it; the same file also screens their run
#    blocks against a command allowlist, a best-effort check whose known gaps it lists. Each job is
#    its own GitHub-hosted runner, so nothing `export` writes to $GITHUB_ENV, $GITHUB_PATH,
#    BASH_ENV, .git/config or its filesystem reaches `push`. What does cross is untrusted, and at least this: the artifact (its entry names and file
#    contents, which the staging step checks), the `closure` job output (read only in an `if:`), and
#    whether `export` succeeded (which gates `push`). The read-only GITHUB_TOKEN is in the export and
#    push jobs; preflight's carries no permission.
#  - NO project install/tests/build runs here, and "uv lock --check" (validate-only, never builds an
#    sdist) + "uv export" (serializes the existing lock) execute NO package code.
#  - ONE repository script runs: scripts/security/runtime_closure.py (BACKLOG #1812, #1955), in the
#    secretless `export` job, under the runner's own python3 with nothing installed. It is standard-
#    library only (import names checked by tests/test_dep1_lock_resync_lockstep.py; its gaps are listed
#    there), reads eight files, writes at most four. The checkout pins the SHA that triggered the run,
#    and a "pull_request" run takes THIS workflow's definition from that same PR, so anyone able to
#    change the script could already change the steps around it.

on:
  pull_request:
    paths:
      - "uv.lock"
      - "pyproject.toml"
      # Dependabot's security track may still write here (see the regenerate step below).
      - "security/runtime-closure-*.txt"

permissions:
  contents: read

concurrency:
  group: dependabot-lock-resync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Check the lock-resync App credentials
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      present: ${{ steps.creds.outputs.present }}
    # TWO conditions, both required. This is a conjunction — it only ever NARROWS who can run the job.
    # The `export` and `push` jobs need this one, so when it skips they skip too.
    #
    #  1. pull_request.user.login — the IMMUTABLE PR author. A third party pushing commits into a
    #     Dependabot PR still cannot make this job run. (Unchanged; see SECURITY MODEL above.)
    #
    #  2. github.triggering_actor — who caused THIS run. Dependabot secrets are exposed only when the
    #     run is triggered by dependabot[bot]. When the push job pushes the resynced locks, that push
    #     fires a `synchronize` event whose triggering actor is the App (mefor-lock-resync[bot]); the
    #     follow-up run therefore sees NO Dependabot secrets. Before the job split, this was one job,
    #     whose `create-github-app-token` then got an empty client-id and died — a phantom red on a PR
    #     whose resync had already SUCCEEDED seconds earlier. Observed on #801:
    #         00:04:30  triggering_actor=dependabot[bot]        -> success, pushed the resync commit
    #         00:04:48  triggering_actor=mefor-lock-resync[bot] -> failure, "client-id ... is required"
    #     Skipping the self-triggered re-run is correct: the work is already done.
    #     This clause is evaluated only here. A manual re-run of the export or push job alone reuses
    #     this job's earlier result, so it is not re-checked for that re-run.
    #
    #     (This line used to end "the secrets are configured correctly ... nothing to add". True of the
    #     PRIVATE repo, and it did NOT survive the cutover: MEFORORG carried only MEFOR_FORBIDDEN_TOKENS,
    #     so the App credentials were absent and this job would have skipped on every Dependabot uv PR
    #     while the comment asserted it was configured. LOCK_RESYNC_APP_ID + LOCK_RESYNC_APP_PRIVATE_KEY
    #     were added to MEFORORG > Secrets > Dependabot on 2026-07-27. State a configuration fact WITH
    #     the repository it applies to, or a migration turns it into a confident lie.)
    if: >-
      ${{ github.event.pull_request.user.login == 'dependabot[bot]'
      && github.triggering_actor == 'dependabot[bot]' }}
    timeout-minutes: 5
    steps:
      # Belt and braces. With the triggering_actor gate above, a run that reaches this step IS
      # Dependabot-triggered, so the Dependabot secrets should be visible. If they are not, that is a
      # genuine misconfiguration (the App was removed, or the secrets were added under *Actions*
      # secrets rather than *Dependabot* secrets) — say so precisely rather than dying on an opaque
      # "client-id is required". Skipping stays SAFE: DEP-1 lock/export sync is independently enforced
      # by the `pip-audit` job in security.yml, which fails a genuinely stale lock.
      - name: Are the App credentials visible to this run?
        id: creds
        env:
          APP_ID: ${{ secrets.LOCK_RESYNC_APP_ID }}
        run: |
          set -euo pipefail
          if [ -n "${APP_ID:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=lock-resync skipped (misconfiguration)::This run WAS triggered by dependabot[bot], yet LOCK_RESYNC_APP_ID is empty. The App credentials must live under Settings > Secrets and variables > *Dependabot* (not Actions) for a Dependabot-triggered run to read them. Skipping the re-export; DEP-1 lock sync is still enforced by the pip-audit job in security.yml."
          fi

  export:
    # NO SECRET IN THIS JOB (BACKLOG #5477). It runs uv and a repository script on the Dependabot-
    # changed tree, so it references no secret and no minted token. It hands its files to the push
    # job only as the artifact below; its `closure` output and its result also cross (see the
    # SECURITY MODEL). tests/test_dep1_lock_resync_lockstep.py holds that.
    name: Re-export lock files (no secrets)
    needs: preflight
    if: >-
      ${{ needs.preflight.outputs.present == 'true'
      && github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      closure: ${{ steps.closure.outcome }}
    steps:
      - name: Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The SHA that triggered this run, not the branch tip. The regenerate step runs a script from
          # this checkout, so a commit pushed to the branch after the trigger must not be what runs. If
          # the branch has moved, the push job's push is refused as non-fast-forward (BACKLOG #1812).
          ref: ${{ github.event.pull_request.head.sha }}
          # NO CREDENTIAL IN THE CHECKOUT (BACKLOG #5477). The fetch uses the run's read-only token,
          # and nothing is persisted into .git/config.
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # PINNED to the uv security.yml's DEP-1 step installs (`uv==` there), because this job must
          # produce the bytes that step diffs, and setup-uv otherwise installs whatever is latest.
          # tests/test_dep1_lock_resync_lockstep.py holds the two equal; bump them in one commit.
          version: "0.12.0"

      - name: Re-export the lock files (DEP-1 — byte-for-byte identical flags/paths)
        # uv reads no PIP_* variable, so this is what keeps the check and the exports from building an
        # sdist, as the SECURITY MODEL above requires (vault BACKLOG #4083 finding 5).
        env:
          UV_NO_BUILD: "1"
        run: |
          set -euo pipefail
          # Mirror the DEP-1 gate (security.yml, pip-audit job) EXACTLY. "--check" validates the
          # Dependabot-produced uv.lock WITHOUT building any sdist (no arbitrary build-backend code);
          # a genuinely-stale lock fails here loudly (the same red the gate would raise), rather than
          # silently re-locking. "uv export" then serializes the validated lock (runs no package code).
          uv lock --check
          uv export --all-extras --no-emit-project --format requirements.txt -o requirements.lock
          uv export --no-emit-project --no-dev --format requirements.txt -o docker/locks/requirements-core.lock
          uv export --no-emit-project --no-dev --extra sqlserver --format requirements.txt -o docker/locks/requirements-sqlserver.lock
          uv export --no-emit-project --no-dev --extra postgres --format requirements.txt -o docker/locks/requirements-postgres.lock
          # Not an image lock: the harness closure (security/runtime-closure-harness.txt) copies it.
          uv export --no-emit-project --no-dev --extra harness --format requirements.txt -o security/locks/requirements-harness.lock
          # The hashless constraint export every CI install pins against (`--constraint constraints.lock`,
          # ci.yml). Same lock, --no-hashes; omitted here it would stay stale and red DEP-1 forever.
          uv export --all-extras --no-emit-project --no-hashes --format requirements.txt -o constraints.lock
          # The CI TOOLCHAIN locks (PEP 735 dependency groups, ADR 0034 §3). Same lockstep rule as the
          # exports above: the gate diffs them, so the bot must re-export them or the PR has no path green.
          uv export --only-group ci-scanners --format requirements.txt -o ci/locks/ci-scanners.lock
          uv export --only-group ci-quality --format requirements.txt -o ci/locks/ci-quality.lock
          uv export --only-group release-tools --format requirements.txt -o ci/locks/release-tools.lock

      # security/runtime-closure-core.txt is the risky-component inventory's denominator, a copy of the
      # core lock's pins, and tests/test_risky_component_designation.py fails when the two differ
      # (BACKLOG #1812). security/runtime-closure-sqlserver.txt is the same copy of the sqlserver lock
      # (BACKLOG #1955), security/runtime-closure-postgres.txt the same copy of the postgres lock
      # (BACKLOG #5933), and security/runtime-closure-harness.txt the same copy of the harness lock.
      # The script, run with no arguments, rewrites all four. A PR that moves a core, sqlserver,
      # postgres or harness package would otherwise be red with no bot-reachable path to green.
      # dependabot.yml's exclude-paths keeps the version track from editing any of them; the security
      # track may ignore that key, so this rewrite is what actually holds each file to its lock.
      #
      # It runs after the exports, so it copies the fresh locks. It may FAIL: a per-platform fork in
      # any lock, which needs a human, or a PR head from before the script existed. Either way the
      # re-exported locks must still be pushed, so a failure here does not fail this job. The push
      # job's last step reads this step's outcome through the `closure` output and marks THE RUN red,
      # unless the run its own push fires cancels this one first (the concurrency group above).
      # That red sits on the pre-push commit; on the new head, the signal is the closure test failing
      # in the required test legs.
      - name: Regenerate the runtime-closure inventories from the core, sqlserver, postgres and harness locks
        id: closure
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/security/runtime_closure.py

      # The same paths the push job stages and checks with `git diff --cached --quiet`. A file missing
      # here makes the push job's staging step fail rather than push an incomplete set.
      - name: Hand the re-exported files to the push job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lock-resync-exports
          retention-days: 1
          if-no-files-found: error
          # A re-run of this job replaces its own earlier upload rather than failing on the name.
          overwrite: true
          path: |
            requirements.lock
            docker/locks/requirements-core.lock
            docker/locks/requirements-sqlserver.lock
            docker/locks/requirements-postgres.lock
            security/locks/requirements-harness.lock
            constraints.lock
            ci/locks/ci-scanners.lock
            ci/locks/ci-quality.lock
            ci/locks/release-tools.lock
            security/runtime-closure-core.txt
            security/runtime-closure-sqlserver.txt
            security/runtime-closure-postgres.txt
            security/runtime-closure-harness.txt

  push:
    # THE ONLY JOB THAT HOLDS THE APP KEY OR TOKEN (BACKLOG #5477), and it runs no code from the
    # Dependabot-changed tree: no uv, no interpreter, no repository script. Its steps are three
    # actions (checkout, download-artifact, create-github-app-token) and four run blocks, over a
    # checkout read as data and the files the export job handed over. What holds that is
    # tests/test_dep1_lock_resync_lockstep.py: it pins every step of this job, each by a hash of its
    # whole content (run, env, if, with and every other key), so an edit is red until re-pinned
    # after review. It also screens the run blocks against a command allowlist (git with a fixed set
    # of subcommands, find without -exec/-ok/-delete, realpath, base64 and shell builtins), which is
    # best-effort: the test names the shell forms it does not parse. A fresh runner, so nothing the
    # export job planted in its own environment or git config is here.
    name: Push the re-exported lock files to the PR branch
    needs: [preflight, export]
    if: >-
      ${{ needs.preflight.outputs.present == 'true'
      && github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The same SHA the export job re-exported from. If the branch has moved, the push below is
          # refused as non-fast-forward (BACKLOG #1812).
          ref: ${{ github.event.pull_request.head.sha }}
          # NO CREDENTIAL IN THE CHECKOUT (BACKLOG #5477): the run's read-only token fetches, nothing
          # is persisted into .git/config, and the App token goes to the push command alone.
          persist-credentials: false

      - name: Fetch the re-exported files from the export job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lock-resync-exports
          path: ${{ runner.temp }}/lock-resync-exports

      # The artifact was written by a job that ran code from the Dependabot-changed tree, so it is
      # untrusted data. Only the fixed list below is staged, and only from regular files. Each file
      # goes into git's object store and index by content (hash-object, then update-index), so
      # nothing is written through a path in the checkout: a lock path the tree made a symlink, a
      # directory (even one holding a same-named symlink), or a path under a symlinked directory
      # cannot redirect a write outside it. Such a path is refused all the same, and git itself
      # refuses an index entry that collides with a tracked directory or symlink. Any other file in
      # the artifact fails the step, and so does a failed listing of it.
      - name: Stage the re-exported files by content
        run: |
          set -euo pipefail
          # The same hooks and fsmonitor lockout the commit step sets, for the git commands here.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0='core.hooksPath' GIT_CONFIG_VALUE_0='/dev/null'
          export GIT_CONFIG_KEY_1='core.fsmonitor' GIT_CONFIG_VALUE_1='false'
          src="${RUNNER_TEMP}/lock-resync-exports"
          files='requirements.lock docker/locks/requirements-core.lock docker/locks/requirements-sqlserver.lock docker/locks/requirements-postgres.lock security/locks/requirements-harness.lock constraints.lock ci/locks/ci-scanners.lock ci/locks/ci-quality.lock ci/locks/release-tools.lock security/runtime-closure-core.txt security/runtime-closure-sqlserver.txt security/runtime-closure-postgres.txt security/runtime-closure-harness.txt'
          entries="${RUNNER_TEMP}/lock-resync-entries"
          # A plain redirect, not a process substitution, so a failing find fails the step.
          find "${src}" -mindepth 1 ! -type d -print0 > "${entries}"
          while IFS= read -r -d '' found; do
            rel="${found#"${src}"/}"
            known=''
            for want in ${files}; do
              if [ "${want}" = "${rel}" ]; then known=1; fi
            done
            if [ -z "${known}" ]; then
              echo "::error title=lock-resync artifact::unexpected entry in the artifact: ${rel}"
              exit 1
            fi
          done < "${entries}"
          root="$(pwd -P)"
          for rel in ${files}; do
            if [ ! -f "${src}/${rel}" ] || [ -L "${src}/${rel}" ]; then
              echo "::error title=lock-resync artifact::${rel} is missing from the artifact or is not a regular file"
              exit 1
            fi
            if [ -L "${rel}" ] || { [ -e "${rel}" ] && [ ! -f "${rel}" ]; } || [ "$(realpath -m -- "${rel}")" != "${root}/${rel}" ]; then
              echo "::error title=lock-resync checkout::${rel} is not a regular file inside the checkout"
              exit 1
            fi
            # --no-filters: no .gitattributes filter or eol rule from the tree touches the bytes.
            oid="$(git hash-object -w --no-filters -- "${src}/${rel}")"
            git update-index --add --cacheinfo "100644,${oid},${rel}"
          done

      # MINTED LAST, directly before the one step that uses it, so the token does not exist while the
      # untrusted artifact is fetched and staged, and a refused artifact mints nothing. No step of this
      # job runs code from the Dependabot-changed tree. create-github-app-token's post step revokes
      # the token at job end. The token is handed to the push step alone and written to no .git/config.
      - name: Mint a scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.LOCK_RESYNC_APP_ID }}
          private-key: ${{ secrets.LOCK_RESYNC_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit and push the resynced locks
        env:
          # Pass the PR head ref through the environment, NOT inline ${{ }} in the run block, so a branch
          # name containing shell metacharacters can never be evaluated as code (template injection).
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # The only step that reads the App token (BACKLOG #5477).
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Hooks and core.fsmonitor are turned off for every git command below, through git's
          # environment config, which outranks .git/config. No step of this job runs code from the
          # Dependabot-changed tree, so nothing should have written either; this stays as a second
          # layer over that job split.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0='core.hooksPath' GIT_CONFIG_VALUE_0='/dev/null'
          export GIT_CONFIG_KEY_1='core.fsmonitor' GIT_CONFIG_VALUE_1='false'
          git config user.name 'dependabot[bot]'
          git config user.email '49699333+dependabot[bot]@users.noreply.github.com'
          if git diff --cached --quiet -- requirements.lock docker/locks/requirements-core.lock docker/locks/requirements-sqlserver.lock docker/locks/requirements-postgres.lock security/locks/requirements-harness.lock constraints.lock ci/locks/ci-scanners.lock ci/locks/ci-quality.lock ci/locks/release-tools.lock security/runtime-closure-core.txt security/runtime-closure-sqlserver.txt security/runtime-closure-postgres.txt security/runtime-closure-harness.txt; then
            echo 'Exported lock files and the closure files already in sync; nothing to push.'
            exit 0
          fi
          # No `git add`: the staging step already put each file in the index by content, and
          # the working tree still holds the PR head's bytes, so adding from it would undo that.
          git commit -m 'chore(deps): resync exported lock files (DEP-1)'
          # Push with the App token (NOT GITHUB_TOKEN). An App-token push emits a synchronize event so
          # the required checks (DEP-1, ci.yml) re-run on the new commit; a GITHUB_TOKEN push would
          # leave them pending and the PR unmergeable.
          # The credential goes in as an http.extraheader through a third GIT_CONFIG_* entry, set
          # on the push command alone, and is never written to .git/config. printf is a shell builtin
          # and base64 reads stdin, so the token is in no command's argv. It IS in this step's
          # environment (APP_TOKEN, and the encoded header in git's), which any process running as the
          # runner user can read while the step runs; the step-level env keeps it out of every other
          # step's environment, not out of reach of the user. The whole encoded header is masked too,
          # by hand, so its masking does not rest on which encoded forms of the token the runner's own
          # secret masker happens to register.
          auth="$(printf 'x-access-token:%s' "${APP_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          # Fully qualified: the checkout is a detached SHA, so HEAD has no branch to infer a name from.
          GIT_CONFIG_COUNT=3 \
          GIT_CONFIG_KEY_2='http.https://github.com/.extraheader' \
          GIT_CONFIG_VALUE_2="AUTHORIZATION: basic ${auth}" \
            git push origin "HEAD:refs/heads/${HEAD_REF}"

      # The export job's closure step may fail without failing that job, so the locks are still
      # pushed. Its outcome arrives here as a job output and is read only in this `if:`, never in a
      # shell, because the export job ran code from the Dependabot-changed tree.
      - name: Fail if the closure inventory could not be regenerated
        if: needs.export.outputs.closure == 'failure'
        run: |
          echo "::error title=runtime-closure regeneration failed::scripts/security/runtime_closure.py failed; its log is in the export job. Any re-exported locks were still pushed, but the security/runtime-closure-*.txt files were not regenerated, so tests/test_risky_component_designation.py will fail on this PR until someone fixes it."
          exit 1

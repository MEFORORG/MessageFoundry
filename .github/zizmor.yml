# zizmor configuration — https://docs.zizmor.sh/configuration/
#
# Each entry below is a REVIEWED, justified non-finding for this repo. Real fixes live in the workflow
# files themselves (least-privilege permissions, env-passed refs, persist-credentials: false); this file
# is only for findings that are safe-by-design here. Keep it small and commented — a suppression without
# a reason is a latent vulnerability.
rules:
  dangerous-triggers:
    ignore:
      # A CLA assistant REQUIRES pull_request_target to record signatures + comment on fork PRs. This
      # workflow never checks out untrusted PR code, pins the third-party action by SHA, and gates on the
      # immutable comment body / event name — so the usual pull_request_target risk (running attacker
      # code with a write token) does not apply. The action is pinned at ca4a40a7d100 (v2.6.1); its
      # archived-upstream status is adjudicated under archived-uses below.
      - cla.yml
      # A notice that a SCHEDULED run failed can only be written by something observing that run AFTER
      # it finishes — no other trigger sees another workflow's conclusion, so `workflow_run` is not a
      # convenience here, it is the only mechanism.
      #
      # zizmor's objection to `workflow_run` is the "pwn request" class: it runs from the DEFAULT BRANCH
      # with a privileged token, so checking out and executing the triggering PR's code would escalate
      # that PR into a write token. Every precondition for that is absent, and each is pinned by
      # tests/test_nightly_notice.py rather than merely asserted here:
      #   * NO checkout, and no third-party actions at all — `test_it_pulls_in_no_third_party_actions`
      #     fails if a `uses:` ever appears. Nothing from the triggering ref is fetched, let alone run.
      #     That is a STRONGER claim than cla.yml's above: cla.yml runs a third-party action with a
      #     write token — SHA-pinned, so it cannot change under us, but still third-party code —
      #     whereas this job runs no third-party code at all.
      #   * It only reacts to `workflow_run.event == 'schedule'`
      #     (`test_it_only_reacts_to_scheduled_runs`), so a PR — including a fork PR — has no path to
      #     the job at all.
      #   * Least privilege: file default `contents: read`, `issues: write` on the single job
      #     (`test_it_is_least_privilege`). It cannot push, tag, or modify code.
      #   * Every event value is hoisted to `env`, never interpolated into the script body, so an
      #     attacker-influenceable field (a branch name reaching a run title) cannot break out.
      # The most its token can do is open, comment on, or close one issue.
      - nightly-notice.yml
      # A red check can only be observed by something that runs AFTER the failing workflow finishes,
      # and the checks this watches live in four separate workflows. No other trigger sees another
      # workflow's conclusion, so `workflow_run` is the mechanism here rather than a convenience --
      # the same argument as nightly-notice.yml above.
      #
      # zizmor's objection is the "pwn request" class: `workflow_run` runs from the DEFAULT BRANCH
      # with a privileged token, so a workflow that checks out and EXECUTES the triggering pull
      # request's code hands any fork pull request a write token. Every precondition for that is
      # absent, and each is pinned by tests/test_failure_signal.py rather than merely asserted here:
      #   * NO checkout, and no `uses:` at all -- `test_it_pulls_in_no_third_party_actions` fails the
      #     moment one appears. Nothing from the triggering ref is fetched, let alone run.
      #   * Least privilege: file default `contents: read`; the single job takes `pull-requests:
      #     write` and `issues: write` (`test_it_is_least_privilege_and_cannot_modify_code`). It
      #     cannot push, tag, or modify code. The most its token does is add a label to a pull
      #     request or comment on an issue.
      #   * Every `github.event` value reaches a script through `env` and is never interpolated into
      #     a `run:` body (`test_every_event_value_reaches_a_script_through_env`), so a branch name
      #     chosen by an attacker cannot break out of the shell it lands in.
      #   * The one attacker-influenceable field it reads, `head_branch`, is parsed ONLY to recover a
      #     pull-request number from a merge-queue ref, and only when the triggering run's event was
      #     `merge_group` -- which a fork pull request cannot produce
      #     (`test_the_merge_queue_parse_is_gated_on_an_event_a_fork_cannot_produce`).
      #
      # ONE DIFFERENCE FROM nightly-notice.yml, AND IT IS STATED RATHER THAN GLOSSED. That workflow
      # gates on `workflow_run.event == 'schedule'`, so no pull request reaches it at all -- its fork
      # path is CLOSED. This one MUST react to pull-request runs, because labelling the pull request
      # is the entire point, so its fork path is OPEN. The four properties above are what bound the
      # cost of that: nothing from the head is fetched or executed, and the token cannot touch code.
      # This entry is therefore a WEAKER claim than the one above it, and a reader comparing the two
      # should see that rather than infer symmetry.
      #
      # EXPECT THIS RATHER THAN BE SURPRISED BY IT: GitHub leaves `workflow_run.pull_requests` empty
      # for a fork pull request, so a fork red resolves to no number and falls through to the
      # standing-issue branch instead of labelling anything. Benign, and it is why a fork's red
      # arrives as a comment on the tracker rather than as a `ci-red` label.
      - failure-signal.yml
      # A pull request becomes "green and unread" at the moment the LAST required check settles. That
      # moment is a workflow COMPLETING -- there is no `pull_request` event then, and no trigger other
      # than `workflow_run` observes another workflow's conclusion. Same argument as the two above.
      #
      # IT ALSO RUNS ON `pull_request_target`, WHICH THIS RULE FLAGS FOR THE SAME CLASS, and the
      # entry covers both arms rather than only the one it was written for. A pull request STOPS
      # being unread when somebody adds a LABEL, and a label event exists on `pull_request` and
      # `pull_request_target` and nowhere else -- no `workflow_run` sees one. Between 2026-09-04 and
      # the arm that fixed it there was no such arm at all, and the `unread` label survived being
      # read (measured on PR 897, recorded on the trigger list in the workflow itself).
      #
      # THIS ENTRY IS WEAKER THAN BOTH OF THEM AND THE DIFFERENCE IS THE POINT, so it is stated rather
      # than left to be inferred: nightly-notice.yml and failure-signal.yml both claim NO CHECKOUT and
      # no `uses:` at all. THIS WORKFLOW CHECKS OUT AND RUNS TWO ACTIONS. What makes that safe is a
      # different property, not the same one:
      #   * THE CHECKOUT IS OF TRUSTED CODE, NOT THE TRIGGERING HEAD, ON EITHER ARM. GitHub sets
      #     `github.sha` to the DEFAULT BRANCH's last commit on a `workflow_run` and to the BASE
      #     branch's last commit on a `pull_request_target`, and the checkout step declares no `ref:`,
      #     so it takes a trusted tree either way. The pull request's head is never fetched and never
      #     executed. That is the whole pwn-request precondition, and it is absent.
      #     `ref:`-lessness is the load-bearing half, so it is PINNED by
      #     tests/test_unread_signal.py::test_the_checkout_never_names_a_ref rather than asserted here
      #     -- adding `ref: ${{ github.event.workflow_run.head_sha }}` would open the hole in one line
      #     and redden nothing else.
      #   * WHICH LABEL-BEARING EVENT CARRIES THE SECOND ARM IS ITSELF THE CONTROL, and no assertion
      #     about the checkout can see it. Under `pull_request` a `ref:`-less checkout takes the MERGE
      #     commit -- the pull request's own code -- and the workflow FILE is read from the head too.
      #     Under `pull_request_target` both come from the base. So `pull_request_target` is the safer
      #     of the two here rather than a concession, and swapping one word for the other would open
      #     the hole while leaving every checkout assertion green. Pinned by
      #     tests/test_unread_signal.py::test_the_label_arm_runs_on_the_event_whose_default_checkout_is_the_base.
      #   * ONLY AN ACCOUNT WITH WRITE OR TRIAGE PERMISSION CAN FIRE THE LABEL ARM, because only such
      #     an account can label a pull request. A fork contributor cannot reach it at all, which is a
      #     narrower exposure than the `workflow_run` arm's and not a wider one.
      #   * BOTH ACTIONS ARE FIRST-PARTY AND SHA-PINNED (actions/checkout, actions/setup-python), and
      #     the checkout sets persist-credentials: false so no git credential survives the step.
      #   * Least privilege: file default `contents: read`; the single job adds only
      #     `pull-requests: write`. It cannot push, tag, or modify code. The most its token does is add
      #     or remove one label and post one comment.
      #   * Every `github.event` value reaches a script through `env` and is never interpolated into a
      #     `run:` body, so a branch name chosen by an attacker cannot break out of the shell.
      #   * The one attacker-influenceable field it parses, `head_branch`, is read ONLY to recover a
      #     pull-request number from a merge-queue ref, and only when the triggering run's event was
      #     `merge_group` -- which a fork pull request cannot produce.
      # Each of the last three is pinned by tests/test_unread_signal.py, on failure-signal.yml's model.
      #
      # EXPECT THIS RATHER THAN BE SURPRISED BY IT, same as failure-signal.yml: GitHub leaves
      # `workflow_run.pull_requests` empty for a fork pull request, so a fork resolves to no number and
      # the job does nothing at all on that arm. A fork contribution is therefore never ANNOUNCED by
      # this route, and CODEOWNERS -- which is NOT inert on a pull request the owner did not author --
      # covers it. The label arm behaves differently and the difference is benign: a maintainer
      # labelling a fork pull request DOES resolve to a number, because `pull_request_target` carries
      # it directly, so a fork pull request can be evaluated and cleared even though it was never
      # flagged. `decide()` returns `none` in that case and nothing is written.
      - unread-signal.yml

  artipacked:
    ignore:
      # artipacked flags a checkout that persists the token's git credential — a risk only if that
      # credential can leak into an uploaded artifact. The jobs below never upload the repo/.git tree,
      # so the persisted credential is inert noise here.
      #
      # NOT suppressed (fixed at the source instead): release.yml's checkouts set persist-credentials:
      # false, because it DOES upload build artifacts. dependabot-lock-resync.yml persists a
      # narrowly-scoped App token ON PURPOSE to push the resynced locks (documented inline) and is listed
      # here for that reason.
      - benchmark.yml
      - ci.yml
      - dependabot-lock-resync.yml
      - security.yml
      - vuln-metrics.yml

  bot-conditions:
    ignore:
      # zizmor flags `github.triggering_actor == 'dependabot[bot]'` in the resync job's `if:`, because an
      # actor context reflects the LAST actor on the run, not the PR's author. True — and it is why that
      # expression is the SECOND half of a conjunction and never the control. The control is the FIRST
      # half, `github.event.pull_request.user.login == 'dependabot[bot]'`: the immutable PR author, and
      # the exact replacement this audit recommends. A conjunction only NARROWS, so a spoofed actor can
      # make this job SKIP, never run. zizmor agrees — it treats `And` as non-dominating and reports this
      # at MEDIUM confidence for that reason.
      #
      # Skipping is safe by design: DEP-1 lock/export sync is independently enforced by security.yml's
      # `pip-audit` job, step "Check the lockfile is in sync with pyproject (DEP-1)", which
      # `git diff --exit-code`s the re-exports on an unfiltered pull_request trigger and is a REQUIRED
      # context. The actor half is an operational self-trigger skip: this job's own App-token push fires
      # a `synchronize` whose triggering actor is mefor-lock-resync[bot], a run that sees no Dependabot
      # secrets. See the SECURITY MODEL block and the numbered note above that `if:`.
      #
      # DO NOT TAKE ZIZMOR'S AUTO-FIX. It is classified SAFE, so a bare `zizmor --fix` applies it
      # silently: for a `pull_request` trigger it substitutes `github.event.pull_request.user.login`,
      # collapsing the conjunction into `A && A` and deleting the self-trigger skip. Nothing in CI would
      # catch that — every test and required check stays green while the skip is gone.
      #
      # The premise this suppression rests on — clause 1 present, conjoined, no `||` — is PINNED by
      # tests/test_dep1_lock_resync_lockstep.py rather than merely asserted here. Line-anchored on
      # purpose: a file-level entry would also swallow a future actor check added to this file as a SOLE
      # gate, which is the shape that IS exploitable. Accepted residual: an in-place rewrite that keeps
      # the line count would not re-fire the finding — that is what the test is for. If the line moves,
      # RE-ANCHOR it; do not broaden it to the file.
      - dependabot-lock-resync.yml:76

  archived-uses:
    ignore:
      # contributor-assistant/github-action is ARCHIVED upstream (GitHub API `archived: true`; the date
      # is observed from its last push, 2026-03-23, since `archived_at` is null). v2.6.1 is both the last
      # tag and the last release, and the pin ca4a40a7d1004f18d9960b404b97e5f30a505a08 equals that tag
      # exactly — so there is no future patch to bump to. Recorded as an ACCEPTED RESIDUAL, not a false
      # positive: the finding is true.
      #
      # What the SHA pin buys, and what it does not. It closes the TAMPER axis completely — a bundled JS
      # action's pinned SHA fully determines the bytes that run, and a deleted or re-registered namespace
      # makes this step FAIL rather than run a stranger's code. It does NOT close the axis this audit is
      # about: a flaw in the code already at that SHA will never be patched.
      #
      # NOT REPLACED, deliberately. `cla` is a REQUIRED status context (.github/required-contexts.txt)
      # and it is this JOB's own conclusion, so a broken step blocks every contribution.
      # pull_request_target / issue_comment workflows run only from the DEFAULT branch, so a swap cannot
      # be exercised on the PR that makes it — it lands on main untested, with approvals at 0 and
      # auto-merge armed. On a step holding a write token that any GitHub user can trigger by comment,
      # trading a frozen SHA-pinned bundle for a less-reviewed fork is not self-evidently a security win.
      #
      # WHAT WILL FORCE THE DECISION, and it is not this lint: action.yml at this SHA declares
      # `runs.using: node20`, as does the archived repo's HEAD, so no upstream release can ever
      # re-declare node24. GitHub removes Node20 in fall 2026. Re-check before then. Full record and the
      # replacement candidate: docs/adr/0034 (amendment, 2026-08-01).
      #
      # Line-anchored on purpose: a file-level entry would silently swallow a SECOND archived action
      # added here later. Accepted cost is drift — an inserted line re-fires the finding with no change
      # in risk. Re-anchor; do not broaden. Delete this entry when the action is replaced, or if upstream
      # un-archives (the audit re-checks that every run).
      - cla.yml:44

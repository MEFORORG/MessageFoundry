[build-system]
# EXACT `==`, in lockstep with the engine's table. The reason is stated once, above that table in the
# root pyproject.toml.
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

# Second distribution: the MessageFoundry TEST HARNESS, published alongside the engine in lockstep
# (same version, same tag). The harness/ package lives at the REPO ROOT (so `python -m harness` and the
# tests' `from harness...` imports keep working from a checkout); this build pulls it in via force-include
# and reads the engine's __version__ so the two always ship matched. The ENGINE wheel does NOT contain
# harness/ — that is the whole point of a separate distribution: a lean engine artifact for
# servers/containers/adopters, with the test/load tooling as an opt-in install for test boxes.

[tool.hatch.version]
path = "../../messagefoundry/__init__.py"  # lockstep: single source of truth is the engine's __version__

[project]
name = "messagefoundry-harness"
dynamic = ["version"]
description = "Test harness for MessageFoundry — synthetic-only send/receive (MLLP), load, and failover tooling for the engine"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
authors = [{ name = "MessageFoundry Foundation, LLC and contributors" }]
keywords = ["hl7", "healthcare", "integration", "load-testing", "failover", "mllp", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",  # Early Access (lockstep with the engine)
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
    "Topic :: Communications",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]
dependencies = [
    # The engine + its localhost API client (messagefoundry.apiclient) + PySide6 (the harness GUI).
    #
    # PINNED EXACTLY, AND THE VERSION IS NOT FREE (BACKLOG #1585). This table used to read a bare
    # `messagefoundry[harness]`, which lets a resolver satisfy the harness with ANY engine on the index.
    # harness/monitor.py and harness/scenarios.py import `messagefoundry.apiclient` (the Qt-free engine
    # client extracted under ADR 0088) at MODULE level, so an install resolved against an engine without
    # that module succeeds and then dies on ImportError at the operator's first command -- a resolution
    # question answered at run time.
    #
    # The pin is the ENGINE'S OWN VERSION because this distribution is deliberately lockstep: its
    # `[tool.hatch.version].path` above reads ../../messagefoundry/__init__.py, so the harness wheel and
    # the engine it names carry the same string BY CONSTRUCTION. A range would be a claim about which
    # engines work; `==` is the fact that they ship together.
    #
    # SO A VERSION BUMP IS TWO EDITS: messagefoundry/__init__.py, and this line. PEP 621 `dependencies`
    # is static (there is no metadata hook in this repository, and adding a build backend surface just
    # for one string is not worth it), so nothing derives this for you. `tests/test_packaging.py`
    # ::test_the_harness_pins_the_engine_at_the_version_it_ships_with is the gate, and it names both
    # files in its failure.
    "messagefoundry[harness]==0.4.0",
]

[project.scripts]
messagefoundry-harness = "harness.__main__:main"

[project.urls]
Homepage = "https://messagefoundry.org/"
Source = "https://github.com/MEFORORG/MessageFoundry"
# Contributing, not Issues: CONTRIBUTING.md states the routes (BACKLOG #1755).
Contributing = "https://github.com/MEFORORG/MessageFoundry/blob/main/CONTRIBUTING.md"

[tool.hatch.build.targets.wheel]
# harness/ is two levels up (the repo root). This table used to carry the one mapping
# `{"../../harness" = "harness"}`, and that whole-directory mapping also shipped `harness/CLAUDE.md` --
# this repository's internal Claude Code conventions -- to everyone who installs the harness
# (BACKLOG #1702). Sub-directories are still mapped whole and recurse, so only the top level is listed.
#
# DO NOT REACH FOR `exclude` HERE. It cannot fix this, and that is measured rather than assumed.
# hatchling 1.32.0's `recurse_forced_files` (hatchling/builders/plugin/interface.py) never calls
# `include_path`, so a force-included file is filtered only by hatchling's own EXCLUDED_FILES and
# EXCLUDED_DIRECTORIES -- every file-selection option is inert over it. `exclude = ["CLAUDE.md"]` was
# added beside the whole-directory mapping and the wheel BUILT AND LISTED: 101 members, with
# `harness/CLAUDE.md` still among them, identical to the build without it. `include` and `only-include`
# are dead here for the same reason. Enumerating is the only route. (The ENGINE'S root pyproject.toml
# does use `exclude` for its own nested CLAUDE.md, because its package tree is walked, not mapped.)
#
# THE COST, IN BOTH DIRECTIONS. A NEW top-level file or directory under harness/ does not ship until it
# is added here. And an entry left behind after its file is deleted is WORSE than not shipping: hatchling
# raises `FileNotFoundError: Forced include not found` and the whole build dies, first seen inside the
# release job, because nothing in PR CI runs a build. `tests/test_packaging.py` derives both directions
# from the tracked tree, so each is loud in PR CI instead of silent until a tag.
[tool.hatch.build.targets.wheel.force-include]
"../../harness/acceptance" = "harness/acceptance"
"../../harness/config" = "harness/config"
"../../harness/load" = "harness/load"
"../../harness/reconcile" = "harness/reconcile"
"../../harness/README.md" = "harness/README.md"
"../../harness/__main__.py" = "harness/__main__.py"
"../../harness/_async.py" = "harness/_async.py"
"../../harness/_console_widgets.py" = "harness/_console_widgets.py"
"../../harness/_login.py" = "harness/_login.py"
"../../harness/_spreadsheet.py" = "harness/_spreadsheet.py"
"../../harness/compose.py" = "harness/compose.py"
"../../harness/file_panel.py" = "harness/file_panel.py"
"../../harness/file_transport.py" = "harness/file_transport.py"
"../../harness/mllp.py" = "harness/mllp.py"
"../../harness/monitor.py" = "harness/monitor.py"
"../../harness/receive.py" = "harness/receive.py"
"../../harness/scenarios.py" = "harness/scenarios.py"
"../../harness/send.py" = "harness/send.py"
"../../harness/window.py" = "harness/window.py"

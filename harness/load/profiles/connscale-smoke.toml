# Connection-scale CI smoke (B11) — small N (50 → 100) on SQLite, hermetic + fast (~15-25s). Proves
# the harness SPINS N connections, NO-LOSS reconcile holds, and the FD + empty-claim counters move
# MONOTONICALLY (the wall exists and scales). It does NOT regression-cover wall #1 (executor) or wall
# #2 (pool): both are no-ops/under-threshold at small N on SQLite (the pool wall needs a server DB —
# see the connscale-smoke-pg CI leg, which forces pool_size to 1-2). Stated honestly so the smoke is
# not over-read. Synthetic + generic.

[connscale]
name = "connscale-smoke"
description = "CI smoke: N=50/100 on SQLite — harness spins + no-loss + FD/empty-claim monotonicity"
counts = [50, 100]
sweep_mode = "both"
aggregate_rate = 35.0
per_conn_rate = 0.35
hold_seconds = 3.0
connect_batch = 25
connect_batch_pause_s = 0.02
poll_interval_s = 0.25
drain_timeout_s = 30.0
base_port = 2600
transform = "cheap"
reload_probe = true
store_backend = "sqlite"
corpus_count_per_trigger = 10

[connscale.slo]
zero_loss = true
# Loose `>=` monotonicity smoke (CI runners are noisy — mf-ci-test-flakes): FD count at N=100 must
# be >= N=50 within each sweep mode.
fd_monotonic = true
# DISARMED TO MATCH THE IN-SUITE PROFILE, and the two are deliberately the same answer because
# nothing pins them together — a band armed here and disarmed in tests/test_connscale_smoke.py is
# two definitions of one metric's floor, free to drift.
#
# THE EVIDENCE IS FROM N=12/24, NOT FROM THIS PROFILE'S N=50/100. Measured on 252 pairs from 126
# green CI legs: the ratio's premise holds on ubuntu (median 1.671, sd 0.079, never below parity)
# and fails on both Windows legs (medians 1.062 and 1.136, at or below parity in 38 and 21 percent
# of PASSING runs), so the 0.75 floor sits inside the Windows body rather than between two modes.
#
# WHETHER THAT CARRIES TO N=50/100 IS UNMEASURED. This profile is not run by any workflow today
# (`--connscale` appears zero times under .github/), so the flag gates nothing and the safe state is
# the one that cannot arrive armed in a CI leg somebody wires up later. Re-arm it with readings from
# THIS N, not from the smoke's. BACKLOG #1211.
empty_claims_monotonic = false

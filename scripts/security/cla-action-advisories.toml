# Advisories ALREADY KNOWN against the vendored CLA action's declared closure (BACKLOG #1578).
#
# The closure is `.github/actions/cla-assistant-lite/upstream-package-lock.json`, a frozen 2021-era
# tree. `scripts/security/audit_cla_action_lockfile.py` audits it, and `security.yml`'s
# `cla-action-audit` job runs that daily. The job fails on any advisory NOT listed here, and on any
# entry here that the audit no longer reports.
#
# ADDING AN ENTRY IS THE ACKNOWLEDGEMENT, the way `--ignore-vuln <ID>` is for pip-audit. Do it in a
# reviewed pull request, with a comment above the entry saying who triaged it and what they found.
# The script prints what to check first.
#
# AN ENTRY WITH NO TRIAGE COMMENT ABOVE IT HAS NOT BEEN TRIAGED. The first 35 are the whole result
# of the first audit, run 2026-09-29 with npm 11.5.2, recorded as found. Nobody has yet judged
# whether each is reachable in the bundle's runtime path, and listing them here is not that
# judgement. Some affect packages the lockfile marks `dev` only (the @babel packages, for example).
# Others do not: lodash, lodash.set and js-yaml are among the packages the lockfile does not mark
# `dev`.
#
# TWO ENTRIES WERE REMOVED ON 2026-10-24, BECAUSE GITHUB WITHDREW BOTH ADVISORIES. They were braces
# GHSA-vfj7-8cjw-p6xm and sprintf-js GHSA-hp3w-g68c-fv3c. PR 2112 (commit 713d32a0d) added them on
# 2026-10-07, and its copy of this file keeps their full triage. Scheduled Security run 40085471050
# on 2026-10-24 reported each as a STALE BASELINE ENTRY. Claude, an AI agent working as a Builder
# subagent, then read `gh api advisories/<id>` for each. GitHub withdrew GHSA-hp3w-g68c-fv3c at
# 2026-10-22T19:21:04Z and GHSA-vfj7-8cjw-p6xm at 2026-10-23T12:53:02Z. Each summary now starts
# "Withdrawn Advisory". The audit script says to remove a withdrawn advisory's entry. If GitHub
# reinstates either one, the gate reds on it as a NEW ADVISORY. Triage it again, starting from PR
# 2112's reasoning.
#
# A BUNDLE MEASUREMENT FROM THAT TRIAGE IS KEPT. It bears on the js-yaml entries and on braces
# GHSA-grv7-fg5c-xmjg. That advisory sits on braces 3.0.2, the node the withdrawn GHSA-vfj7-8cjw-p6xm
# was also reported against. NONE OF THOSE ENTRIES WAS TRIAGED ON THIS MEASUREMENT. They are
# recorded as found, like the rest of the first 35.
#
# dist/index.js is not minified, so a package's own identifiers survive in it. Its NAME often does
# not, because the bundler replaces require paths with module ids. So the probes are identifiers,
# for at least these packages on the braces and js-yaml chains. Each returned 0 in dist/index.js on
# 2026-10-07:
#   "sprintf", case-insensitive: sprintf-js, which argparse needs
#   "ArgumentParser": argparse, which js-yaml 3.13.1 needs
#   "YAMLException" and "safeLoad": js-yaml
#   "Toolkit": actions-toolkit, js-yaml's runtime parent
#   "CHAR_ZERO_WIDTH_NOBREAK_SPACE": a constant braces defines, as picomatch also does
#   "toRegexRange": fill-range, braces' own dependency
# The control is "function getInput|function setFailed", two functions of @actions/core. The bundle
# does carry them, and the same probe on the same file returns 2. So an identifier probe can find a
# bundled package, and the zeros are not a dead instrument. "isMatch" is deliberately not a probe,
# because lodash shares the name with micromatch. The bundle, not the lockfile, is what cla.yml
# runs. So for the packages probed, this reading bounds exposure. It says nothing about any other
# package here, and lodash, lodash.set and the @octokit packages are among those whose code IS in
# the bundle. tests/test_cla_action_advisory_gate.py re-runs these probes and the control. A
# re-vendored bundle that carries any of this code reds there, and the reading must be taken again.
#
# Each entry is one advisory id and the package npm reported it against. Only those two fields are
# compared. Severity and title are printed live from the audit.


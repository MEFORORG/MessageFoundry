source = "measured 2026-10-07 UTC (web console step-margin gate re-measure, 2026-10-07). Pool: every ci.yml run with event merge_group, pull_request, push or workflow_dispatch created 2026-09-30T19:25:00Z..2026-10-07T04:24:59Z UTC, the web console rows' window extended to the ejection, each event listed on its own in 12-hour slices: 1298 runs (merge_group 473, pull_request 603, push 215, workflow_dispatch 7). Jobs fetched with ?filter=all; a row is this leg's `Tests (pytest)` STEP, kept when THAT STEP concluded success, duration = its completed_at minus started_at, executions under 60s dropped, re-run copies with identical stamps dropped (37). Runs still in progress when first read were re-read until every ubuntu job had finished, last at about 04:51Z UTC on 2026-10-07. n=1056 (merge_group 411, pull_request 431, push 209, workflow_dispatch 5), min 9:20, median 15:48, p90 20:33, p95 21:10. Worst 24:36, run 37568821379 job 112622697747 (merge_group, 2026-10-07, the ejection this re-measure was cut for); next 23:32, run 37506786823 (pull_request). The gate went red on that one success row at the 31:00 cap. The distribution is bimodal by runner; ci.yml's note says so. Uncensored on evidence even though this leg's cap is also its kill: the longest of 118 step failures (run 37571163103) stopped at 22:22 and the longest of 72 cancellations at 19:06, both far under the 31:00 kill."


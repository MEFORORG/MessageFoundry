censored_by = "the JOB cap of the `test` job, under the RETIRED topology in which this suite was a second step there. It ran second, so a job-level kill landed inside it. Observed on run 30724385719 -- `Tests (pytest)` SUCCESS at 25:51, then this step CANCELLED at 30:14 when job_timeout 30 fired. THAT MECHANISM NO LONGER EXISTS: the suite now has its own `webconsole` job where it is the only gated step, so nothing runs ahead of it to spend the job cap. The measurement below is kept because it is a real observation and still a valid lower bound on what the suite wants; its CENSORING REASON is historical, and the first row measured under the new topology supersedes it."
source = "measured 2026-08-08; same pool as the `Tests (pytest)` rows, taken over rows where `Tests` concluded success (NOT over rows where both steps did, which drops the very run that motivates the caveat above); n=441."


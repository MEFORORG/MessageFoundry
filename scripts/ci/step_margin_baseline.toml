# Recorded per-leg maxima for every CI step that carries its own `timeout-minutes`.
#
# WHY THIS IS DATA AND NOT PROSE. The same table lived only in a `ci.yml` comment and was published
# WRONG TWICE (BACKLOG #344): once as a `gh run list` default page reported as a chosen pool, once with
# an `n` that no pool definition reproduced. The maxima survived both passes; the pools did not. A
# table nothing reads is a table nobody rechecks, so `scripts/ci/step_margin.py` reads this one on
# every leg of every run and says out loud when a live step has outgrown the row below it.
#
# EVERY ROW IS A MEASUREMENT WITH A DATE, AND ITS POOL IS PART OF THE ROW. `source` is not a citation
# ornament: a ratio whose pool is not stated cannot be rechecked, and that is the whole finding of the
# item this file exists for. State the pool with the count.
#
# `censored = true` MEANS THE NUMBER IS A LOWER BOUND, and every ratio taken against it flatters
# itself. A run that wanted longer than the bound in force when the pool was collected was KILLED at
# that bound and then -- correctly -- dropped for not concluding success, so it is missing from exactly
# the tail being measured. The script prints the caveat rather than quietly dividing by it.
#
# THIS FILE IS NOT THE CAP. The cap the margin gate divides by is `matrix.step_timeout` (engine) /
# `matrix.webconsole_margin_cap` (web console) in ci.yml, sized there with its own arithmetic. This is
# the observed distribution the cap was sized against, kept separately so a run exceeding the record is
# visible without anyone re-reading a comment.
#
# THE TWO LEGS NAME DIFFERENT KINDS OF NUMBER, AND THAT ASYMMETRY IS THE POINT OF THIS PARAGRAPH.
# On the web console leg the gate's cap and the step's `timeout-minutes` were SPLIT: the kill is
# `matrix.webconsole_step_timeout` and the gate divides by `matrix.webconsole_margin_cap`, which sits
# below it. On the ENGINE leg they are still ONE variable -- `matrix.step_timeout` is both the kill at
# ci.yml's `Tests (pytest)` step and the `--cap-minutes` the gate is handed. So every engine row below
# is CENSORABLE at its own cap by construction -- no engine pool can ever contain a run above it.
#
# CENSORABLE IS NOT CENSORED, and the rows below already keep the two apart on evidence rather than on
# the structure. The windows-2025 engine row is censored and says how it knows: seven runs killed AT
# the 36:00 cap, reporting 36:01 to 36:08. The ubuntu and windows-2022 rows say `censored = false` and
# each states the evidence it rests on -- the largest step FAILURE observed on that leg, offered as
# showing the leg never touched its cap, so nothing was truncated even though something could have
# been. Read each row's own `source` for that evidence rather than taking it from here; this paragraph
# does not restate how far below the cap those failures sat, because the rows do not say and it must
# not be inferred. Do not flatten any of it into "every engine row is a lower bound".
# Splitting the engine pair the way the web console pair is now split is a separate change nobody has
# made.

[[baseline]]
step = "Tests (pytest)"
leg = "ubuntu-latest"
max_passing = "16:08"
censored = false
censored_by = ""
source = "measured 2026-08-08; pool: every ci.yml run created 2026-08-01T00:00Z..2026-08-09T00:00Z UTC (688 runs, 1,618 leg-executions), jobs fetched with ?filter=all so an attempt killed at the cap is not hidden behind its passing re-run, rows are this leg's `Tests (pytest)` STEP kept when THAT STEP concluded success, executions under 60s dropped; n=441. Uncensored on evidence, not assumption: the largest ubuntu step FAILURE in 535 leg-executions is 14:21, so the leg has never touched its cap."

[[baseline]]
step = "Tests (pytest)"
leg = "windows-2022"
max_passing = "29:23"
censored = false
censored_by = ""
source = "measured 2026-08-08; same pool as the ubuntu row; n=399. Uncensored on evidence: the largest windows-2022 step FAILURE in 542 leg-executions is 25:48. This is also a post-#1027 row."

[[baseline]]
step = "Tests (pytest)"
leg = "windows-2025"
max_passing = "35:47"
censored = true
censored_by = "the 36:00 step_timeout in force when the pool was collected: this leg was killed AT the cap seven times in the window (36:08 on runs 31189317409 / 31199321840 / 31202372465, 36:07 on 30955150892 / 31094875320 / 31192717684, 36:01 on 31149117314), three of them push runs on main"
source = "measured 2026-08-08; same pool as the ubuntu row; n=360. 35:47 is the largest step that FIT in 36:00, and 36:08 is a lower bound on the largest the suite wants. The kills were slowness, not a wedge -- run 31149117314's pytest finished GREEN (0:35:48) and the step was killed 4.85s later, and no faulthandler native-stack dump appears in any kill log."

# THE THREE WEB CONSOLE ROWS WERE RE-MEASURED AGAIN 2026-09-29 UTC (BACKLOG #1842, the third
# re-derivation). The 2026-09-26 rows rotted in three days: merge-group run 36531560700 reddened the
# windows-2022 leg at 4:44 against a 6:00 cap, above that row's 4:11, with every test passing, and the
# queue ejected engine PR 1778. The gate had printed RE-DERIVE on green runs before that, into a log
# nobody read. `step_margin.py` now raises that finding as a workflow annotation; what that does and
# does not buy is stated once, in its `record_escalation` docstring.
#
# THE POOL IS THE 2026-09-26 POOL PLUS EVERYTHING SINCE, so each maximum below is the larger of the
# two windows. The earlier window is not re-fetched; its figures are carried from the rows it wrote:
#
#   leg             2026-09-22T14:34Z..09-26T02:16Z     2026-09-26T02:16Z..09-29T20:38Z
#   ubuntu-latest   n=298  max 3:13  median 2:35       n=747  max 3:44  median 2:41
#   windows-2022    n=298  max 4:11  median 3:17       n=747  max 5:05  median 3:20
#   windows-2025    n=297  max 5:24  median 3:35       n=746  max 5:43  median 3:40
#
# The later window is 782 ci.yml merge_group and pull_request runs, listed by `gh run list --created`,
# with the same filter the earlier rows state: jobs with ?filter=all, this step's OWN conclusion
# success, completed_at minus started_at, re-listed copies with identical stamps dropped. Positive
# control: the matcher found the step in 2,418 jobs, so a zero anywhere below is a reading. On
# windows-2022 the gate's own step concluded failure on 5 of the 747 success rows, at 4:37 to 5:05;
# on the other two legs, 0.
#
# The 2026-09-26 rows replaced rows measured 2026-08-08 under the retired topology, censored by the
# `test` job's cap. ci.yml still cites those in at least two sizing notes, so they stay recorded here:
#
#   ubuntu-latest   2:22   n=441
#   windows-2022    2:51   n not stated in the source table; that leg's overhead count was 413
#   windows-2025    3:59   n=360
#
# Their pool was the engine rows' pool above (every ci.yml run created 2026-08-01T00:00Z to
# 2026-08-09T00:00Z UTC). Run 30724385719 shows the censoring: `Tests (pytest)` succeeded at 25:51,
# then this step was cancelled at 30:14 when job_timeout 30 fired.
# ci.yml's "THE THIRD RE-DERIVATION" note sizes `webconsole_margin_cap` from the maxima below.

[[baseline]]
step = "Web console tests (pytest)"
leg = "ubuntu-latest"
max_passing = "3:44"
censored = false
censored_by = ""
source = "measured 2026-09-29 UTC (BACKLOG #1842, third re-derivation); under the separate `webconsole` job and xdist (-n 4 --dist loadfile, PR 1415). Pool: every ci.yml run with event merge_group or pull_request created 2026-09-22T14:34Z..2026-09-29T20:38Z UTC, the first window (to 2026-09-26T02:16Z, 323 runs) carried from the 2026-09-26 row and the second (782 runs) fetched 2026-09-29. Jobs fetched with ?filter=all; a row is this leg's `Web console tests (pytest)` STEP, kept when THAT STEP concluded success, duration = its completed_at minus started_at; re-listed copies with identical stamps dropped. n=298+747 (second window: merge_group 340, pull_request 407, min 1:48, median 2:41); the 3:44 is merge_group run 36620675741, job 109585116185. Uncensored on evidence: the one step failure in the second window (run 36518825881) stopped at 2:14; every cancelled step stopped at 3:19 or less with its whole job cancelled; the kill is 9:00. push and workflow_dispatch are left out because a push that changes no code leaves this job unexpanded."


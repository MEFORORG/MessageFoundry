# The bounded mutation list over the named invariant tests (BACKLOG #1746, limb 5).
#
# Each entry is one deliberate break of engine code and the tests that must turn RED under it.
# `scripts/ci/invariant_mutations.py` applies each break alone, runs its tests, and restores the file.
# A mutation whose tests stay green SURVIVED: the tests that name the property cannot see it broken,
# which is the defect class #1746 exists to close. Not a repository-wide mutation score -- the
# anti-metric rule in docs/Code_Quality_Standards.md section 4.1 forbids certifying on one. It is a
# checked-in list, so each row is a reviewed claim that a named control has a red.
#
# Seeded from the thirteen instances Fable review packet 18 (finding P18-01) named, where the instance
# is reachable offline. The server-backend locks (#1610) need a live PostgreSQL or SQL Server and are
# not here; a row for them belongs on the gated live leg, not in this list.
#
# Fields, all required:
#   id       stable name, used by --only
#   item     the BACKLOG item whose control this pins
#   file     repository-relative path of the file to break
#   find     exact text, which must occur EXACTLY ONCE in `file` (a literal string, not a pattern)
#   replace  the text that breaks it
#   tests    pytest node ids; at least one must FAIL under the break, and all must pass without it
#
# A row goes stale when refactoring moves its `find` text. tests/test_invariant_mutations.py fails
# on that at once, on every engine leg, so the list cannot rot into a run that breaks nothing.

[[mutation]]
id = "ack-after-commit-swallowed"
item = 1608
file = "messagefoundry/pipeline/wiring_runner.py"
find = '''
        # the AA ACK below still fires only after the whole document is durable.
        mid = await self.store.enqueue_ingress(
            channel_id=ic.name,
            raw=skeleton,
            control_id=fields.control_id,
            message_type=fields.message_type,
            source_type=src,
            summary=fields.summary,
            attachment_refs=attachment_refs or None,
        )
'''
replace = '''
        # the AA ACK below still fires only after the whole document is durable.
        try:
            mid = await self.store.enqueue_ingress(
                channel_id=ic.name,
                raw=skeleton,
                control_id=fields.control_id,
                message_type=fields.message_type,
                source_type=src,
                summary=fields.summary,
                attachment_refs=attachment_refs or None,
            )
        except Exception:
            mid = "mutated-ack-before-commit"
'''
tests = [
    "tests/test_ack_after_commit_invariant.py::test_mllp_ingress_commit_failure_sends_no_aa_and_persists_nothing",
]


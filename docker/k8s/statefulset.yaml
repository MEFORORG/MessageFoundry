#
# Minimal Kubernetes manifests for the headless engine — Topology A (in-process TLS), the self-contained
# baseline. See docs/CONTAINER-EXPOSURE-EVALUATION.md §1 for Topology B (a same-pod TLS-terminating
# sidecar with the engine bound to 127.0.0.1 + trusted_proxies=[127.0.0.1] + tls_terminated_upstream=true
# + plaintext_upstream_hop_acknowledged=true + web_console_public_address; that section has the full
# block), the "k8s-preferred" pattern
# and the right home for mTLS + OCSP-must-staple revocation.
# NOT A SUPPORTED V1 DEPLOYMENT (the image runs Linux). See
# docs/SYSTEM-REQUIREMENTS.md, "Linux is not a supported v1 deployment target".
#
# CONFIG IS BAKED INTO THE IMAGE, not mounted, to match ADR 0017's immutable, byte-identical
# multi-instance model. The engine (uid 10001) refuses a config dir or module owned by any uid other than
# root or its own, or writable by group/world (_assert_safe_config_source -- it executes the *.py as the
# service account). Root-owned is the safer owner: the engine's account cannot rewrite it. Build an
# adopter image (COPY writes root-owned files; run chmod -R a+rX,go-w on it in the build context first):
#     FROM messagefoundry:<version>
#     COPY config /config
# and set all four image: fields below (revocation-attestation-check, tls-dir, copy-tls and engine) to it.
#
# Single replica: the default SQLite store is single-writer. For multi-node HA use the Postgres/SQL Server
# store backend + the built leader election (docs/CLUSTERING.md) — out of scope for this baseline manifest.
---
# Headless governing Service for the StatefulSet (stable per-pod DNS: pod-0.mefor-engine.<ns>...).
apiVersion: v1
kind: Service
metadata:
  name: mefor-engine
spec:
  clusterIP: None
  selector:
    app: mefor-engine
  ports:
    - { name: api, port: 8443, targetPort: 8443 }
    - { name: mllp, port: 2575, targetPort: 2575 }
---
# Client-facing Service. NOTE: MLLP is long-lived TCP — for off-cluster partners front it with an L4
# load balancer (NLB), not an L7/HTTP ingress, with a TCP health check + generous idle/dereg timeouts.
apiVersion: v1
kind: Service
metadata:
  name: mefor-engine-client
spec:
  selector:
    app: mefor-engine
  ports:
    - { name: api, port: 8443, targetPort: 8443 }
    - { name: mllp, port: 2575, targetPort: 2575 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mefor-engine
spec:
  serviceName: mefor-engine
  replicas: 1
  selector:
    matchLabels:
      app: mefor-engine
  template:
    metadata:
      labels:
        app: mefor-engine
    spec:
      # Cover engine.stop()'s ordered teardown: ≈10s graph-quiesce + ~5s PER MLLP listener (drained
      # serially) + store-close margin. Raise it for many-listener graphs; also ensure it exceeds the
      # cluster leader-lease TTL so a drained leader releases the lease before SIGKILL.
      terminationGracePeriodSeconds: 40
      # No service-link variables. The engine reads none, and it treats MEFOR_<SECTION>_<KEY> as a
      # setting: a Service named `mefor`, or `mefor-<section>`, in this namespace would otherwise
      # inject names the settings loader refuses at start (docs/CONFIGURATION.md). DNS is unaffected.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # fsGroup makes the store PVC writable by the engine, and lets copy-tls below read the Secret,
        # whose files are root-owned at 0440. The engine never reads its key through this group.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Under enforce the engine refuses a TLS key reached through a link or readable by a group, and
      # a Secret volume serves each file as a root-owned link, group-readable through fsGroup
      # (docs/PHI.md section 2, *Key files*). copy-tls copies the pair into a memory emptyDir at 0600 as
      # uid 10001, and the engine mounts that, never the Secret. A Secret update reaches the engine at
      # the next pod start. Copy a connection's key file, such as an MLLP tls_key_file, the same way.
      # The engine also refuses a key in a directory that accounts other than its owner may write with
      # no sticky bit, since any of them could put another file in its place. The kubelet makes the
      # emptyDir's root, and its mode is the kubelet's, so tls-dir first makes the pair's own directory,
      # engine/, at 0700 as uid 10001, and copy-tls copies into that.
      initContainers:
        # One-shot check that the attestation reads as TRUE, run before anything else in the pod
        # (BACKLOG #5400). The required Secret key refuses only a missing value, and a value the
        # engine reads as false, such as 0, would otherwise start an engine that exits 2 at the
        # revocation gate. This reads the value with serve's own parser, in the same image, and
        # exits 1 naming the gate when it does not read as true, so the engine container never
        # starts. The kubelet retries a failed init container with back-off, so the pod then shows
        # Init:CrashLoopBackOff with this container's message, not an engine restarting at the
        # gate. It does not read the bind, so it refuses a false value even where serve's gate
        # would not apply. The program is docker/compose.yaml's revocation-attestation-check
        # service's, word for word.
        - name: revocation-attestation-check
          image: REPLACE_WITH_YOUR_CONFIG_BAKED_IMAGE   # the same image as the engine below
          command:
            - /opt/venv/bin/python
            - "-I"
            - "-X"
            - "disable-remote-debug"
            - "-B"
            - "-c"
            - "import sys; from messagefoundry.config.tls_policy import TLS_REVOCATION_ATTESTED_ENV as V, tls_revocation_attested as ok; sys.exit(0 if ok() else 'error: refusing to start the engines: ' + V + ' does not read as true, so serve would refuse in-process TLS off loopback and restart forever (docs/SECURITY.md, API revocation gate). Set it to 1 only if your PKI enforces revocation for the certificates the engines serve and accept.')"
          env:
            - name: MEFOR_TLS_REVOCATION_ATTESTED
              valueFrom: { secretKeyRef: { name: mefor-secrets, key: tls-revocation-attested } }
          # The refusal goes to stderr; this puts its last lines in the pod status, so
          # kubectl describe shows the message without kubectl logs -c.
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
        - name: tls-dir
          image: REPLACE_WITH_YOUR_CONFIG_BAKED_IMAGE   # the same image as the engine below
          command:
            - install
            - "-d"
            - "-m"
            - "0700"
            - /etc/mefor/tls/engine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
          volumeMounts:
            - { name: tls, mountPath: /etc/mefor/tls }
        - name: copy-tls
          image: REPLACE_WITH_YOUR_CONFIG_BAKED_IMAGE   # the same image as the engine below
          command:
            - install
            - "-m"
            - "0600"
            - /etc/mefor/tls-secret/api.crt
            - /etc/mefor/tls-secret/api.key
            - /etc/mefor/tls/engine/
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
          volumeMounts:
            - { name: tls-secret, mountPath: /etc/mefor/tls-secret, readOnly: true }
            - { name: tls, mountPath: /etc/mefor/tls }
      containers:
        - name: engine
          # REPLACE with your config-baked image (FROM messagefoundry:<version>; COPY config /config).
          image: REPLACE_WITH_YOUR_CONFIG_BAKED_IMAGE
          args: ["serve", "--config", "/config", "--env", "prod"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - { name: api, containerPort: 8443 }
            - { name: mllp, containerPort: 2575 }
            # Do NOT expose raw-TCP / X12 ports without TLS. Those listeners are PLAINTEXT-ONLY (no tls=
            # option), but they ARE exposed-gated since PR #558: MLLP, the DICOM C-STORE SCP, HTTP, raw-TCP,
            # and X12 all refuse a non-loopback bind without TLS at startup. For raw-TCP/X12 there is no TLS
            # escape — keep them loopback-bound or front them with a TLS-terminating TCP proxy.
          env:
            - { name: MEFOR_SECURITY_LOCAL_ACCESS_ONLY, value: "false" }
            - { name: MEFOR_SECURITY_LISTEN_ADDRESS, value: "0.0.0.0" }
            - { name: MEFOR_API_PORT, value: "8443" }
            - { name: MEFOR_API_TLS_CERT_FILE, value: "/etc/mefor/tls/engine/api.crt" }
            - { name: MEFOR_API_TLS_KEY_FILE, value: "/etc/mefor/tls/engine/api.key" }
            # Off loopback serve also refuses this certificate bind until you attest revocation with
            # MEFOR_TLS_REVOCATION_ATTESTED=1 (docs/SECURITY.md, API revocation gate). The value is
            # your attestation, so it comes from the Secret's tls-revocation-attested key and this
            # file never writes it. The key is NOT optional: without it the kubelet refuses to start
            # the container, rather than the engine exiting and restarting forever. Set it to 1 only
            # if your PKI enforces revocation for the certificates the engine serves and accepts. A
            # value the engine reads as false, such as 0, passes the kubelet; the
            # revocation-attestation-check init container above then refuses it, so the engine
            # never starts and the pod crash-loops in Init:CrashLoopBackOff, naming the gate.
            # Outbound hops read the same variable with a
            # different effect (docs/DEPLOYMENT.md, "Revocation-guard behavior").
            - name: MEFOR_TLS_REVOCATION_ATTESTED
              valueFrom: { secretKeyRef: { name: mefor-secrets, key: tls-revocation-attested } }
            - { name: MEFOR_INBOUND_BIND_HOST, value: "0.0.0.0" }   # MLLP() must set tls=True (exposure gate)
            - { name: MEFOR_SECURITY_REQUIRE_MFA, value: "true" }       # covers directory accounts too; off + exposed = refused under enforce
            - { name: MEFOR_STORE_REQUIRE_ENCRYPTION, value: "true" }   # keeps the default keyless refusal past the audited opt-out (docs/PHI.md section 3)
            - { name: MEFOR_SECURITY_BLOCK_UNLISTED_OUTBOUND, value: "true" } # plus MEFOR_EGRESS_ALLOWED_* for your graph
            # --- what an enforcing start needs (BACKLOG #5935) ---
            # [security].enforcement defaults to enforce and nothing here lowers it. As shipped, serve
            # REFUSES to start: the inputs below are commented out, because a placeholder value would
            # pass these gates and start an engine whose notices and logs go nowhere. Uncomment each
            # line and give it your own value. At least these gates read them; serve's refusal
            # message names any other one your config trips.
            # Security notices and credential reminders (ASVS 6.3.5/6.3.7/6.4.5): an SMTP relay, a
            # sender and a recipient. The relay hop verifies its certificate by default.
            # - { name: MEFOR_ALERTS_EMAIL_SMTP_HOST, value: "REPLACE-smtp.example.org" }
            # - { name: MEFOR_ALERTS_SMTP_ALLOWED_HOSTS, value: "REPLACE-smtp.example.org" }
            # - { name: MEFOR_ALERTS_EMAIL_FROM, value: "REPLACE-mefor@example.org" }
            # - { name: MEFOR_ALERTS_EMAIL_TO, value: "REPLACE-mefor-ops@example.org" }
            # Off-box log forwarding: verified TLS to a collector that is not this host (ADR 0200),
            # on the egress allowlist block_unlisted_outbound requires. Bake the CA and CRL into the
            # config image under /config, root-owned like the config itself, because the engine
            # refuses a CA another account could replace. Rebuild the image with a fresh CRL before
            # the baked one's nextUpdate.
            # - { name: MEFOR_LOGGING_FORWARD_HOST, value: "REPLACE-siem.example.org" }
            # - { name: MEFOR_LOGGING_FORWARD_PORT, value: "6514" }
            # - { name: MEFOR_LOGGING_FORWARD_PROTOCOL, value: "tls" }
            # - { name: MEFOR_LOGGING_FORWARD_TLS_CA_FILE, value: "/config/pki/syslog-ca.pem" }
            # - { name: MEFOR_LOGGING_FORWARD_TLS_CRL_FILE, value: "/config/pki/syslog-crl.pem" }
            # - { name: MEFOR_EGRESS_ALLOWED_SYSLOG, value: "REPLACE-siem.example.org" }
            # Retention bounds (ASVS 14.2.7). The message-body and dead-letter windows default on;
            # these two tiers need a window or an acknowledgement, and both are your decision. For
            # transform state the gate names the acknowledgement as the safe answer: a window deletes
            # it by write time, while a Handler may still be using it.
            # - { name: MEFOR_RETENTION_SEARCH_PRESET_DAYS, value: "REPLACE-days" }
            # - { name: MEFOR_SECURITY_ALLOW_KEEPING_TRANSFORM_STATE_INDEFINITELY, value: "true" }
            # The log spool (ADR 0200) defaults to log-spool beside the store, on the store PVC.
            # Secrets injected from the Secret as env (never plain manifest values):
            - name: MEFOR_STORE_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: mefor-secrets, key: store-encryption-key } }
            - name: MEFOR_API_TLS_KEY_PASSWORD
              # optional: the pod still starts if the API key is unencrypted and the Secret omits this key.
              valueFrom: { secretKeyRef: { name: mefor-secrets, key: api-tls-key-password, optional: true } }
          volumeMounts:
            - { name: store, mountPath: /var/lib/mefor }   # PHI store (PVC); WAL writes -wal/-shm siblings here
            - { name: tls, mountPath: /etc/mefor/tls, readOnly: true }   # copy-tls's 0600 copies
            - { name: tmp, mountPath: /tmp }               # writable tmpfs for the read-only root fs
          # Liveness only. /health is tokenless + always 200 and answers BEFORE the engine finishes
          # starting — a pure liveness signal, not readiness. There is no unauthenticated readiness
          # endpoint today, so no readinessProbe is wired (one would mark the pod Ready prematurely).
          livenessProbe:
            httpGet: { path: /health, port: 8443, scheme: HTTPS }
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: tls                     # what the engine reads: copy-tls writes engine/, at 0600
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        - name: tls-secret              # mounted on copy-tls only, never on the engine
          secret:
            secretName: mefor-secrets
            defaultMode: 0440           # root-owned: copy-tls reads it through fsGroup 10001. Never 0644
            items:
              - { key: api.crt, path: api.crt }
              - { key: api.key, path: api.key }
        - name: tmp
          emptyDir: { medium: Memory }
  volumeClaimTemplates:
    - metadata:
        name: store
      spec:
        accessModes: ["ReadWriteOnce"]   # the PHI store MUST persist across restarts (at-least-once invariant)
        resources:
          requests:
            storage: 5Gi

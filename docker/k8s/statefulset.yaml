#
# Minimal Kubernetes manifests for the headless engine — Topology A (in-process TLS), the self-contained
# baseline. See docs/CONTAINER-EXPOSURE-EVALUATION.md §1 for Topology B (a same-pod TLS-terminating
# sidecar with the engine bound to 127.0.0.1 + trusted_proxies=[127.0.0.1] + tls_terminated_upstream=true
# + plaintext_upstream_hop_acknowledged=true + web_console_public_address; that section has the full
# block), the "k8s-preferred" pattern
# and the right home for mTLS + OCSP-must-staple revocation.
# NOT A SUPPORTED V1 DEPLOYMENT (the image runs Linux). See
# docs/SYSTEM-REQUIREMENTS.md, "Linux is not a supported v1 deployment target".
#
# CONFIG IS BAKED INTO THE IMAGE, not mounted, to match ADR 0017's immutable, byte-identical
# multi-instance model. The engine (uid 10001) refuses a config dir or module owned by any uid other than
# root or its own, or writable by group/world (_assert_safe_config_source -- it executes the *.py as the
# service account). Root-owned is the safer owner: the engine's account cannot rewrite it. Build an
# adopter image (COPY writes root-owned files; run chmod -R a+rX,go-w on it in the build context first):
#     FROM messagefoundry:<version>
#     COPY config /config
# and set both image: fields below (copy-tls and engine) to it.
#
# Single replica: the default SQLite store is single-writer. For multi-node HA use the Postgres/SQL Server
# store backend + the built leader election (docs/CLUSTERING.md) — out of scope for this baseline manifest.
---
# Headless governing Service for the StatefulSet (stable per-pod DNS: pod-0.mefor-engine.<ns>...).
apiVersion: v1
kind: Service
metadata:
  name: mefor-engine
spec:
  clusterIP: None
  selector:
    app: mefor-engine
  ports:
    - { name: api, port: 8443, targetPort: 8443 }
    - { name: mllp, port: 2575, targetPort: 2575 }
---
# Client-facing Service. NOTE: MLLP is long-lived TCP — for off-cluster partners front it with an L4
# load balancer (NLB), not an L7/HTTP ingress, with a TCP health check + generous idle/dereg timeouts.
apiVersion: v1
kind: Service
metadata:
  name: mefor-engine-client
spec:
  selector:
    app: mefor-engine
  ports:
    - { name: api, port: 8443, targetPort: 8443 }
    - { name: mllp, port: 2575, targetPort: 2575 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mefor-engine
spec:
  serviceName: mefor-engine
  replicas: 1
  selector:
    matchLabels:
      app: mefor-engine
  template:
    metadata:
      labels:
        app: mefor-engine
    spec:
      # Cover engine.stop()'s ordered teardown: ≈10s graph-quiesce + ~5s PER MLLP listener (drained
      # serially) + store-close margin. Raise it for many-listener graphs; also ensure it exceeds the
      # cluster leader-lease TTL so a drained leader releases the lease before SIGKILL.
      terminationGracePeriodSeconds: 40
      # No service-link variables. The engine reads none, and it treats MEFOR_<SECTION>_<KEY> as a
      # setting: a Service named `mefor`, or `mefor-<section>`, in this namespace would otherwise
      # inject names the settings loader refuses at start (docs/CONFIGURATION.md). DNS is unaffected.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # fsGroup makes the store PVC writable by the engine, and lets copy-tls below read the Secret,
        # whose files are root-owned at 0440. The engine never reads its key through this group.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Under enforce the engine refuses a group-readable TLS key, and a Secret volume serves one
      # (docs/PHI.md section 2, *Key files*). copy-tls copies the pair into a memory emptyDir at 0600 as
      # uid 10001, and the engine mounts that, never the Secret. A Secret update reaches the engine at
      # the next pod start. Copy a connection's key file, such as an MLLP tls_key_file, the same way.
      initContainers:
        - name: copy-tls
          image: REPLACE_WITH_YOUR_CONFIG_BAKED_IMAGE   # the same image as the engine below
          command:
            - install
            - "-m"
            - "0600"
            - /etc/mefor/tls-secret/api.crt
            - /etc/mefor/tls-secret/api.key
            - /etc/mefor/tls/
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
          volumeMounts:
            - { name: tls-secret, mountPath: /etc/mefor/tls-secret, readOnly: true }
            - { name: tls, mountPath: /etc/mefor/tls }
      containers:
        - name: engine
          # REPLACE with your config-baked image (FROM messagefoundry:<version>; COPY config /config).
          image: REPLACE_WITH_YOUR_CONFIG_BAKED_IMAGE
          args: ["serve", "--config", "/config", "--env", "prod"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - { name: api, containerPort: 8443 }
            - { name: mllp, containerPort: 2575 }
            # Do NOT expose raw-TCP / X12 ports without TLS. Those listeners are PLAINTEXT-ONLY (no tls=
            # option), but they ARE exposed-gated since PR #558: MLLP, the DICOM C-STORE SCP, HTTP, raw-TCP,
            # and X12 all refuse a non-loopback bind without TLS at startup. For raw-TCP/X12 there is no TLS
            # escape — keep them loopback-bound or front them with a TLS-terminating TCP proxy.
          env:
            - { name: MEFOR_SECURITY_LOCAL_ACCESS_ONLY, value: "false" }
            - { name: MEFOR_SECURITY_LISTEN_ADDRESS, value: "0.0.0.0" }
            - { name: MEFOR_API_PORT, value: "8443" }
            - { name: MEFOR_API_TLS_CERT_FILE, value: "/etc/mefor/tls/api.crt" }
            - { name: MEFOR_API_TLS_KEY_FILE, value: "/etc/mefor/tls/api.key" }
            - { name: MEFOR_INBOUND_BIND_HOST, value: "0.0.0.0" }   # MLLP() must set tls=True (exposure gate)
            - { name: MEFOR_SECURITY_REQUIRE_MFA, value: "true" }       # covers directory accounts too; off + exposed = refused under enforce
            - { name: MEFOR_STORE_REQUIRE_ENCRYPTION, value: "true" }
            - { name: MEFOR_SECURITY_BLOCK_UNLISTED_OUTBOUND, value: "true" } # plus MEFOR_EGRESS_ALLOWED_* for your graph
            # Secrets injected from the Secret as env (never plain manifest values):
            - name: MEFOR_STORE_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: mefor-secrets, key: store-encryption-key } }
            - name: MEFOR_API_TLS_KEY_PASSWORD
              # optional: the pod still starts if the API key is unencrypted and the Secret omits this key.
              valueFrom: { secretKeyRef: { name: mefor-secrets, key: api-tls-key-password, optional: true } }
          volumeMounts:
            - { name: store, mountPath: /var/lib/mefor }   # PHI store (PVC); WAL writes -wal/-shm siblings here
            - { name: tls, mountPath: /etc/mefor/tls, readOnly: true }   # copy-tls's 0600 copies
            - { name: tmp, mountPath: /tmp }               # writable tmpfs for the read-only root fs
          # Liveness only. /health is tokenless + always 200 and answers BEFORE the engine finishes
          # starting — a pure liveness signal, not readiness. There is no unauthenticated readiness
          # endpoint today, so no readinessProbe is wired (one would mark the pod Ready prematurely).
          livenessProbe:
            httpGet: { path: /health, port: 8443, scheme: HTTPS }
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: tls                     # what the engine reads: copy-tls writes it, at 0600
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        - name: tls-secret              # mounted on copy-tls only, never on the engine
          secret:
            secretName: mefor-secrets
            defaultMode: 0440           # root-owned: copy-tls reads it through fsGroup 10001. Never 0644
            items:
              - { key: api.crt, path: api.crt }
              - { key: api.key, path: api.key }
        - name: tmp
          emptyDir: { medium: Memory }
  volumeClaimTemplates:
    - metadata:
        name: store
      spec:
        accessModes: ["ReadWriteOnce"]   # the PHI store MUST persist across restarts (at-least-once invariant)
        resources:
          requests:
            storage: 5Gi

#
# EXAMPLE secret — DO NOT commit real values, and DO NOT paste PEM key material into a git-tracked file.
# Create the Secret out-of-band (sealed-secrets / external-secrets), or with a one-liner that pulls the
# cert/key from local files (never inline). Notes on the literals (kept OUT of the command so it is
# copy-paste-safe — every continued line ends in a backslash with NO trailing inline comment, so nothing
# is silently dropped):
#   - api-tls-key-password: leave "" (or omit the flag) if the API key is unencrypted.
#   - store-password:       REQUIRED ONLY for the HA manifest (external Postgres / SQL Server); omit it for
#                           the single-node SQLite statefulset.yaml.
#   - tls-revocation-attested: your API revocation attestation (docs/SECURITY.md, API revocation gate).
#                           Both manifests require the key; without it the kubelet refuses the
#                           pod (CreateContainerConfigError, at the first container reading it). Set 1 only if your PKI
#                           enforces revocation.
#
#   kubectl create secret generic mefor-secrets \
#     --from-file=api.crt=tls/api.crt \
#     --from-file=api.key=tls/api.key \
#     --from-literal=store-encryption-key="$(messagefoundry gen-key)" \
#     --from-literal=api-tls-key-password="" \
#     --from-literal=store-password="..." \
#     --from-literal=tls-revocation-attested="..."
#
# The store key is base64 of 32 random bytes (mint with `messagefoundry gen-key`). The MLLP key must be
# UNENCRYPTED unless the MLLP() connection sets tls_key_password (env-sourced).
#
# This file holds no TLS file. The keys `api.crt` / `api.key`, consumed by the `tls-secret` volume in
# statefulset.yaml and ha-postgres.yaml (the copy-tls initContainer copies them to 0600 for the
# engine), come only from the `--from-file` flags above, so no key material lands in git.
#
# The tls-revocation-attested value must read as true (1, true, yes or on). A value such as 0
# passes the kubelet, and the revocation-attestation-check initContainer in each manifest then
# exits 1 naming the gate, so the pod stays in Init:CrashLoopBackOff and the engine never starts,
# rather than the engine itself crash-looping. statefulset.yaml's comment on the variable says more.
#
# EVERY VALUE BELOW SHIPS COMMENTED OUT (BACKLOG #5400). Applied unedited, this file creates a
# Secret that holds no key, so the kubelet refuses each pod rather than starting an engine that
# then refuses a placeholder: the tls-secret volume cannot mount without api.crt and api.key
# (FailedMount), and a container reading a missing env key fails with CreateContainerConfigError.
# Uncomment each line you need and give it your own value, or create the Secret with the command
# above instead.
apiVersion: v1
kind: Secret
metadata:
  name: mefor-secrets
type: Opaque
stringData:
  # store-encryption-key: "REPLACE_base64_32_bytes_from_messagefoundry_gen-key"
  # api-tls-key-password is optional in both manifests: omit it if the API key is unencrypted.
  # api-tls-key-password: "REPLACE_or_omit_if_the_api_key_is_unencrypted"
  # store-password is consumed by MEFOR_STORE_PASSWORD, REQUIRED only by the HA manifest
  # (k8s/ha-postgres.yaml) against an external Postgres / SQL Server. Omit it for the single-node
  # SQLite statefulset.yaml (which has no DB password).
  # store-password: "REPLACE_or_omit_for_the_single_node_sqlite_manifest"
  # tls-revocation-attested is consumed by MEFOR_TLS_REVOCATION_ATTESTED in both manifests, and the
  # pod does not start without it. It is your attestation: 1 only if your PKI enforces revocation.
  # tls-revocation-attested: "REPLACE_with_1_only_if_you_attest"

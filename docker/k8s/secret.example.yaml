#
# EXAMPLE secret — DO NOT commit real values, and DO NOT paste PEM key material into a git-tracked file.
# Create the Secret out-of-band (sealed-secrets / external-secrets), or with a one-liner that pulls the
# cert/key from local files (never inline). Notes on the two literals (kept OUT of the command so it is
# copy-paste-safe — every continued line ends in a backslash with NO trailing inline comment, so nothing
# is silently dropped):
#   - api-tls-key-password: leave "" (or omit the flag) if the API key is unencrypted.
#   - store-password:       REQUIRED ONLY for the HA manifest (external Postgres / SQL Server); omit it for
#                           the single-node SQLite statefulset.yaml.
#
#   kubectl create secret generic mefor-secrets \
#     --from-file=api.crt=tls/api.crt \
#     --from-file=api.key=tls/api.key \
#     --from-literal=store-encryption-key="$(messagefoundry gen-key)" \
#     --from-literal=api-tls-key-password="" \
#     --from-literal=store-password="..."
#
# The store key is base64 of 32 random bytes (mint with `messagefoundry gen-key`). The MLLP key must be
# UNENCRYPTED unless the MLLP() connection sets tls_key_password (env-sourced).
#
# The YAML below shows ONLY the two literal values (injected as env vars via secretKeyRef). The mounted
# TLS files (keys `api.crt` / `api.key`, consumed by the `tls-secret` volume in statefulset.yaml and
# ha-postgres.yaml, which the copy-tls initContainer copies to 0600 for the engine) are added via
# the `--from-file` flags above — kept out of this file so no key material lands in git.
#
# This Secret is not the only object you create first. Both manifests also REQUIRE the ConfigMap
# `mefor-revocation-attestation`, key `attested`, for MEFOR_TLS_REVOCATION_ATTESTED; without it the
# kubelet refuses the engine container (CreateContainerConfigError). It is not in this file on purpose:
# it is your revocation attestation (docs/SECURITY.md, API revocation gate), so nothing here writes it.
# Create it only if your PKI enforces revocation for the certificates the engine serves and accepts:
#
#   kubectl create configmap mefor-revocation-attestation --from-literal=attested=1
#
# The value must read as true (1, true, yes or on). A value such as 0 passes the kubelet, and the
# engine then exits 2 at the revocation gate and the pod crash-loops; Kubernetes has no check for it.
# statefulset.yaml's comment on the variable says more.
apiVersion: v1
kind: Secret
metadata:
  name: mefor-secrets
type: Opaque
stringData:
  store-encryption-key: "REPLACE_base64_32_bytes_from_messagefoundry_gen-key"
  api-tls-key-password: "REPLACE_or_omit_if_the_api_key_is_unencrypted"
  # store-password is consumed by MEFOR_STORE_PASSWORD — REQUIRED only by the HA manifest
  # (k8s/ha-postgres.yaml) against an external Postgres / SQL Server. Omit it for the single-node
  # SQLite statefulset.yaml (which has no DB password).
  store-password: "REPLACE_or_omit_for_the_single_node_sqlite_manifest"

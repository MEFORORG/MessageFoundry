# SPDX-License-Identifier: AGPL-3.0-or-later
# Copyright (C) 2026 MessageFoundry Foundation, LLC and contributors
#
# Topology A — in-process TLS (the default shipped posture; see docs/CONTAINER-EXPOSURE-EVALUATION.md).
# The engine terminates TLS itself (WP-13a) on 8443 and runs MLLP-over-TLS (WP-13b) on 2575. This is a
# TEMPLATE: supply your own cert/key, store-encryption key, and an adopter config repo. Read
# docker/README.md before running in anger — especially the config-OWNERSHIP requirement and the
# "secrets via env are visible in `docker inspect`" caveat.
# NOT A SUPPORTED V1 DEPLOYMENT (the image runs Linux). See
# docs/SYSTEM-REQUIREMENTS.md, "Linux is not a supported v1 deployment target".

# The API revocation attestation every serving engine below needs, as a required compose
# substitution with no default. The default `engine` service's comment says why; this key only
# holds the value once so every service that reads it, at least the three engines and the two
# revocation-attestation-check services, aliases one copy.
# The required substitutions in this file, at least this one and the Postgres password, read the
# same sources, and their messages name them in the same words. Supply them from one place:
# --env-file replaces the .env beside compose.yaml, so a value kept in that .env goes unread once
# you pass it.
x-revocation-attested: &revocation-attested "${MEFOR_TLS_REVOCATION_ATTESTED:?required. serve refuses in-process TLS off loopback until you attest that your PKI enforces revocation for the certificates the engine serves and accepts (docs/SECURITY.md, API revocation gate). Set it to 1 only if that holds. Compose SUBSTITUTION reads at least the shell environment and the project .env, the .env beside compose.yaml unless --project-directory moves it; passing --env-file reads the named file INSTEAD of that .env -- an env_file: does NOT feed it}"

# The default engine's image, named once: the revocation-attestation-check service must run the
# same image as that engine so it reads the value with the same parser. Change it here, for example to
# messagefoundry:sqlserver or a config-baked derived image. It does NOT set the `ha` engines'
# image: x-ha-engine-image below names theirs.
x-engine-image: &engine-image messagefoundry:latest

# The `ha` engines' image, the runtime-postgres variant, named once for the same reason: the
# revocation-attestation-check-ha service must run it too. Change it here, never on one service.
x-ha-engine-image: &ha-engine-image messagefoundry:postgres

# The one-shot attestation check, every key but the image and profile, held once so the two check
# services below run the same command with the same hardening. The revocation-attestation-check
# service's comment says what it does and which commands skip it.
x-revocation-attestation-check: &revocation-attestation-check
  entrypoint:
    - "tini"
    - "--"
    - "/opt/venv/bin/python"
    - "-I"
    - "-X"
    - "disable-remote-debug"
    - "-B"
    - "-c"
    - "import sys; from messagefoundry.config.tls_policy import TLS_REVOCATION_ATTESTED_ENV as V, tls_revocation_attested as ok; sys.exit(0 if ok() else 'error: refusing to start the containers this check gates: ' + V + ' does not read as true, so serve would refuse in-process TLS off loopback and restart forever (docs/SECURITY.md, API revocation gate). Set it to 1 only if your PKI enforces revocation for the certificates the engine serves and accepts.')"
  environment:
    MEFOR_TLS_REVOCATION_ATTESTED: *revocation-attested
  network_mode: none
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  # The image HEALTHCHECK probes the engine API, which this one-shot never serves.
  healthcheck:
    disable: true
  restart: "no"

# Shared config for the `ha`-profile clustered-engine PAIR (engine-ha + engine-standby), top-level
# extension keys (`x-*`) so the two stay byte-identical (ADR 0017). These are NOT services — Compose
# ignores `x-` keys. They are merged into the two services below via the `<<:` merge key.
x-ha-engine: &ha-engine
  profiles: ["ha"]
  # The Postgres variant: the slim *engine-image above carries no asyncpg, so the Postgres store
  # below could not open on it. Build it from the repository root with:
  #   docker build -f docker/Dockerfile --target runtime-postgres -t messagefoundry:postgres .
  # So the x-engine-image anchor above does NOT set these engines' image; x-ha-engine-image does,
  # and revocation-attestation-check-ha runs the same one, so it reads the attestation with the
  # parser these engines run.
  image: *ha-engine-image
  depends_on:
    postgres:
      condition: service_healthy
    schema-provision:
      condition: service_completed_successfully
    revocation-attestation-check-ha:
      condition: service_completed_successfully
  command: ["serve", "--config", "/config", "--env", "prod"]
  env_file:
    - path: ./secrets.env
      required: false
  volumes:
    - &ha-config-mount ./config:/config:ro
    - &ha-tls-mount ./tls:/etc/mefor/tls:ro
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 40s    # > leader_lease_ttl (30s) so a drained leader releases its lease (ADR 0047)
  restart: unless-stopped

x-ha-engine-env: &ha-engine-env
  MEFOR_SECURITY_LOCAL_ACCESS_ONLY: "false"
  MEFOR_SECURITY_LISTEN_ADDRESS: "0.0.0.0"
  MEFOR_API_PORT: "8443"
  MEFOR_API_TLS_CERT_FILE: "/etc/mefor/tls/api.crt"
  MEFOR_API_TLS_KEY_FILE: "/etc/mefor/tls/api.key"
  # The API revocation attestation (x-revocation-attested above; the default `engine` says why).
  MEFOR_TLS_REVOCATION_ATTESTED: *revocation-attested
  MEFOR_INBOUND_BIND_HOST: "0.0.0.0"
  MEFOR_SECURITY_REQUIRE_MFA: "true"
  MEFOR_STORE_REQUIRE_ENCRYPTION: "true"  # keeps the default keyless refusal past the audited opt-out (docs/PHI.md section 3)
  MEFOR_SECURITY_BLOCK_UNLISTED_OUTBOUND: "true"
  # HA: shared external Postgres + active-passive cluster (SQLite is REFUSED under [cluster]).
  MEFOR_STORE_BACKEND: "postgres"
  MEFOR_STORE_SERVER: "postgres"
  MEFOR_STORE_PORT: "5432"
  MEFOR_STORE_DATABASE: "messagefoundry"
  MEFOR_STORE_USERNAME: "mefor"
  MEFOR_STORE_POOL_SIZE: "40"         # default (ADR 0062); >= 2 required under [cluster]
  MEFOR_CLUSTER_ENABLED: "true"
  # The store hop is verified TLS at every posture: the engine refuses a store login over
  # encrypt=false or trust_server_certificate=true, and no escape lifts that (vault BACKLOG #3533
  # item 2), so this file sets no MEFOR_ALLOW_INSECURE_TLS. The local Postgres below serves the
  # certificate in ./pg-tls (its comment says what it must hold), and the engines pin the CA that
  # issued it. The store CRL an enforcing start needs (below) must come from that CA, so a CA
  # whose key usage includes cRLSign, not the server certificate itself. Put the pin under ./config/pki/,
  # owned as ./config is, so no other account can replace it: the store login trusts the file
  # before serve's preflight checks its owner, and `store provision-schema` never checks it. A
  # managed Postgres whose certificate the system trust store already verifies needs no pin:
  # remove this line.
  MEFOR_STORE_SSL_ROOT_CERT: "/config/pki/store-ca.pem"
  # DEV-ONLY: the local Postgres image makes POSTGRES_USER a SUPERUSER, and the engines log in as it.
  # Under the shipped enforce dial an over-granted store login refuses to start (ADR 0199), so this
  # accepts it, audited. A real deployment gives the engines a row-only role (docs/DEPLOY-SERVER-DB.md
  # §1.2) and removes this line.
  MEFOR_SECURITY_ALLOW_OVER_GRANTED_STORE_PRINCIPAL: "true"
  # --- what an enforcing start needs (BACKLOG #5400) ---
  # [security].enforcement defaults to enforce and nothing here lowers it, as in the k8s
  # manifests. As shipped, serve REFUSES to start: the inputs below are commented out, because
  # a placeholder value would pass these gates and start an engine whose notices and logs go
  # nowhere. Uncomment each line and give it your own value. At least these gates read them;
  # serve's refusal message names any other one your config trips.
  # Security notices and credential reminders (ASVS 6.3.5/6.3.7/6.4.5): an SMTP relay, a
  # sender and a recipient. The relay hop verifies its certificate by default.
  # MEFOR_ALERTS_EMAIL_SMTP_HOST: "REPLACE-smtp.example.org"
  # MEFOR_ALERTS_SMTP_ALLOWED_HOSTS: "REPLACE-smtp.example.org"
  # MEFOR_ALERTS_EMAIL_FROM: "REPLACE-mefor@example.org"
  # MEFOR_ALERTS_EMAIL_TO: "REPLACE-mefor-ops@example.org"
  # Off-box log forwarding: verified TLS to a collector that is not this host (ADR 0200), on
  # the egress allowlist block_unlisted_outbound requires. Put the CA and CRL under
  # ./config/pki/, owned as ./config is, because the engine refuses a CA another account could
  # replace. Replace the CRL before its nextUpdate.
  # MEFOR_LOGGING_FORWARD_HOST: "REPLACE-siem.example.org"
  # MEFOR_LOGGING_FORWARD_PORT: "6514"
  # MEFOR_LOGGING_FORWARD_PROTOCOL: "tls"
  # MEFOR_LOGGING_FORWARD_TLS_CA_FILE: "/config/pki/syslog-ca.pem"
  # MEFOR_LOGGING_FORWARD_TLS_CRL_FILE: "/config/pki/syslog-crl.pem"
  # MEFOR_EGRESS_ALLOWED_SYSLOG: "REPLACE-siem.example.org"
  # Retention bounds (ASVS 14.2.7). The message-body and dead-letter windows default on;
  # these two tiers need a window or an acknowledgement, and both are your decision. For
  # transform state the gate names the acknowledgement as the safe answer: a window deletes
  # it by write time, while a Handler may still be using it.
  # MEFOR_RETENTION_SEARCH_PRESET_DAYS: "REPLACE-days"
  # MEFOR_SECURITY_ALLOW_KEEPING_TRANSFORM_STATE_INDEFINITELY: "true"
  # The store hop checks revocation: under enforce, a verified Postgres hop with no CRL
  # refuses at store open. That includes the local Postgres below, which serves TLS. The CRL
  # must come from the CA the store pin names. Postgres only: a SQL Server store refuses
  # this setting at load.
  # MEFOR_STORE_SSL_CRL_FILE: "/config/pki/store-crl.pem"
  # The log spool (ADR 0200) defaults to log-spool beside the store path, /var/lib/mefor, and
  # the root file system is read-only, so engine-ha and engine-standby each mount their own
  # named volume there (mefor-spool-ha, mefor-spool-standby). Never one shared volume: the spool
  # locks its directory, so the second engine would run without one.

services:
  engine:
    # Build locally:  docker build -f docker/Dockerfile -t messagefoundry:latest ..
    # The image is set once, in x-engine-image at the top, so the attestation check runs it too.
    # (Use messagefoundry:sqlserver — built with `--target runtime-sqlserver` — for the SQL Server
    # store or the DATABASE/db_lookup connectors.)
    image: *engine-image

    # serve loads the config modules from /config and runs the 'prod' environment (production posture:
    # PHI-at-rest fail-closed, deny-by-default egress, MFA on for every account). env() value files resolve
    # under /config/environments/ (MEFOR_ENVIRONMENTS_BASE_DIR is /config in the image).
    command: ["serve", "--config", "/config", "--env", "prod"]

    environment:
      # --- exposure (Topology A) ---
      MEFOR_SECURITY_LOCAL_ACCESS_ONLY: "false"
      MEFOR_SECURITY_LISTEN_ADDRESS: "0.0.0.0"        # off-loopback in the container so the published port is reachable
      MEFOR_API_PORT: "8443"
      MEFOR_API_TLS_CERT_FILE: "/etc/mefor/tls/api.crt"   # paths (not secrets) — mounted read-only below
      MEFOR_API_TLS_KEY_FILE: "/etc/mefor/tls/api.key"
      # Off loopback, serve refuses this in-process certificate bind until you attest revocation
      # (docs/SECURITY.md, API revocation gate), and nothing but a loopback bind clears that gate
      # otherwise; a container cannot bind loopback and still be reached on a published port. So
      # this variable is REQUIRED, with NO DEFAULT: unset or empty, every `docker compose` command
      # (up, down, logs, config) refuses at load, rather than the engine exiting 2 and restarting
      # forever. A false value, such as 0, is caught by the revocation-attestation-check service
      # below instead. Set 1 only if you attest. Without an attestation, run a command that starts
      # no engine as MEFOR_TLS_REVOCATION_ATTESTED=0 docker compose down, never with 1 exported;
      # that service's comment says which commands it does not stop.
      # The attestation is yours, so this file never writes it. Outbound hops read the same
      # variable with a different effect (docs/DEPLOYMENT.md, "Revocation-guard behavior"). Like
      # the Postgres password below, this is COMPOSE SUBSTITUTION.
      MEFOR_TLS_REVOCATION_ATTESTED: *revocation-attested
      MEFOR_INBOUND_BIND_HOST: "0.0.0.0"   # MLLP listener off-loopback; each MLLP() MUST set tls=True (gate)
      # --- production guardrails ---
      MEFOR_SECURITY_REQUIRE_MFA: "true"        # the default; covers directory accounts too. Off + exposed = refused under enforce
      MEFOR_STORE_REQUIRE_ENCRYPTION: "true"  # keeps the default keyless refusal past the audited opt-out (docs/PHI.md section 3)
      # --- what an enforcing start needs (BACKLOG #5400) ---
      # As shipped, serve REFUSES to start. Uncomment each line below with your own value; serve
      # may still refuse an input this block does not name. x-ha-engine-env above says why they
      # ship commented and what each group is for.
      # MEFOR_ALERTS_EMAIL_SMTP_HOST: "REPLACE-smtp.example.org"
      # MEFOR_ALERTS_SMTP_ALLOWED_HOSTS: "REPLACE-smtp.example.org"
      # MEFOR_ALERTS_EMAIL_FROM: "REPLACE-mefor@example.org"
      # MEFOR_ALERTS_EMAIL_TO: "REPLACE-mefor-ops@example.org"
      # MEFOR_LOGGING_FORWARD_HOST: "REPLACE-siem.example.org"
      # MEFOR_LOGGING_FORWARD_PORT: "6514"
      # MEFOR_LOGGING_FORWARD_PROTOCOL: "tls"
      # MEFOR_LOGGING_FORWARD_TLS_CA_FILE: "/config/pki/syslog-ca.pem"
      # MEFOR_LOGGING_FORWARD_TLS_CRL_FILE: "/config/pki/syslog-crl.pem"
      # MEFOR_EGRESS_ALLOWED_SYSLOG: "REPLACE-siem.example.org"
      # MEFOR_RETENTION_SEARCH_PRESET_DAYS: "REPLACE-days"
      # MEFOR_SECURITY_ALLOW_KEEPING_TRANSFORM_STATE_INDEFINITELY: "true"
      # The log spool (ADR 0200) defaults to log-spool beside the store, on the mefor-store
      # volume.
      # --- deny-by-default egress (prod posture) — list YOUR graph's outbound destinations ---
      MEFOR_SECURITY_BLOCK_UNLISTED_OUTBOUND: "true"
      # MEFOR_EGRESS_ALLOWED_MLLP: "partner-a.example.org:6661"
      # MEFOR_EGRESS_ALLOWED_FILE_DIRS: "/var/lib/mefor/out"
      # NOTE: never set MEFOR_ALLOW_INSECURE_TLS here. It is a dev / trusted-lab switch: at
      # [security].enforcement = warn it permits weakened hops that would otherwise be refused
      # (docs/DEPLOYMENT.md, "The MEFOR_ALLOW_INSECURE_TLS escape hatch").
      # --- secrets directory (optional; see the ./secrets volume below). A path, not a secret ---
      # MEFOR_SECRETS_DIRECTORY: "/run/mefor/secrets"

    # Secrets via env_file (gitignored). Each line: MEFOR_STORE_ENCRYPTION_KEY=..., MEFOR_API_TLS_KEY_PASSWORD=...
    # Plain env is visible in `docker inspect` + image-less but on the host — for stricter handling use a
    # secrets manager or the k8s manifests (secretKeyRef). Mint the store key with `messagefoundry gen-key`;
    # through compose, before you attest, run it as
    #     MEFOR_TLS_REVOCATION_ATTESTED=0 docker compose run --rm --no-deps engine gen-key
    # since without --no-deps the revocation-attestation-check service runs first and refuses 0.
    env_file:
      - path: ./secrets.env       # copy docker/secrets.env.example -> docker/secrets.env and fill it in
        required: false

    ports:
      - "8443:8443"     # API + WSS (TLS)
      - "2575:2575"     # MLLP data plane (MLLP-over-TLS)
      # Do NOT publish raw-TCP / X12 ports without TLS. Those listeners are PLAINTEXT-ONLY (no tls=
      # option), but they ARE exposed-gated since PR #558: MLLP, the DICOM C-STORE SCP, HTTP, raw-TCP,
      # and X12 all refuse a non-loopback bind without TLS at startup (check_mllp_/dimse_/http_/tcp_
      # tls_exposure). For raw-TCP/X12 there is no TLS escape — bind loopback or front with a TLS proxy.

    volumes:
      # PHI store — a NAMED VOLUME (never the ephemeral layer) so at-least-once survives restarts. WAL
      # writes -wal/-shm siblings, so this must be the writable DIRECTORY that holds messagefoundry.db.
      - mefor-store:/var/lib/mefor
      # Adopter config repo, READ-ONLY. It must be owned by root or uid 10001 and NOT group/world-writable,
      # or the engine refuses to load it (it executes the *.py as the service account). Root-owned is the
      # safer choice, since the engine's own account cannot rewrite it. On Linux:
      #   chmod -R a+rX,go-w ./config && sudo chown -R root:root ./config
      # The robust production alternative is to BAKE config into a derived image (see docker/README.md);
      # a Docker-Desktop-on-Windows bind mount surfaces as 0o777 and will be refused. A Docker Desktop
      # for Mac bind mount reports an owner and mode the Mac does not enforce, and the config check
      # reads those bits, so a pass there does not show the config is protected. Bake it there too
      # (docker/README.md).
      - ./config:/config:ro
      # TLS material, read-only. The MLLP key must be UNENCRYPTED unless the MLLP() sets tls_key_password
      # (env-sourced); the API key may be encrypted (MEFOR_API_TLS_KEY_PASSWORD).
      # A bind mount keeps the host's owner and mode, and under the default enforce the engine refuses
      # a group-readable key file (docs/PHI.md section 2, *Key files*). So own every file here, a
      # certificate PEM that holds its key included, by uid 10001 at mode 0600, and again after each
      # rotation. The `ha` engines below mount the same directory. On Linux:
      #   sudo chown -R 10001:10001 ./tls && sudo find ./tls -type f -exec chmod 0600 {} + && sudo chmod 0700 ./tls
      # Under rootless Docker, Podman or userns-remap, chown to the host uid that container uid 10001
      # maps to instead. A Docker-Desktop-on-Windows bind mount surfaces as 0o777 and would be
      # refused, as config is. A Docker Desktop for Mac bind mount of a key file in ./tls is refused
      # too, where it surfaces as a mount of a type the key-file check refuses (docker/README.md
      # names at least some): the owner and mode bits do not decide who reaches the file there, so
      # chown and chmod on the Mac do not clear it.
      # There, mount a named volume at /etc/mefor/tls in place of ./tls (on this service and the
      # `ha` engines), filled and owned inside Docker's Linux VM, for example:
      #   docker volume create mefor-tls
      #   docker run --rm --network none --user 0 --entrypoint sh --mount type=bind,src="$PWD/tls",dst=/src,readonly -v mefor-tls:/dst messagefoundry:latest -c 'mkdir /tmp/n && cp -RL /src/. /tmp/n/ && find /dst -mindepth 1 -delete && cp -R /tmp/n/. /dst/ && chown -R 10001:10001 /dst && chmod 0700 /dst && find /dst -type f -exec chmod 0600 {} +'
      # run from the directory that holds ./tls, using the engine image built above, and declare
      # mefor-tls under the top-level volumes: as external: true. --mount refuses a missing ./tls.
      # -L copies the file a link names where that file is inside ./tls; a link that leaves ./tls
      # fails the copy, and the volume is emptied only after the copy succeeds, so a retired key
      # does not stay in it and a failed copy keeps the old keys. Run it again after each rotation.
      - ./tls:/etc/mefor/tls:ro
      # OPTIONAL secrets directory (vault BACKLOG #2595, ADR 0214), an alternative to env_file for
      # the engine's own secret settings other than the store key, and env() values: one file per
      # setting, named as its variable (for example MEFOR_API_TLS_KEY_PASSWORD), which wins over the
      # variable. docs/CONFIGURATION.md lists what it supplies. Uncomment this line and the
      # MEFOR_SECRETS_DIRECTORY line under environment. The engine refuses a directory or file with a
      # group or other read or write bit, and a bind mount keeps the host's modes, so own it as ./tls
      # is owned, the directory 0700 and each file 0600. On Linux:
      #   sudo chown -R 10001:10001 ./secrets && sudo chmod 0700 ./secrets && sudo find ./secrets -type f -exec chmod 0600 {} +
      # A Docker Desktop for Mac bind mount of ./secrets is refused too, at least where it surfaces
      # as a mount of a type the check refuses, as for ./tls; use a named volume filled the same way.
      # docs/CONFIGURATION.md "The secrets directory" holds the rules.
      # - ./secrets:/run/mefor/secrets:ro

    # Hardening: non-root is the image default (uid 10001); lock the rest down.
    read_only: true            # root fs read-only; the store volume + tmpfs below are the only writable paths
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Cover the ordered teardown: graph quiesce ≈10s + ~5s PER MLLP listener (drained serially) +
    # store.close margin, so `docker stop` lets engine.stop() finish instead of being SIGKILLed. Raise
    # this for many-listener graphs (the per-listener drains are additive, not bounded).
    stop_grace_period: 30s

    depends_on:
      revocation-attestation-check:
        condition: service_completed_successfully

    restart: unless-stopped
    # The image HEALTHCHECK is a SINGLE https arm, `https://127.0.0.1:${MEFOR_API_PORT}/health` with -k
    # (BACKLOG #1179). MEFOR_API_PORT is 8443 here, so it probes 8443. There is no cleartext fallback:
    # a container whose TLS is broken now reports unhealthy instead of downgrading to http.

  # One-shot check that the attestation reads as TRUE. An `up` without `--no-deps`, with or without
  # the ha profile, runs it before it starts the default engine, and runs
  # revocation-attestation-check-ha below before it starts an `ha` engine; at least the commands
  # listed below skip them. The required substitution above refuses only an unset or empty value,
  # and a value the engine reads as false, such as 0, would otherwise start an engine that exits 2
  # at the revocation gate and restarts forever. This reads the value with serve's own parser
  # (tls_revocation_attested), in the same image, exits 1 naming the gate when it does not read as
  # true, and an `up` without `--no-deps` stops there. It does not read the bind, so it refuses a
  # false value even where serve's gate would not apply. It has no profile, so it runs for the
  # default engine under any profile; the `ha` engines run another image and wait instead on
  # revocation-attestation-check-ha below, the same check in their image. down and logs never run
  # either, which keeps the =0 path above working.
  # `docker compose run` of an engine service, for an admin command such as gen-key, does run it.
  # At least two commands skip it: `docker compose run --no-deps` and
  # `docker compose up --no-deps <engine>`. The second starts that engine with no check, so a false
  # value there would exit 2 and restart forever; never use it to start a serving engine. It writes
  # nothing and needs no network.
  revocation-attestation-check:
    <<: *revocation-attestation-check
    image: *engine-image

  # The same one-shot check in the `ha` engines' image, so they read the attestation with their own
  # parser and the ha pair alone never needs the default image built. Its profile keeps a plain `up`
  # from pulling an image a default-only user never built. The notes above on the commands that
  # skip a check, and on down and logs, apply to it too.
  revocation-attestation-check-ha:
    <<: *revocation-attestation-check
    profiles: ["ha"]
    image: *ha-engine-image

  # --- Multi-node-ready local HA backend (OPT-IN; profile "ha") ------------------------------------
  # A local Postgres + a PAIR of clustered engines so you can exercise the ACTIVE-PASSIVE HA shape
  # (docs/CLUSTERING.md, ADR 0047) on one host before deploying the k8s/ha-postgres.yaml manifest against a
  # managed Postgres. It is gated behind the `ha` PROFILE, so the DEFAULT `docker compose up` is UNCHANGED
  # (single-node SQLite engine, no Postgres, no cluster). Bring HA up with:  docker compose --profile ha up
  # The default `engine` has no profile, so that command starts it too, running the same /config graph
  # on its own store. To run the pair alone, name the services:
  #   docker compose --profile ha up postgres schema-provision engine-ha engine-standby
  #
  # IMPORTANT — the failover demo is the PAIR `engine-ha` + `engine-standby`, NOT the default `engine`.
  # The default `engine` service stays single-node SQLite (no cluster env) so `docker compose up` is
  # unchanged; it is NOT part of the cluster and stopping it does nothing to leadership. The two `ha`-profile
  # engines below BOTH join the shared Postgres cluster and share ONE leader lease — that is what makes
  # "stop one, watch the other promote" actually true.
  #
  # This is a LOCAL DEV convenience, not a production DB: a single Postgres container is itself a SPOF
  # (no DB-tier HA) — for real HA point [store] at a managed/replicated Postgres (RDS / Cloud SQL /
  # Azure DB) with a CA-trusted cert, per docs/CLOUD-DEPLOYMENT.md.
  postgres:
    profiles: ["ha"]
    image: postgres:16
    # TLS from your certificate and key in ./pg-tls (server.crt, server.key), mounted read-only.
    # The engines verify it, host name included (x-ha-engine-env, MEFOR_STORE_SSL_ROOT_CERT), so
    # the certificate must name the host `postgres`. Postgres refuses a key file with group or
    # other bits wider than it allows, and a bind mount keeps the host's owner and mode: own the
    # key by the image's postgres account, uid 999, at 0600, or by root with group 999 at 0640.
    # The key must be UNENCRYPTED: this command sets no ssl_passphrase_command.
    # Either way the host account or group with that number can read it. On Linux:
    #   sudo chown -R 999:999 ./pg-tls && sudo chmod 0600 ./pg-tls/server.key
    # Under rootless Docker, Podman or userns-remap, chown to the host uid that container uid 999
    # maps to instead. A Docker-Desktop-on-Windows bind mount surfaces as 0o777 and is refused.
    # Without them Postgres does not start, so no ha engine does. The entrypoint below checks
    # them first and exits naming what is wrong, before the image's own entrypoint runs: at
    # least a missing or empty file, an encrypted key, a key whose owner or mode Postgres
    # refuses, and a file the postgres account cannot read. A start it refuses initializes
    # nothing, so fix the files and start again (`docker compose logs postgres` shows why).
    # The check is not Postgres's own, and a file Postgres refuses for another reason passes
    # it, at least a key that does not match the certificate and a file that is not PEM. That
    # start still initializes the mefor-pg volume without creating the messagefoundry
    # database. The health check then never passes, because it queries that database, so no
    # engine starts against it. Recover by removing that one volume, never `down -v`, which
    # also removes the default engine's store: docker compose --profile ha down, then
    #   docker volume rm <project>_mefor-pg
    # This server still accepts a plaintext session from another client on the compose network;
    # the engines never open one.
    # Reads the certificate and key paths from the command's ssl_cert_file and ssl_key_file, so
    # the check reads the files the server is told to load, and reads the key's owner and mode
    # as the postgres account, as the server does. A command that does not start the server,
    # such as `docker compose run postgres psql ...` or `postgres -V`, goes straight to the
    # image's entrypoint, as it did before. `$$` is a literal `$` to compose.
    entrypoint:
      - "sh"
      - "-c"
      - |
        set -eu
        die() { echo "error: refusing to start Postgres before the image's entrypoint runs: $$*. The postgres service's comment in docker/compose.yaml says what ./pg-tls and the command must hold." >&2; exit 1; }
        case "$${1:-}" in
          postgres|-*|"") ;;
          *) exec docker-entrypoint.sh "$$@" ;;
        esac
        crt=; key=; pass=
        for a in "$$@"; do
          case "$$a" in
            -V|--version|--help|-\?|-C|--describe-config) exec docker-entrypoint.sh "$$@" ;;
            ssl_cert_file=*|--ssl_cert_file=*|--ssl-cert-file=*) crt="$${a#*=}" ;;
            ssl_key_file=*|--ssl_key_file=*|--ssl-key-file=*) key="$${a#*=}" ;;
            ssl_passphrase_command=*|--ssl_passphrase_command=*|--ssl-passphrase-command=*) pass=1 ;;
          esac
        done
        [ -n "$$crt" ] && [ -n "$$key" ] || die "the command names no ssl_cert_file or no ssl_key_file"
        for f in "$$crt" "$$key"; do
          [ -f "$$f" ] && [ -s "$$f" ] || die "$$f is missing or empty"
          gosu postgres test -r "$$f" || die "the postgres account cannot read $$f"
        done
        pg=$$(id -u postgres) || die "the image has no postgres account"
        st=$$(gosu postgres stat -L -c '%u %a' "$$key") || die "the postgres account cannot stat $$key"
        owner=$${st% *}; mode=$${st#* }
        if [ "$$owner" = "$$pg" ]; then
          bad=$$(( 0$$mode & 077 ))
        elif [ "$$owner" = 0 ]; then
          bad=$$(( 0$$mode & 037 ))
        else
          die "$$key is owned by uid $$owner, neither the postgres account ($$pg) nor root"
        fi
        [ "$$bad" -eq 0 ] || die "$$key has mode $$mode, wider than Postgres allows for its owner: at most 0600 owned by uid $$pg, or 0640 owned by root"
        if [ -z "$$pass" ]; then
          rc=0
          gosu postgres grep -q ENCRYPTED "$$key" || rc=$$?
          [ "$$rc" -ne 0 ] || die "$$key is encrypted, and the command sets no ssl_passphrase_command"
          [ "$$rc" -eq 1 ] || die "the postgres account cannot read $$key"
        fi
        exec docker-entrypoint.sh "$$@"
      - "pg-tls-check"
    command:
      - "postgres"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/etc/postgresql/tls/server.crt"
      - "-c"
      - "ssl_key_file=/etc/postgresql/tls/server.key"
    environment:
      POSTGRES_DB: messagefoundry
      POSTGRES_USER: mefor
      # NO DEFAULT, DELIBERATELY (BACKLOG #1091). A `:-` fallback SHIPS its literal the moment the
      # variable is unset, and the two required secret gates cannot see it -- bandit does not parse
      # yaml, gitleaks' generic rule is entropy-gated. NOTE this is COMPOSE SUBSTITUTION, which is a
      # different mechanism from the `env_file:` the other services use: env_file sets variables
      # INSIDE the container and does not feed substitution at all.
      POSTGRES_PASSWORD: "${MEFOR_STORE_PASSWORD:?required. Compose SUBSTITUTION reads at least the shell environment and the project .env, the .env beside compose.yaml unless --project-directory moves it; passing --env-file reads the named file INSTEAD of that .env -- an env_file: does NOT feed it}"
    volumes:
      - mefor-pg:/var/lib/postgresql/data
      - ./pg-tls:/etc/postgresql/tls:ro
    # Over TCP, not the Unix socket: during initialization the image runs a temporary server on
    # the socket alone, which a socket probe reports ready. The query also fails when the
    # messagefoundry database is missing, which pg_isready alone does not see. The image trusts
    # a 127.0.0.1 login, so the probe needs no password. The probe fails for the whole first
    # initialization, so start_period keeps those failures from counting toward retries.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mefor -d messagefoundry && psql -h 127.0.0.1 -U mefor -d messagefoundry -XtAqc 'select 1' >/dev/null"]
      start_period: 120s
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot schema provisioning (BACKLOG #305). On a server DB [store].schema_management defaults to
  # "external": `serve` runs no schema DDL and refuses to start until `messagefoundry store provision-schema`
  # has built the schema. This service runs it once and exits; both engines wait for it to finish.
  # It is safe to re-run. LOCAL DEV SHORTCUT: here the one dev role does both jobs. A real deployment
  # runs this as a separate DDL-capable role and gives the engines a row-only role
  # (docs/DEPLOY-SERVER-DB.md §1.2, posture B).
  schema-provision:
    <<: *ha-engine
    depends_on:
      postgres:
        condition: service_healthy
    command: ["store", "provision-schema"]
    environment:
      <<: *ha-engine-env
    restart: "no"

  # TWO clustered engines that BOTH join the shared Postgres and share ONE leader lease — this is the real
  # active-passive PAIR. The engine GRAPH SUPERVISOR runs the listeners/workers on whichever one currently
  # holds the lease (the LEADER); the other is a WARM STANDBY that binds nothing. Stop the leader and the
  # standby is promoted within ≈ one heartbeat and binds the listeners — genuine failover, because they
  # share a store and a lease (the default `engine` service shares NEITHER, so it is not in this picture).
  #
  # NOTE on ports: a single host cannot publish one port twice, and the default `engine` has no profile,
  # so it runs beside this pair under --profile ha and already owns host 8443 and 2575. So only
  # `engine-ha` publishes the MLLP port, on host port 2578 (the container still listens on 2575).
  # When `engine-ha` is the leader, MLLP works through host port 2578; when it is the standby its
  # listener is closed (connection refused on 2578) and the leader is `engine-standby`, reachable on the
  # container network but not via the host-published port. That host-port asymmetry is a single-host
  # docker limitation only — in k8s the L4 LB's primary-only health check moves the VIP to whichever pod is
  # the leader (docs/CLOUD-DEPLOYMENT.md §3). For a clean local failover demo, hit `engine-ha` first, then
  # `docker compose stop engine-ha` and watch `engine-standby` take the lease (GET /cluster/status role).
  #
  # Clustered engine #1 — publishes the MLLP host port; leader at start (first to claim the lease).
  # (The shared *ha-engine / *ha-engine-env anchors are defined at the top of this file.)
  engine-ha:
    <<: *ha-engine
    environment:
      <<: *ha-engine-env
    # The anchor's volumes plus this engine's own log-spool volume (x-ha-engine-env says why). A
    # service's volumes replace the anchor's, so the first two alias its entries. Do not --scale
    # it; engine-standby's note says why.
    volumes:
      - *ha-config-mount
      - *ha-tls-mount
      - mefor-spool-ha:/var/lib/mefor
    ports:
      - "8444:8443"     # API on a distinct host port (the default `engine` already owns 8443)
      - "2578:2575"     # MLLP on a distinct host port (the default `engine` already owns 2575); leader only

  # Clustered engine #2 — same image + config + cluster; the warm standby (or leader after a failover).
  # Publishes only its API on a distinct host port; it publishes no MLLP port (engine-ha owns host 2578).
  engine-standby:
    <<: *ha-engine
    environment:
      <<: *ha-engine-env
    # The anchor's volumes plus this engine's own log-spool volume (x-ha-engine-env says why). A
    # service's volumes replace the anchor's, so the first two alias its entries.
    # `--scale` above 1 is UNSUPPORTED here and on engine-ha: the fixed host ports refuse a second
    # replica, and without them every replica would mount the service's one named spool volume, so
    # all but one would run without a spool. Add another engine as its own service, with its own
    # spool volume and host ports, instead.
    volumes:
      - *ha-config-mount
      - *ha-tls-mount
      - mefor-spool-standby:/var/lib/mefor
    ports:
      - "8445:8443"     # API only; MLLP is reachable on the container network, not a host port, here

volumes:
  mefor-store:
  mefor-pg:
  mefor-spool-ha:
  mefor-spool-standby:

# so pip installs none of them anywhere else. It is yours now. To move a pin, regenerate it for the
# job's runner and keep pip-audit's version:
#   echo pip-audit==2.10.1 | uv pip compile --generate-hashes --python-platform windows --python-version 3.14 - -o requirements-audit.lock

[[hooks.SessionEnd.hooks]]
type = "command"
command = '''pwsh -NoProfile -NonInteractive -Command "& (Join-Path (git rev-parse --show-toplevel) 'scripts/codex/invoke.ps1') hook --event SessionEnd"'''
timeout = 90


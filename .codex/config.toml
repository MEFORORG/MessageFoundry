# Claude Code remains the source of hook policy. The bridge reads it on each event.
# Each command names its event, so a launcher failure that leaves no decision blocks on
# PreToolUse (the inner exit 2) and is a non-blocking 1 elsewhere. The trailing exit passes
# the code on where PowerShell runs the line, since pwsh -Command reports a native exit 2 as 1;
# under sh it exits with pwsh's status, and under cmd pwsh receives it as more -Command text.
# docs/CODEX.md, "Who decides a block", states the rule.
[features]
hooks = true

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = '''pwsh -NoProfile -NonInteractive -Command "& (Join-Path (git rev-parse --show-toplevel) 'scripts/codex/invoke.ps1') hook --event SessionStart; exit 1"; exit $LASTEXITCODE'''
timeout = 90

[[hooks.SessionEnd]]
[[hooks.SessionEnd.hooks]]
type = "command"
command = '''pwsh -NoProfile -NonInteractive -Command "& (Join-Path (git rev-parse --show-toplevel) 'scripts/codex/invoke.ps1') hook --event SessionEnd; exit 1"; exit $LASTEXITCODE'''
timeout = 90


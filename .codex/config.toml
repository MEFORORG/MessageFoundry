# Claude Code remains the source of hook policy. The bridge reads it on each event.
# A launcher that cannot run the bridge, or a missing pwsh, is a non-blocking error on every event.
# Where PowerShell runs this line, pwsh -Command reports the launcher's exit 2 as a non-blocking 1.
[features]
hooks = true

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = '''pwsh -NoProfile -NonInteractive -Command "& (Join-Path (git rev-parse --show-toplevel) 'scripts/codex/invoke.ps1') hook --event SessionStart"'''
timeout = 90


# NEGATIVE CONTROLS FOR THE REQUIRED MERGE CONTEXTS  (BACKLOG #1000)
#
# WHY THIS FILE EXISTS. `.github/required-contexts.txt` names the contexts that block merge. It answers
# "is this check blocking?". It cannot answer the question underneath it -- "has anyone ever seen this
# check go red?" -- and a gate nobody has watched fail is an assumption wearing a green tick. The class
# has fired at least four times in this repository, each found by hand and none by CI: a required
# backlog gate computing a two-dot diff and crediting every PR with an older base; a required SAST gate
# scanning a two-directory allow-list while its sibling declared 56 more files in scope; a leak gate
# exiting 0 on content carrying a real site code; the same gate's home-path detector matching one of
# four spellings of the same Windows path.
#
# WHAT A CONTROL IS HERE. Not a re-test of what the gate checks -- the gates' own suites do that. One
# property per context: THIS GATE IS CAPABLE OF GOING RED, evidenced by a planted violation and an
# observed refusal.
#
# EVERY ENTRY IS ASYMMETRIC, and that field is mandatory. It is not enough that neutering a rule turns
# a control red: the control must fail for exactly the shapes that rule covers and KEEP PASSING for the
# shapes some other layer catches, or it cannot tell you which layer does the work. Measured 2026-08-05
# on a different guard -- a fix believed to cover two NTFS alternate-data-stream spellings turned out to
# be load-bearing for exactly one, and only an eight-case control that reddened on one of them said so.
# A uniform red looks stronger and teaches nothing. So `holds` and `green` are as required as `plants`
# and `red`, and `tests/test_negative_controls.py` fails when either is missing.
#
# FORMAT. One `[[control]]` per context (a context may have several).
#   context  the exact string from .github/required-contexts.txt -- checked against it, both ways
#   plants   the violation the control introduces
#   red      pytest node ids that MUST fail if the gate stops catching that violation
#   holds    what the control deliberately does NOT break, and which layer covers it
#   green    pytest node ids for that half -- the shapes that must keep passing
#   observed what was actually seen, and where. Prose only; nothing parses it.
#   ci       (optional) a command wired into the gate's OWN job, asserted present in that job
#   workflow (with `ci`) the workflow file the command must appear in
#
# THIS FILE IS NOT BRANCH PROTECTION AND DOES NOT TOUCH IT. `.github/required-contexts.txt` is
# READ-ONLY here: it mirrors the live server, and a context added to it before the server is exactly
# the lie it exists to prevent. This file only reads it.
#
# WHAT THE SCANNER GATES CAN AND CANNOT BE CONTROLLED FOR, said once rather than repeated per entry.
# bandit, gitleaks, npm-audit, pip-audit and semgrep run third-party binaries the pytest legs do not
# install. Their DETECTION is exercised where the binary lives -- semgrep against annotated fixtures in
# its own CI job, pip-audit's slopsquat half by a stdlib script with its own unit suite. What the pytest
# legs can hold is the property those jobs lose SILENTLY: an enforcement flag removed, a severity floor
# added, an allowlist widened until it swallows the class, a scan re-narrowed to an allow-list. Those
# are the controls registered below, and the distinction is recorded rather than blurred.

# --- ci.yml ----------------------------------------------------------------------------------------

[[control]]
context = "CI gate"
plants = """
One gated leg reports `failure`, then `cancelled`, in a synthetic needs-results vector read through the
roll-up's own `if:` condition. `CI gate` is required BECAUSE the six legs behind it cannot be -- a
path-gated job does not report on a PR that touches none of its paths -- so this roll-up is the only
thing that turns a red sqlserver-store, postgres-store, load-test, load-test-sqlserver or
windows-service-smoke into a blocked merge.
"""
red = [
  "tests/test_merge_gate_controls.py::test_the_ci_gate_rollup_fires_on_a_failed_or_cancelled_leg",
  "tests/test_merge_gate_controls.py::test_the_ci_gate_rollup_still_covers_every_leg_it_is_required_for",
]
holds = """
An all-`skipped` vector must stay GREEN, and that is the case that actually happens: almost every PR
touches none of the six gated paths. A control that reddened on `skipped` would block every ordinary PR
while looking stronger. The reader itself is also controlled -- a condition with `cancelled` removed
must be reported as no longer firing on it, otherwise "the shipped condition is fine" and "the reader
matches nothing" are the same green.
"""
green = [
  "tests/test_merge_gate_controls.py::test_the_ci_gate_rollup_stays_green_when_every_gated_leg_skipped",
  "tests/test_merge_gate_controls.py::test_the_rollup_reader_reports_a_condition_that_dropped_cancelled",
]
observed = """
Live record, quoted in .github/required-contexts.txt: 18 success / 2 failure over 20 runs. One failure
was a nightly `schedule` run whose sqlserver load-test legs failed; one was a superseded re-push where
every job was CANCELLED -- both terminal states this control asserts are still named. Restored to
branch protection 2026-07-30 after checking exactly that record.

RUN AGAINST A NEUTERED GATE, 2026-08-10: with `contains(needs.*.result, 'cancelled')` deleted from
ci.yml, 2 of the 4 roll-up controls went red and 2 stayed green -- the specific result, not a uniform
one. ci.yml was restored from the same run.
"""

[[control]]
context = "test (ubuntu-latest, py3.14)"
plants = """
A test that cannot pass, run by a child pytest outside this repository's rootdir. The assertion is on
the EXIT CODE alone.
"""
red = ["tests/test_merge_gate_controls.py::test_a_failing_test_makes_the_pytest_leg_exit_nonzero"]
holds = """
A passing fixture must leave the runner at exit 0 -- a runner that failed unconditionally would satisfy
the planted case while blocking every PR, and nothing would say which of the two it was. The exit codes
are additionally re-measured with the child pinned to a HOSTILE encoding, because a control that only
ever ran under a favourable ambient value proves nothing about the Windows legs.
"""
green = [
  "tests/test_merge_gate_controls.py::test_a_passing_fixture_leaves_the_pytest_leg_green",
  "tests/test_merge_gate_controls.py::test_the_pytest_exit_code_does_not_depend_on_the_ambient_encoding",
]
observed = """
The planted failure exits non-zero and the passing fixture exits 0, unchanged under
PYTHONIOENCODING=ascii / PYTHONUTF8=0. This is not hypothetical plumbing: BACKLOG #1000 records the
measured case one layer over, where `pwsh -File script.ps1` returned 0 although the script inside died
at parameter binding, making every execution assertion built on that return code vacuously green.
"""

[[control]]
context = "test (windows-2022, py3.14)"
plants = "As the ubuntu leg: a test that cannot pass, asserted on the child's exit code."
red = ["tests/test_merge_gate_controls.py::test_a_failing_test_makes_the_pytest_leg_exit_nonzero"]
holds = """
Same asymmetry, and the encoding half is load-bearing HERE specifically: the Windows legs are where an
ambient code page differs from the author's shell, which is how a wave-2 lane shipped a test that
passed ubuntu and would have reddened these two contexts.
"""
green = [
  "tests/test_merge_gate_controls.py::test_a_passing_fixture_leaves_the_pytest_leg_green",
  "tests/test_merge_gate_controls.py::test_the_pytest_exit_code_does_not_depend_on_the_ambient_encoding",
]
observed = "Run on this Windows worktree; exit codes as above, unchanged under a hostile encoding."

[[control]]
context = "test (windows-2025, py3.14)"
plants = "As the ubuntu leg: a test that cannot pass, asserted on the child's exit code."
red = ["tests/test_merge_gate_controls.py::test_a_failing_test_makes_the_pytest_leg_exit_nonzero"]
holds = "Same asymmetry as the windows-2022 leg; the two differ only in runner image."
green = [
  "tests/test_merge_gate_controls.py::test_a_passing_fixture_leaves_the_pytest_leg_green",
  "tests/test_merge_gate_controls.py::test_the_pytest_exit_code_does_not_depend_on_the_ambient_encoding",
]
observed = "Run on this Windows worktree; exit codes as above, unchanged under a hostile encoding."

# --- security.yml ----------------------------------------------------------------------------------

[[control]]
context = "bandit (Python SAST)"
plants = """
`bandit -ll` against the shipped invocation's muting detector. A severity floor keeps the scanner
running and the exit code intact while discarding a whole severity band -- so the required context goes
on reporting success, and a neutering scan looking for ADDED idioms (`|| true`, `--exit-zero`) cannot
see it. The sibling scope control plants the other half: a scan re-narrowed to an allow-list, which is
BACKLOG #334's shape.
"""
red = [
  "tests/test_merge_gate_controls.py::test_the_bandit_invocation_carries_no_severity_or_confidence_floor",
  "tests/test_lint_scope_parity.py::test_ci_bandit_scans_the_repo_not_an_allow_list",
]
holds = """
The reviewed `--skip B101,B110,B311,B404,B608` list must NOT be flagged. Each entry there is a per-check
exclusion with a stated reason, not a severity floor, and a detector that flagged it would be "fixed" by
deleting a correct annotation. The excludes must also keep matching semgrep's, so widening one gate's
blind spot cannot pass as tightening the other's.
"""
green = [
  "tests/test_merge_gate_controls.py::test_the_muting_detector_fires_on_a_synthetic_floor",
  "tests/test_lint_scope_parity.py::test_semgrep_and_bandit_exclude_the_same_paths",
]
observed = """
The detector fires on a synthetic `bandit -r . -ll --skip B101` and stays clean on the shipped command
in the same call. Detection by bandit itself runs in its own CI job against the pinned scanner lock.

RUN AGAINST A NEUTERED GATE, 2026-08-10: adding `-ll` to security.yml's real bandit invocation turned
1 of the 4 selected controls red and left 3 green; security.yml was restored from the same run.
"""

[[control]]
context = "pip-audit (dependency vulnerabilities)"
plants = """
A hallucinated distribution name, a registered-but-empty project, and a freshly registered one, fed to
`scripts/security/new_dependency_check.py` -- the step in this job that answers what pip-audit
structurally cannot: a hallucinated name has no advisory, so it resolves, locks, hashes and installs
through every other DEP-1 control clean.
"""
red = [
  "tests/test_new_dependency_check.py::test_a_nonexistent_name_is_caught",
  "tests/test_new_dependency_check.py::test_main_exits_1_on_a_hallucinated_name",
  "tests/test_new_dependency_check.py::test_main_exits_2_when_the_sweep_examines_nothing",
]
holds = """
A clean tree must produce no findings AND a non-zero examined count -- "found nothing" and "did not
look" are different answers and only one of them is clean. An allowlisted name must be skipped without
being counted, so the sweep's own liveness number cannot be inflated by entries it never checked.
"""
green = [
  "tests/test_new_dependency_check.py::test_a_clean_tree_produces_no_findings_and_a_nonzero_count",
  "tests/test_new_dependency_check.py::test_the_allowlist_skips_a_name_and_does_not_count_it",
]
observed = """
The planted names are refused and the clean tree passes with a non-zero count, in this suite. The
audit half (pip-audit over three locks) needs the network and the scanner lock and runs in its own job;
its documented blind spot -- a real package that is not the INTENDED one -- is recorded in the script.
"""

[[control]]
context = "npm-audit (ide dependency vulnerabilities)"
plants = """
`npm audit --audit-level=high` against the shipped invocation's muting detector. That flag exits 0 on
moderate advisories, which silently contradicts the job's own comment that the default level "fails on
ANY severity, matching pip-audit's strict posture". The second plant is the quieter one: a missing
`working-directory`, which leaves `--package-lock-only` auditing a tree with no lockfile.
"""
red = [
  "tests/test_merge_gate_controls.py::test_the_npm_audit_invocation_carries_no_severity_floor",
  "tests/test_merge_gate_controls.py::test_the_npm_audit_target_lockfile_exists",
]
holds = """
The shipped `npm audit --package-lock-only` must stay clean under the same detector, so the control is
not simply refusing every flag. `--package-lock-only` is itself an install-free NARROWING of what npm
does, and it is deliberate -- the control must distinguish it from a severity floor.
"""
green = ["tests/test_merge_gate_controls.py::test_the_muting_detector_fires_on_a_synthetic_floor"]
observed = """
The detector fires on the synthetic floor and stays clean on the shipped command; ide/package-lock.json
resolves from the declared working-directory. Detection by npm itself runs in its own CI job.
"""

[[control]]
context = "gitleaks (secret scan)"
plants = """
Six credential shapes the default ruleset exists to catch -- an AWS access key id, a GitHub PAT, a Slack
bot token, a PEM private-key header, a 40-hex token and a URL with an inline database password -- all
ASSEMBLED AT RUNTIME, never committed as literals, and matched against every allowlist regex in
`.gitleaks.toml`. That allowlist is the one place this required context can be disabled without
touching a workflow at all.
"""
red = [
  "tests/test_merge_gate_controls.py::test_no_gitleaks_allowlist_regex_swallows_a_fabricated_secret",
  "tests/test_merge_gate_controls.py::test_the_gitleaks_config_still_extends_the_default_ruleset",
]
holds = """
The shipped allowlist must stay GREEN in the same call that flags two planted broad patterns. The
control is not demanding an empty allowlist -- the entries there are documented non-secret fixtures (a
CI container password, a SOAP placeholder class, a pinned audit-chain digest) and deleting them would
red the gate on correct content, which is how an allowlist gets widened in the first place.
"""
green = [
  "tests/test_merge_gate_controls.py::test_the_allowlist_narrowness_detector_fires_on_a_planted_broad_regex"
]
observed = """
Planted `.{8,}` and `[A-Za-z0-9_/+-]{20,}` are both caught; the shipped entries match none of the six
shapes. This gate has also been seen red in ordinary use: the redaction suite's first JWT fixture was a
literal token and the gitleaks pre-commit hook rejected the commit, which is why that fixture is now
assembled from parts.

RUN AGAINST A NEUTERED GATE, 2026-08-10: replacing one literal allowlist entry in the real
.gitleaks.toml with `[A-Za-z0-9_/+-]{16,}` turned 2 of the 4 selected controls red and left 2 green;
.gitleaks.toml was restored from the same run.
"""

[[control]]
context = "semgrep (project SAST rules)"
plants = """
Annotated handler fixtures carrying inter-statement PHI taint, an aliased import, an ambient subprocess
call, ambient deserialization, ambient eval/exec, an unparameterized db_lookup and a PHI-to-file write.
Each rule must fire EXACTLY as annotated.
"""

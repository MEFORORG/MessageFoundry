red = [
  "tests/test_lint_scope_parity.py::test_ci_semgrep_still_fails_the_build_on_a_finding",
  "tests/test_lint_scope_parity.py::test_ci_semgrep_scans_the_repo_not_an_allow_list",
]
holds = """
The `# ok` cases in the same fixture -- log.debug, msg.control_id, a parameterized db_lookup -- must

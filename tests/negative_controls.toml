# --- backlog-hygiene.yml ---------------------------------------------------------------------------

[[control]]
context = "a PR that implements BACKLOG #N must update BACKLOG.md"
plants = """
A synthetic repository shaped like the PR this gate exists to police: a branch that claims
`BACKLOG #42` and changes engine code and nothing else, while `main` has separately moved
docs/BACKLOG.md since the branch point. The gate's OWN shell is lifted out of the workflow and run
against it -- not a re-implementation, which would be a second copy free to agree with itself.
"""
red = [
  "tests/test_merge_gate_controls.py::test_the_backlog_hygiene_gate_fails_a_code_pr_that_leaves_the_ledger_alone",
  "tests/test_merge_gate_controls.py::test_the_two_dot_form_of_the_gate_passes_the_same_planted_pull_request",
]
holds = """
Four benign shapes must stay green: no claim at all, a claim honoured in the live ledger, a claim
honoured in the ARCHIVE (an item retired between the claim and the PR), and a bare `#42`, which is a PR
number in this repo rather than an item. A gate that failed all four would satisfy the planted case and
block every pull request in the repository.
"""
green = [
  "tests/test_merge_gate_controls.py::test_the_backlog_hygiene_gate_leaves_the_benign_shapes_alone",
  "tests/test_merge_gate_controls.py::test_the_bash_namespace_probe_rejects_an_interpreter_that_cannot_see_the_fixture",
]
observed = """
RUN AGAINST THE PRE-FIX GATE, which is what makes this evidence rather than a claim. The identical
fixture goes RED (exit 1) through the shipped three-dot diff and GREEN (exit 0) with only the diff form
reverted to two-dot. That reproduces the recorded defect exactly: the two-dot form reports main-side
changes as reverse deltas, so any main-side edit to docs/BACKLOG.md credited every PR with an older
base, and the gate went green while enforcing nothing -- on precisely the population it polices.

AND THE CONTROL ITSELF WAS CAUGHT DEPENDING ON ITS AMBIENT ENVIRONMENT, 2026-08-10, before it shipped.
Its first version resolved bash from PATH and passed an absolute Windows path; under a Git Bash parent
it passed, and from PowerShell -- where PATH resolves `bash` to the WSL launcher, a different
filesystem namespace -- all six hygiene assertions failed with exit 127. bash is now derived from
`git`, made to read a file this process wrote before any verdict is believed, and handed a RELATIVE
script path; 126/127 are a hard failure rather than a gate verdict. Re-measured green under a
deliberately hostile ambient (PYTHONIOENCODING=cp1252, PYTHONUTF8=0, LC_ALL=tr_TR.UTF-8, a global
core.autocrlf, and PATH ordered so the WSL bash comes first).
"""

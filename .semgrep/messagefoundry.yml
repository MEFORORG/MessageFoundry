# MessageFoundry SAST rules — high-signal patterns for a PHI-handling HL7 engine. These complement
# bandit; each targets a sink that untrusted HL7/config data must never reach unguarded.
#
# These rules are HARD-FAILING. The security.yml `semgrep` job runs them with --error, so a single
# match fails that job, and the `repo-scan` composite runs the same rules against the same tree.
#
# WHETHER A MATCH BLOCKS A MERGE IS A SECOND QUESTION AND `.github/required-contexts.txt` IS THE ONE
# THAT ANSWERS IT. This header used to answer it here, citing a LINE NUMBER in that file and
# `tests/test_security_posture.py`'s `_BLOCKING_SECURITY_JOBS`, and said it preferred those "two
# checkable facts" to a date. Both citations have since gone false without an edit: the line moved,
# and the `semgrep` job left `_BLOCKING_SECURITY_JOBS` when branch protection dropped it on
# 2026-09-16 in favour of the composite. A checkable fact is only as good as the day you checked it,
# and neither citation carried one -- which is the argument for a pointer over a transcription, not
# against citing evidence (BACKLOG #1705). The previous header's "runs them advisory for one cycle"
# outlived the flip it described in the same way. Scope is the WHOLE REPO minus that job's excludes — deliberately not an
# allow-list. This header deliberately makes no claim that the tree is currently clean: the gate is
# what keeps it clean, and the gate is the only thing that can still say so at a later date.
rules:
  - id: mf-no-shell-true
    languages: [python]
    severity: ERROR
    message: >
      subprocess invoked with shell=True. Build an argv list and call without a shell so an
      HL7- or config-derived value can never be interpreted as a command (command injection).
    pattern: subprocess.$F(..., shell=True, ...)

  - id: mf-no-os-system
    languages: [python]
    severity: ERROR
    message: >
      os.system runs a string through the shell. Use subprocess.run([...]) with an argv list.
    pattern: os.system(...)

  - id: mf-no-eval-exec
    languages: [python]
    severity: ERROR
    message: >
      Dynamic eval/exec is forbidden — never evaluate message- or config-derived data as code.
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: mf-no-insecure-deserialization
    languages: [python]
    severity: ERROR
    message: >
      Unsafe deserialization. pickle/marshal execute arbitrary code; yaml.load without SafeLoader is
      unsafe. Use json, or yaml.safe_load, on any external / message / config-derived data.
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
      - pattern: marshal.load(...)
      - pattern: marshal.loads(...)
      - pattern: yaml.load(...)

  - id: mf-no-tls-verify-disabled
    languages: [python]
    severity: ERROR
    message: >
      TLS verification disabled on an outbound client. Never ship verify=False; keep certificate
      validation on for any downstream connection that carries or triggers PHI movement.
    pattern-either:
      - pattern: requests.$M(..., verify=False, ...)
      - pattern: httpx.$M(..., verify=False, ...)
      - pattern: httpx.Client(..., verify=False, ...)
